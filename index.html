<script type="module">

/* =========================
   FIREBASE
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  get,
  onValue,
  remove,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBQyI-9ESAqE5AFy49hIyP0rhul9gIlkc",

  authDomain:
    "buckshotroulette-4c7a1.firebaseapp.com",

  databaseURL:
    "https://buckshotroulette-4c7a1-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "buckshotroulette-4c7a1",

  storageBucket:
    "buckshotroulette-4c7a1.firebasestorage.app",

  messagingSenderId:
    "335951554199",

  appId:
    "1:335951554199:web:8d7475fc9dda0f76b32bd2",

  measurementId:
    "G-H5RLT7K97W"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


/* =========================
   STATE
========================= */

let currentPlayerId = null;
let currentPlayer = null;
let roomData = null;
let gameData = null;

let gamePlayers = [];

let shotMode = false;
let selectedTarget = null;

let gameWatcherStarted = false;

let roomWatcherStarted = false;

let prepareTimer = null;

let shootingLocked = false;


/* =========================
   CONSTANT
========================= */

const shellCount = 8;


/* =========================
   ELEMENT
========================= */

const loginScreen =
  document.querySelector(".login-screen");

const lobby =
  document.querySelector(".lobby");

const game =
  document.querySelector(".game");

const loginName =
  document.querySelector(".login-name");

const loginProfile =
  document.querySelector(".login-profile");

const loginBtn =
  document.querySelector(".login-btn");

const loginMessage =
  document.querySelector(".login-message");

const createBtn =
  document.querySelector(".create");

const joinBtn =
  document.querySelector(".join");

const startLeft =
  document.querySelector(".start-left");

const startBtn =
  document.querySelector(".start");

const leftBtn =
  document.querySelector(".left");

const roomMessage =
  document.querySelector(".room-message");

const joinList =
  document.querySelector(".join-list");

const shot =
  document.querySelector(".shot");

const playerBtn =
  document.querySelector(".other");

const selfBtn =
  document.querySelector(".self");

const popup =
  document.querySelector(".shot-list");

const overlay =
  document.querySelector(".overlay");

const playerContainer =
  document.querySelector(".st-players");

const shellContainer =
  document.querySelector(".shell");

const aliveCount =
  document.querySelector(".alive-count");

const blankCount =
  document.querySelector(".blank-count");


/* =========================
   NORMALIZE NAME
========================= */

function normalizeName(name) {

  return name
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");

}


/* =========================
   NAME EXISTS
========================= */

async function nameExists(name) {

  const targetName =
    normalizeName(name);

  const snapshot =
    await get(ref(db, "players"));

  if (!snapshot.exists()) {
    return false;
  }

  const players =
    snapshot.val();

  return Object.values(players).some(
    player => {

      return normalizeName(
        player.name || ""
      ) === targetName;

    }
  );

}


/* =========================
   RESERVE NAME
========================= */

async function reserveName(name) {

  const normalized =
    normalizeName(name);

  const nameKey =
    encodeURIComponent(normalized);

  const nameRef =
    ref(db, "names/" + nameKey);

  const result =
    await runTransaction(
      nameRef,
      current => {

        if (current === null) {

          return {

            name: name,

            createdAt: Date.now()

          };

        }

        return;

      }
    );

  return result.committed;

}


/* =========================
   LOAD SAVED PLAYER
========================= */

async function loadSavedPlayer() {

  const savedId =
    localStorage.getItem(
      "buckshotPlayerId"
    );

  if (!savedId) {
    return false;
  }

  const snapshot =
    await get(
      ref(
        db,
        "players/" + savedId
      )
    );

  if (!snapshot.exists()) {

    localStorage.removeItem(
      "buckshotPlayerId"
    );

    return false;

  }

  currentPlayerId =
    savedId;

  currentPlayer =
    snapshot.val();

  return true;

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
  "click",
  async () => {

    loginMessage.textContent = "";

    const name =
      loginName.value.trim();

    const profile =
      loginProfile.value.trim();

    if (!name) {

      loginMessage.textContent =
        "Nama wajib diisi.";

      return;

    }

    if (name.length < 2) {

      loginMessage.textContent =
        "Nama minimal 2 karakter.";

      return;

    }

    loginBtn.disabled = true;

    loginBtn.textContent =
      "Memproses...";

    try {

      const exists =
        await nameExists(name);

      if (exists) {

        loginMessage.textContent =
          "Nama tersebut sudah digunakan.";

        return;

      }

      const reserved =
        await reserveName(name);

      if (!reserved) {

        loginMessage.textContent =
          "Nama tersebut sudah digunakan.";

        return;

      }

      const playerRef =
        push(ref(db, "players"));

      currentPlayerId =
        playerRef.key;

      currentPlayer = {

        name: name,

        profile: profile,

        createdAt: Date.now()

      };

      await set(
        playerRef,
        currentPlayer
      );

      localStorage.setItem(
        "buckshotPlayerId",
        currentPlayerId
      );

      showLobby();

    } catch (error) {

      console.error(error);

      loginMessage.textContent =
        "Gagal masuk. Periksa koneksi Firebase.";

    } finally {

      loginBtn.disabled = false;

      loginBtn.textContent =
        "Masuk";

    }

  }
);


/* =========================
   SHOW LOGIN
========================= */

function showLogin() {

  loginScreen.classList.remove(
    "hidden"
  );

  lobby.classList.add(
    "hidden"
  );

  game.classList.add(
    "hidden"
  );

}


/* =========================
   SHOW LOBBY
========================= */

function showLobby() {

  loginScreen.classList.add(
    "hidden"
  );

  lobby.classList.remove(
    "hidden"
  );

  game.classList.add(
    "hidden"
  );

  closeShotPopup();

  resetShot();

  updateHeader();

  watchRoom();

}


/* =========================
   UPDATE HEADER
========================= */

function updateHeader() {

  if (!currentPlayer) {
    return;
  }

  const name =
    currentPlayer.name || "?";

  const profile =
    currentPlayer.profile || "";

  const firstLetter =
    name.charAt(0).toUpperCase();

  document
    .querySelectorAll(
      ".header-name, .game-name"
    )
    .forEach(element => {

      element.textContent = name;

    });

  document
    .querySelectorAll(
      ".header-profile, .game-profile"
    )
    .forEach(element => {

      if (profile) {

        element.innerHTML = `

          <img
            src="${profile}"
            alt="Profile">

        `;

      } else {

        element.textContent =
          firstLetter;

      }

    });

}


/* =========================
   WATCH ROOM
========================= */

function watchRoom() {

  if (roomWatcherStarted) {
    return;
  }

  roomWatcherStarted = true;

  onValue(
    ref(db, "room"),
    async snapshot => {

      roomData =
        snapshot.exists()
          ? snapshot.val()
          : null;

      await renderRoom();

    }
  );

}


/* =========================
   RENDER ROOM
========================= */

async function renderRoom() {

  if (!roomData) {

    createBtn.classList.remove(
      "hidden"
    );

    joinBtn.classList.add(
      "hidden"
    );

    startLeft.classList.add(
      "hidden"
    );

    roomMessage.textContent =
      "Belum ada room.";

    joinList.innerHTML = "";

    document.querySelector(
      ".online"
    ).textContent = "0";

    return;

  }


  if (roomData.status === "playing") {

    const joined =
      roomData.players &&
      roomData.players[
        currentPlayerId
      ];

    if (joined) {

      await enterGame();

      return;

    }

    createBtn.classList.add(
      "hidden"
    );

    joinBtn.classList.add(
      "hidden"
    );

    startLeft.classList.add(
      "hidden"
    );

    roomMessage.textContent =
      "Game sedang berjalan. Tunggu game selesai.";

    return;

  }


  const roomPlayers =
    roomData.players || {};

  const joined =
    !!roomPlayers[
      currentPlayerId
    ];

  createBtn.classList.toggle(
    "hidden",
    !!roomData
  );

  joinBtn.classList.toggle(
    "hidden",
    joined
  );

  startLeft.classList.toggle(
    "hidden",
    !joined
  );

  roomMessage.textContent =
    joined
      ? "Kamu berada di room."
      : "Room tersedia. Tekan Join untuk masuk.";

  const playerIds =
    Object.keys(roomPlayers);

  document.querySelector(
    ".online"
  ).textContent =
    playerIds.length;

  await renderLobbyPlayers(
    playerIds
  );

}


/* =========================
   RENDER LOBBY PLAYERS
========================= */

/* =========================
   SHUFFLE ARRAY
========================= */

function shuffleArray(array) {

  const result =
    [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}


/* =========================
   CREATE GAME STATE
========================= */

function createGameState(
  playerIds
) {

  const shuffledPlayers =
    shuffleArray(playerIds);

  const gamePlayersData = {};

  shuffledPlayers.forEach(
    (playerId, index) => {

      gamePlayersData[playerId] = {

        hp: 3,

        turnOrder: index

      };

    }
  );


  const alive =
    Math.floor(
      Math.random() * 7
    ) + 1;

  const blank =
    shellCount - alive;


  const shellData = [];


  for (
    let i = 0;
    i < alive;
    i++
  ) {

    shellData.push(
      "live"
    );

  }


  for (
    let i = 0;
    i < blank;
    i++
  ) {

    shellData.push(
      "blank"
    );

  }


  const shuffledShells =
    shuffleArray(shellData);


  const now =
    Date.now();


  return {

    phase:
      "preparing",

    prepareEndsAt:
      now + 3000,

    players:
      gamePlayersData,

    turn: {

      current:
        shuffledPlayers[0],

      index: 0

    },

    shells: {

      total: 8,

      alive: alive,

      blank: blank,

      current: 0,

      sequence:
        shuffledShells

    },

    startedAt:
      now

  };

}

      const roomRef =
        ref(db, "room");

        await runTransaction(
          roomRef,
          room => {

            if (!room) {
              return;
            }

            if (
              room.status ===
              "playing"
            ) {

              return;

            }

            const players =
              room.players || {};

            const playerIds =
              Object.keys(players);

            if (
              playerIds.length < 2
            ) {

              return;

            }

            if (
              !players[
                currentPlayerId
              ]
            ) {

              return;

            }

            const gameState =
              createGameState(
                playerIds
              );

            return {

              ...room,

              status:
                "playing",

              game:
                gameState

            };

          }
        );


      if (!result.committed) {

        const snapshot =
          await get(
            ref(db, "room")
          );

        if (
          snapshot.exists() &&
          snapshot.val().status ===
          "lobby"
        ) {

          const players =
            snapshot.val().players ||
            {};

          if (
            Object.keys(players).length <
            2
          ) {

            roomMessage.textContent =
              "Minimal 2 pemain untuk memulai.";

          }

        }

      }

    } catch (error) {

      console.error(error);

      roomMessage.textContent =
        "Gagal memulai game.";

    } finally {

      startBtn.disabled = false;

    }

  }
);

/* =========================
   LOAD GAME PLAYERS
========================= */

async function loadGamePlayers() {

  gamePlayers = [];

  if (
    !gameData ||
    !gameData.players
  ) {

    return;

  }

  const playerData =
    gameData.players;

  const sortedPlayers =
    Object.entries(
      playerData
    ).sort(
      ([, a], [, b]) =>
        Number(
          a.turnOrder ?? 0
        ) -
        Number(
          b.turnOrder ?? 0
        )
    );


  for (
    const [
      playerId,
      gamePlayer
    ]
    of sortedPlayers
  ) {

    const snapshot =
      await get(
        ref(
          db,
          "players/" +
          playerId
        )
      );

    if (
      !snapshot.exists()
    ) {

      continue;

    }

    const player =
      snapshot.val();

    gamePlayers.push({

      id:
        playerId,

      name:
        player.name ||
        "Unknown",

      profile:
        player.profile ||
        "",

      hp:
        Number(
          gamePlayer.hp ?? 3
        ),

      turnOrder:
        Number(
          gamePlayer.turnOrder ??
          0
        )

    });

  }

}

/* =========================
   PREPARATION
========================= */

function updatePreparation() {

  if (
    !gameData ||
    gameData.phase !==
    "preparing"
  ) {

    clearPreparationTimer();

    document.querySelector(
      ".random-shell"
    ).classList.add(
      "hidden"
    );

    return;

  }


  document.querySelector(
    ".random-shell"
  ).classList.remove(
    "hidden"
  );


  shot.classList.add(
    "hidden"
  );

  disableShotButtons();

  resetShot(false);


  const endsAt =
    Number(
      gameData.prepareEndsAt || 0
    );


  const remaining =
    endsAt - Date.now();


  if (
    remaining <= 0
  ) {

    finishPreparation();

    return;

  }


  if (prepareTimer) {
    return;
  }


  prepareTimer =
    setTimeout(
      () => {

        prepareTimer = null;

        finishPreparation();

      },
      remaining + 50
    );

}


/* =========================
   CLEAR PREPARATION TIMER
========================= */

function clearPreparationTimer() {

  if (!prepareTimer) {
    return;
  }

  clearTimeout(
    prepareTimer
  );

  prepareTimer = null;

}


/* =========================
   FINISH PREPARATION
========================= */

async function finishPreparation() {

  if (
    !gameData ||
    gameData.phase !==
    "preparing"
  ) {

    return;

  }


  const gameRef =
    ref(
      db,
      "room/game"
    );


  try {

    const result =
      await runTransaction(
        gameRef,
        game => {

          if (!game) {
            return;
          }

          if (
            game.phase !==
            "preparing"
          ) {

            return;

          }

          const endsAt =
            Number(
              game.prepareEndsAt || 0
            );

          if (
            Date.now() <
            endsAt
          ) {

            return;

          }

          return {

            ...game,

            phase:
              "playing"

          };

        }
      );


    if (
      !result.committed
    ) {

      const snapshot =
        await get(
          gameRef
        );

      if (
        snapshot.exists()
      ) {

        gameData =
          snapshot.val();

        await renderGameState();

      }

    }

  } catch (error) {

    console.error(
      "Finish preparation error:",
      error
    );

  }

}


/* =========================
   CURRENT TURN
========================= */

function updateCurrentTurn() {

  if (
    !gameData ||
    !gameData.turn
  ) {

    return;

  }

  const currentId =
    gameData.turn.current;

  const currentPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentId
    );

  if (!currentPlayer) {

    document.querySelector(
      ".game-current-name"
    ).textContent =
      "-";

    return;

  }

  document.querySelector(
    ".game-current-name"
  ).textContent =
    currentPlayer.name;

}


/* =========================
   NEXT PLAYER
========================= */

function updateNextPlayer() {

  const nextElement =
    document.querySelector(
      ".next-name"
    );


  if (
    !gameData ||
    !gameData.turn ||
    gamePlayers.length <= 1
  ) {

    nextElement.textContent =
      "-";

    return;

  }


  const currentIndex =
    Number(
      gameData.turn.index ?? 0
    );


  const nextIndex =
    (
      currentIndex + 1
    ) %
    gamePlayers.length;


  const nextPlayer =
    gamePlayers[
      nextIndex
    ];


  nextElement.textContent =
    nextPlayer
      ? nextPlayer.name
      : "-";

}


/* =========================
   GAME HEALTH
========================= */

function updateGameHealth() {

  if (
    !gameData ||
    !gameData.turn
  ) {

    return;

  }


  const currentId =
    gameData.turn.current;


  const currentPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentId
    );


  if (!currentPlayer) {
    return;
  }


  const healthContainer =
    document.querySelector(
      ".healt"
    );


  healthContainer.innerHTML = "";


  const hp =
    Math.max(
      0,
      Math.min(
        3,
        currentPlayer.hp
      )
    );


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const icon =
      document.createElement("i");

    icon.setAttribute(
      "data-lucide",
      i < hp
        ? "zap"
        : "zap-off"
    );

    if (
      i >= hp
    ) {

      icon.classList.add(
        "hp-off"
      );

    }

    healthContainer.appendChild(
      icon
    );

  }


  lucide.createIcons();

}


/* =========================
   SHOT VISIBILITY
========================= */

function updateShotVisibility() {

  if (
    !gameData ||
    gameData.phase !==
    "playing" ||
    !gameData.turn
  ) {

    shot.classList.add(
      "hidden"
    );

    disableShotButtons();

    return;

  }


  const myTurn =
    gameData.turn.current ===
    currentPlayerId;


  shot.classList.toggle(
    "hidden",
    !myTurn
  );


  if (!myTurn) {

    resetShot();

    return;

  }


  if (
    Number(
      gameData.shells?.current || 0
    ) >= shellCount
  ) {

    shot.classList.add(
      "hidden"
    );

    disableShotButtons();

    return;

  }

}

/* =========================
   SHOOT
========================= */

async function shoot(targetId) {
  if (!gameData) return;

  const currentTurn = gameData.turn?.current;

  if (currentTurn !== currentPlayerId) {
    alert("Bukan giliran kamu.");
    return;
  }

  const shellIndex = gameData.shells?.current ?? 0;
  const sequence = gameData.shells?.sequence;

  if (shellIndex >= 8 || !sequence) {
    alert("Tidak ada shell tersisa.");
    return;
  }

  const shell = sequence[shellIndex];

  if (!shell) {
    alert("Shell tidak ditemukan.");
    return;
  }

  const isAlive = shell === "live";
  const isSelf = targetId === currentPlayerId;

  let shotResult = null;
  let nextPlayerId = null;

  const gameRef = ref(db, "room/game");

  const result = await runTransaction(gameRef, currentGame => {
    if (!currentGame) return;

    if (currentGame.phase !== "playing") {
      return;
    }

    if (currentGame.turn?.current !== currentPlayerId) {
      return;
    }

    const currentShell = currentGame.shells?.current ?? 0;
    const currentSequence = currentGame.shells?.sequence;

    if (currentShell >= 8 || !currentSequence) {
      return;
    }

    const currentShellType = currentSequence[currentShell];

    if (!currentShellType) {
      return;
    }

    const players = currentGame.players || {};

    if (!players[targetId]) {
      return;
    }

    const playerIds = Object.keys(players)
      .filter(id => players[id])
      .sort((a, b) => {
        return (players[a].turnOrder ?? 0) - (players[b].turnOrder ?? 0);
      });

    if (!playerIds.length) {
      return;
    }

    const targetPlayer = players[targetId];

    if (!targetPlayer) {
      return;
    }

    // Ambil HP saat ini
    const targetHp = Number(targetPlayer.hp ?? 0);

    // ==========================================
    // ALIVE
    // ==========================================
    if (currentShellType === "live") {
      targetPlayer.hp = Math.max(0, targetHp - 1);
      shotResult = "live";
    }

    // ==========================================
    // BLANK
    // ==========================================
    else {
      shotResult = "blank";
    }

    // Shell berikutnya
    currentGame.shells.current = currentShell + 1;

    // ==========================================
    // TENTUKAN GILIRAN
    // ==========================================
    //
    // Blank + diri sendiri
    // = tetap giliran pemain sekarang
    //
    if (currentShellType === "blank" && isSelf) {
      nextPlayerId = currentPlayerId;

      currentGame.turn.current = currentPlayerId;
      currentGame.turn.index =
        playerIds.indexOf(currentPlayerId);
    }

    // Semua kondisi lainnya = ganti giliran
    else {
      const currentIndex = playerIds.indexOf(currentPlayerId);

      const nextIndex =
        (currentIndex + 1) % playerIds.length;

      nextPlayerId = playerIds[nextIndex];

      currentGame.turn.current = nextPlayerId;
      currentGame.turn.index = nextIndex;
    }

    return currentGame;
  });

  if (!result.committed) {
    alert("Tembakan gagal. Silakan coba lagi.");
    return;
  }

  shotMode = false;
  selectedTarget = null;

  document.querySelector(".shot-list").classList.remove("show");
  document.querySelector(".overlay").classList.remove("show");

  if (shotResult === "live") {
    alert(
      "💥 LIVE!\n\n" +
      (isSelf ? "Kamu terkena peluru!" : "Target terkena peluru!")
    );
  } else {
    alert("⚪ BLANK!");
  }

  renderGameState(gameData);
}

}


/* =========================
   RESET SHOT
========================= */

function resetShot(
  hideShotMode = true
) {

  shotMode = false;

  selectedTarget = null;

  shot.classList.remove(
    "active"
  );

  disableShotButtons();

}


/* =========================
   CLICK OUTSIDE
========================= */

document.addEventListener(
  "click",
  event => {

    if (!shotMode) {
      return;
    }


    const clickedShot =
      event.target.closest(
        ".shot"
      );


    const clickedPlayerBtn =
      event.target.closest(
        ".other"
      );


    const clickedSelfBtn =
      event.target.closest(
        ".self"
      );


    const clickedPopup =
      event.target.closest(
        ".shot-list"
      );


    if (clickedShot) {
      return;
    }


    if (clickedPlayerBtn) {
      return;
    }


    if (clickedSelfBtn) {
      return;
    }


    if (clickedPopup) {
      return;
    }


    resetShot();

  }
);


/* =========================
   INITIALIZE
========================= */

async function initialize() {

  try {

    const loaded =
      await loadSavedPlayer();


    if (loaded) {

      showLobby();

    } else {

      showLogin();

    }

  } catch (error) {

    console.error(error);

    showLogin();

  }

}


/* =========================
   LUCIDE
========================= */

lucide.createIcons();


/* =========================
   START
========================= */

initialize();

</script>
