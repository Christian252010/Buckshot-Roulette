/* =========================

/* =========================
   NORMALIZE NAME
========================= */

function normalizeName(name) {

  return name
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");

}


/* =========================
   NAME EXISTS
========================= */

async function nameExists(name) {

  const targetName =
    normalizeName(name);

  const snapshot =
    await get(
      ref(db, "players")
    );

  if (!snapshot.exists()) {
    return false;
  }

  const players =
    snapshot.val();

  return Object.values(players).some(
    player => {

      return normalizeName(
        player.name || ""
      ) === targetName;

    }
  );

}


/* =========================
   RESERVE NAME
========================= */

async function reserveName(name) {

  const normalized =
    normalizeName(name);

  const nameKey =
    encodeURIComponent(normalized);

  const nameRef =
    ref(
      db,
      "names/" + nameKey
    );

  const result =
    await runTransaction(
      nameRef,
      current => {

        if (current === null) {

          return {

            name: name,

            createdAt: Date.now()

          };

        }

        return;

      }
    );

  return result.committed;

}


/* =========================
   LOAD SAVED PLAYER
========================= */

async function loadSavedPlayer() {

  const savedId =
    localStorage.getItem(
      "buckshotPlayerId"
    );

  if (!savedId) {
    return false;
  }

  const snapshot =
    await get(
      ref(
        db,
        "players/" + savedId
      )
    );

  if (!snapshot.exists()) {

    localStorage.removeItem(
      "buckshotPlayerId"
    );

    return false;

  }

  currentPlayerId =
    savedId;

  currentPlayer =
    snapshot.val();

  return true;

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
  "click",
  async () => {

    loginMessage.textContent = "";

    const name =
      loginName.value.trim();

    const profile =
      loginProfile.value.trim();

    if (!name) {

      loginMessage.textContent =
        "Nama wajib diisi.";

      return;

    }

    if (name.length < 2) {

      loginMessage.textContent =
        "Nama minimal 2 karakter.";

      return;

    }

    loginBtn.disabled = true;

    loginBtn.textContent =
      "Memproses...";

    try {

      const exists =
        await nameExists(name);

      if (exists) {

        loginMessage.textContent =
          "Nama tersebut sudah digunakan.";

        return;

      }

      const reserved =
        await reserveName(name);

      if (!reserved) {

        loginMessage.textContent =
          "Nama tersebut sudah digunakan.";

        return;

      }

/* =========================
   RENDER ROOM
========================= */

async function renderRoom() {

  if (!roomData) {

    hideWinnerScreen();

    if (!game.classList.contains("hidden")) {
      showLobby();
    }

    createBtn.classList.remove(
      "hidden"
    );

    joinBtn.classList.add(
      "hidden"
    );

    startLeft.classList.add(
      "hidden"
    );

    roomMessage.textContent =
      "Belum ada room.";

    joinList.innerHTML = "";

    document.querySelector(
      ".online"
    ).textContent = "0";

    return;

  }


  if (
    roomData.status ===
    "playing"
  ) {

    const joined =
      roomData.players &&
      roomData.players[
        currentPlayerId
      ];

    if (joined) {

      await enterGame();

      return;

    }

    createBtn.classList.add(
      "hidden"
    );

    joinBtn.classList.add(
      "hidden"
    );

    startLeft.classList.add(
      "hidden"
    );

    roomMessage.textContent =
      "Game sedang berjalan. Tunggu game selesai.";

    return;

  }


  const roomPlayers =
    roomData.players || {};

  const joined =
    !!roomPlayers[
      currentPlayerId
    ];

  createBtn.classList.toggle(
    "hidden",
    !!roomData
  );

  joinBtn.classList.toggle(
    "hidden",
    joined
  );

  startLeft.classList.toggle(
    "hidden",
    !joined
  );

  roomMessage.textContent =
    joined
      ? "Kamu berada di room."
      : "Room tersedia. Tekan Join untuk masuk.";

  const playerIds =
    Object.keys(roomPlayers);

  document.querySelector(
    ".online"
  ).textContent =
    playerIds.length;

  await renderLobbyPlayers(
    playerIds
  );

async function renderLobbyPlayers(
  playerIds
) {

    ++lobbyRenderToken;

    joinList.innerHTML = `

      <div class="empty-room">
        Belum ada pemain.
      </div>

  }

  for (
    const playerId of playerIds
  ) {

      await get(
        ref(

          "players/" +

        )
      );

    if (!snapshot.exists()) {

    }

    if (renderToken !== lobbyRenderToken) {
      return;
    }

    const player =
      snapshot.val();

    const item =
      document.createElement("div");

    item.className =
      "pl-list";

    const profile =
      player.profile || "";

      (player.name || "?")
        .charAt(0)
        .toUpperCase();

      profile

        ? `

          <div class="profile">

            <img

          </div>

          <div class="profile">
            ${firstLetter}

/* =========================
   SHUFFLE ARRAY
========================= */

function shuffleArray(array) {

  const result =
    [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}


/* =========================
   CREATE GAME STATE
========================= */

function createShellSet() {

  const alive =
    Math.floor(
      Math.random() * 7
    ) + 1;

  const blank =
    shellCount - alive;

  const shellData =
    [];

  for (
    let i = 0;
    i < alive;
    i++
  ) {

    shellData.push(
      "live"
    );

  }

  for (
    let i = 0;
    i < blank;
    i++
  ) {

    shellData.push(
      "blank"
    );

  }

  return {

    setId:
      Date.now().toString(36) +
      Math.random().toString(36).slice(2, 8),

    total:
      shellCount,

    alive,

    blank,

    current:
      0,

    sequence:
      shuffleArray(shellData)

  };

}


/* =========================
   CREATE GAME STATE
========================= */

function createGameState(
  playerIds
) {

  const shuffledPlayers =
    shuffleArray(playerIds);

  const gamePlayersData =
    {};

  shuffledPlayers.forEach(
    (playerId, index) => {

      gamePlayersData[playerId] = {

        hp: 3,

        turnOrder: index

      };

    }
  );

  const shells =
    createShellSet();

  const now =
    Date.now();

  return {

    phase:
      "preparing",

    prepareEndsAt:
      now + 3000,

    players:
      gamePlayersData,

    turn: {

      current:
        shuffledPlayers[0],

      index: 0

    },

    shells,

    startedAt:
      now

  };

}

startBtn.addEventListener(
  "click",
  async () => {

    if (!currentPlayerId) {
      return;
    }

    startBtn.disabled = true;

    try {

      const roomRef =
        ref(db, "room");

      const result =
        await runTransaction(
          roomRef,
          room => {

            if (!room) {
              return;
            }

            if (
              room.status ===
              "playing"
            ) {

              return;

            }

            const players =
              room.players || {};

            const playerIds =
              Object.keys(players);

            if (
              playerIds.length < 2
            ) {

              return;

            }

            if (
              !players[
                currentPlayerId
              ]
            ) {

              return;

            }

            const gameState =
              createGameState(
                playerIds
              );

            return {

              ...room,

              status:
                "playing",

              game:
                gameState

            };

          }
        );


      if (
        !result.committed
      ) {

        const snapshot =
          await get(
            ref(db, "room")
          );

        if (
          snapshot.exists() &&
          snapshot.val().status ===
          "lobby"
        ) {

          const players =
            snapshot.val().players ||
            {};

          if (
            Object.keys(players).length <
            2
          ) {

            roomMessage.textContent =
              "Minimal 2 pemain untuk memulai.";

          }

        }

      }

    } catch (error) {

      console.error(error);

      roomMessage.textContent =
        "Gagal memulai game.";

    } finally {

      startBtn.disabled = false;

    }

  }
);

/* =========================
   LOAD GAME PLAYERS
========================= */

async function loadGamePlayers() {

  if (
    !gameData ||
    !gameData.players
  ) {

    gamePlayers = [];
    return;

  }

  const sortedPlayers =
    Object.entries(
      gameData.players
    ).sort(
      ([, a], [, b]) =>
        Number(a.turnOrder ?? 0) -
        Number(b.turnOrder ?? 0)
    );

  const loadedPlayers =
    await Promise.all(
      sortedPlayers.map(
        async ([playerId, gamePlayer]) => {

          const snapshot =
            await get(
              ref(
                db,
                "players/" + playerId
              )
            );

          if (!snapshot.exists()) {
            return null;
          }

          const player = snapshot.val();

          return {
            id: playerId,
            name: player.name || "Unknown",
            profile: player.profile || "",
            hp: Number(gamePlayer.hp ?? 3),
            turnOrder: Number(gamePlayer.turnOrder ?? 0)
          };

        }
      )
    );

  gamePlayers = loadedPlayers.filter(Boolean);

}

/* =========================
   RENDER GAME STATE
========================= */

async function renderGameState() {

  if (!gameData) {
    return;
  }

  await loadGamePlayers();

  renderShellInfo();

  document.querySelector(
    ".game-online"
  ).textContent =
    gamePlayers.length;

  updateCurrentTurn();

  updateGameHealth();

  updateNextPlayer();

  updateShotVisibility();

  updatePreparation();

  handleGameFinished();

}


/* =========================
   HANDLE GAME FINISHED
========================= */

function handleGameFinished() {

  if (
    !gameData ||
    gameData.phase !==
    "finished"
  ) {

    hideWinnerScreen();
    return;

  }

  const winnerId =
    gameData.winner ||
    null;

  if (!winnerId) {
    return;
  }

  const gameStartedAt =
    gameData.startedAt || null;

  if (
    winnerId === lastWinnerId &&
    gameStartedAt === lastFinishedStartedAt
  ) {
    return;
  }

  lastWinnerId =
    winnerId;
  lastFinishedStartedAt =
    gameStartedAt;

  const winner =
    gamePlayers.find(
      player =>
        player.id === winnerId
    );

  const winnerNameText =
    winner?.name ||
    "Unknown";

  showWinnerScreen(
    winnerNameText
  );

}


function showWinnerScreen(
  name
) {

  if (winnerTimer) {
    clearTimeout(winnerTimer);
    winnerTimer = null;
  }

  winnerCleanupStartedAt =
    gameData?.startedAt ||
    Date.now();

  winnerScreen.classList.remove(
    "hidden"
  );

  winnerTitle.textContent = "";
  winnerName.textContent = name;
  winnerTitle.style.color = "white";
  winnerName.style.transform =
    "scaleY(0)";
  winnerCard.style.animation =
    "winnerSlide 0.6s linear forwards";
  winnerTrophy.style.animation =
    "winnerSpin 0.6s linear 1 forwards";
  winnerTrophyIcon.style.animation =
    "winnerShake 2.5s ease-in-out 4";

  const text = "WINNER";

  text.split("").forEach(
    (char, index) => {
      setTimeout(() => {
        winnerTitle.textContent +=
          char;
      }, index * 120);
    }
  );

  const titleEnd =
    text.length * 120;

  setTimeout(() => {
    winnerTitle.style.color =
      "gold";
  }, titleEnd + 100);

  setTimeout(() => {
    winnerName.style.transform =
      "scaleY(1)";
  }, titleEnd + 180);

  winnerTimer = setTimeout(
    () => {
      cleanupFinishedRoom(
        winnerCleanupStartedAt
      );
    },
    7000
  );

}


function hideWinnerScreen() {

  if (winnerTimer) {
    clearTimeout(winnerTimer);
    winnerTimer = null;
  }

  winnerScreen.classList.add(
    "hidden"
  );

  winnerTitle.textContent = "";
  winnerName.textContent = "";
  winnerTitle.style.color = "white";
  winnerName.style.transform =
    "scaleY(0)";
  winnerCard.style.animation = "none";
  winnerTrophy.style.animation = "none";
  winnerTrophyIcon.style.animation =
    "none";
}


async function cleanupFinishedRoom(
  startedAt
) {

  if (!startedAt) {
    return;
  }

  try {

    await runTransaction(
      ref(db, "room"),
      room => {

        if (!room) {
          return;
        }

        if (
          room.status !== "playing" ||
          room.game?.phase !== "finished" ||
          room.game?.startedAt !== startedAt
        ) {
          return;
        }

        return null;

      }
    );

  } catch (error) {

    console.error(
      "Gagal menghapus room:",
      error
    );

  }

}

/* =========================
   RENDER SHELL INFO
========================= */

function renderShellInfo() {

      gameData.shells?.alive || 0
    );

  const blank =
    Number(

    );

  aliveCount.textContent =

    ) {

      );

    shellContainer.appendChild(
      icon
    );

  if (
    setId &&
    setId !== shellRenderId &&
    gameData.phase === "playing"
  ) {

    shellRenderId = setId;

  } else if (
    setId &&

  ) {

function triggerDamageFlash() {

/* =========================
   PREPARATION
========================= */

function updatePreparation() {

  if (
    !gameData ||
    gameData.phase !==
    "preparing"
  ) {

    clearPreparationTimer();

    document.querySelector(
      ".random-shell"
    ).classList.add(
      "hidden"
    );

    return;

  }


  document.querySelector(
    ".random-shell"
  ).classList.remove(
    "hidden"
  );


  shot.classList.add(
    "hidden"
  );

  disableShotButtons();

  resetShot(false);


  const endsAt =
    Number(
      gameData.prepareEndsAt || 0
    );


  const remaining =
    endsAt - Date.now();


  if (
    remaining <= 0
  ) {

    finishPreparation();

    return;

  }


  if (prepareTimer) {
    return;
  }


  prepareTimer =
    setTimeout(
      () => {

        prepareTimer = null;

        finishPreparation();

      },
      remaining + 50
    );

}


/* =========================
   CLEAR PREPARATION TIMER
========================= */

function clearPreparationTimer() {

  if (!prepareTimer) {
    return;
  }

  clearTimeout(
    prepareTimer
  );

  prepareTimer = null;

}


/* =========================
   FINISH PREPARATION
========================= */

async function finishPreparation() {

  if (
    !gameData ||
    gameData.phase !==
    "preparing"
  ) {

    return;

  }


  const gameRef =
    ref(
      db,
      "room/game"
    );


  try {

    const result =
      await runTransaction(
        gameRef,
        game => {

          if (!game) {
            return;
          }

          if (
            game.phase !==
            "preparing"
          ) {

            return;

          }

          const endsAt =
            Number(
              game.prepareEndsAt || 0
            );

          if (
            Date.now() <
            endsAt
          ) {

            return;

          }

          return {

            ...game,

            phase:
              "playing"

          };

        }
      );


    if (
      result.committed &&
      shotResult === "live" &&
      isSelf
    ) {

      triggerDamageFlash();

    }

    if (
      !result.committed
    ) {

      const snapshot =
        await get(
          gameRef
        );

      if (
        snapshot.exists()
      ) {

        gameData =
          snapshot.val();

        await renderGameState();

      }

    }

  } catch (error) {

    console.error(
      "Finish preparation error:",
      error
    );

  }

}


/* =========================
   CURRENT TURN
========================= */

function updateCurrentTurn() {

  const currentElement =
    document.querySelector(
      ".game-current-name"
    );

  if (
    !gameData ||
    !gameData.turn
  ) {

    currentElement.textContent =
      "-";

    return;

  }


  const currentId =
    gameData.turn.current;


  const currentPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentId
    );


  currentElement.textContent =
    currentPlayer
      ? currentPlayer.name
      : "-";

}


/* =========================
   NEXT PLAYER
========================= */

function updateNextPlayer() {

  const nextElement =
    document.querySelector(
      ".next-name"
    );

  if (
    !gameData ||
    !gameData.turn
  ) {

    nextElement.textContent =
      "-";

    return;

  }

  const currentId =
    gameData.turn.current;

  const currentIndex =
    gamePlayers.findIndex(
      player =>
        player.id === currentId
    );

  if (currentIndex < 0) {

    nextElement.textContent =
      "-";

    return;

  }

  const livingPlayers =
    gamePlayers.filter(
      player =>
        player.hp > 0
    );

  if (livingPlayers.length <= 1) {

    nextElement.textContent =
      "-";

    return;

  }

  for (
    let step = 1;
    step <= gamePlayers.length;
    step++
  ) {

    const nextIndex =
      (currentIndex + step) %
      gamePlayers.length;

    const nextPlayer =
      gamePlayers[nextIndex];

    if (
      nextPlayer &&
      nextPlayer.hp > 0
    ) {

      nextElement.textContent =
        nextPlayer.name;

      return;

    }

  }

  nextElement.textContent =
    "-";

}


/* =========================
   GAME HEALTH
========================= */

function updateGameHealth() {

  const healthContainer =
    document.querySelector(
      ".healt"
    );


  healthContainer.innerHTML = "";


  /*
    HP YANG DITAMPILKAN ADALAH
    HP PEMAIN SENDIRI.
  */

  const myPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentPlayerId
    );


  if (!myPlayer) {

    return;

  }


  const hp =
    Math.max(
      0,
      Math.min(
        3,
        Number(
          myPlayer.hp ?? 0
        )
      )
    );


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const icon =
      document.createElement("i");


    if (
      i < 3 - hp
    ) {

      icon.setAttribute(
        "data-lucide",
        "zap-off"
      );

      icon.classList.add(
        "hp-off"
      );

    } else {

      icon.setAttribute(
        "data-lucide",
        "zap"
      );

    }


    healthContainer.appendChild(
      icon
    );

  }


  lucide.createIcons();

}


/* =========================
   SHOT VISIBILITY
========================= */

function updateShotVisibility() {

  if (
    !gameData ||
    gameData.phase !==
    "playing" ||
    !gameData.turn
  ) {

    shot.classList.add(
      "hidden"
    );

    disableShotButtons();

    return;

  }


  const myTurn =
    gameData.turn.current ===
    currentPlayerId;


  shot.classList.toggle(
    "hidden",
    !myTurn
  );


  if (!myTurn) {

    resetShot();

    return;

  }


  const myPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentPlayerId
    );


  if (
    !myPlayer ||
    myPlayer.hp <= 0
  ) {

    shot.classList.add(
      "hidden"
    );

    disableShotButtons();

    return;

  }


  if (
    Number(
      gameData.shells?.current || 0
    ) >= shellCount
  ) {

    shot.classList.add(
      "hidden"
    );

    disableShotButtons();

    return;

  }

}


/* =========================
   CLICK SHOTGUN
========================= */

shot.addEventListener(
  "click",
  () => {

    if (shootingLocked) {
      return;
    }

    if (
      !gameData ||
      gameData.phase !==
      "playing"
    ) {

      return;

    }

    if (
      !gameData.turn ||
      gameData.turn.current !==
      currentPlayerId
    ) {

      return;

    }

    const shellIndex =
      Number(
        gameData.shells?.current || 0
      );


    if (
      shellIndex >= shellCount
    ) {

      alert(
        "Semua shell sudah habis."
      );

      return;

    }


    shotMode = true;

    shot.classList.add(
      "active"
    );

    enableShotButtons();

  }
);

   PLAYER BUTTON

playerBtn.addEventListener(

/* =========================

selfBtn.addEventListener(

/* =========================
   CLOSE SHOT POPUP
========================= */

function closeShotPopup() {

    "hidden"
  );

  overlay.classList.add(
    "hidden"
  );

}


/* =========================
   CLOSE BUTTON X
========================= */

popup.addEventListener(

  event => {

    const cancel =
      event.target.closest(
        ".st-cancel"
      );


    if (!cancel) {
      return;
    }


    closeShotPopup();

    resetShot();

  }
);


/* =========================
   OVERLAY CLICK
========================= */

overlay.addEventListener(
  "click",
  () => {

    closeShotPopup();

/* =========================
   RENDER PLAYER POPUP
========================= */

function renderPlayerPopup() {

  playerContainer.innerHTML = "";


  gamePlayers.forEach(
    player => {

      if (
        player.id ===
        currentPlayerId
      ) {

        return;

      }


      if (
        player.hp <= 0
      ) {

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "st-list";


      const firstLetter =
        player.name
          .charAt(0)
          .toUpperCase();


      let profileHTML;


      if (player.profile) {

        profileHTML = `

          <span class="st-profile">

            <img
              src="${player.profile}"
              alt="Profile">

          </span>

        `;

      } else {

        profileHTML = `

          <span class="st-profile">
            ${firstLetter}
          </span>

        `;

      }


      item.innerHTML = `

        <div class="st-user">

          ${profileHTML}

          <span class="st-nama">
            ${player.name}
          </span>

          <span class="st-healt">
            (${player.hp})
          </span>

        </div>


        <button
          class="st-player-btn"
          data-id="${player.id}">

          Shot

        </button>

      `;


      playerContainer.appendChild(
        item
      );

    }
  );


  if (
    playerContainer
      .children.length === 0
  ) {

    playerContainer.innerHTML = `

      <div
        style="
          padding:10px 0;
          text-align:center;
          color:#777;
        ">

        Tidak ada pemain lain.

      </div>

    `;

  }

}


/* =========================
   SELECT PLAYER
========================= */

playerContainer.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".st-player-btn"
      );


    if (!button) {
      return;
    }


    if (shootingLocked) {
      return;
    }


    const targetId =
      button.dataset.id;


    const target =
      gamePlayers.find(
        player =>
          player.id ===
          targetId
      );


    if (!target) {
      return;
    }


    selectedTarget =
      target;


    closeShotPopup();

    shoot(
      targetId
    );

  }
);


/* =========================
   SHOOT
========================= */

async function shoot(targetId) {

  if (
    shootingLocked ||
    !gameData
  ) {

    return;

  }


  if (!targetId) {

    alert(
      "Target tidak ditemukan."
    );

    return;

  }


  if (
    gameData.phase !==
    "playing"
  ) {

    return;

  }


  if (
    !gameData.turn ||
    gameData.turn.current !==
    currentPlayerId
  ) {

    alert(
      "Bukan giliran kamu."
    );

    return;

  }


  shootingLocked = true;


  let shotResult = null;
  let isSelf = false;
  let shotTargetName = "Unknown";


  const gameRef =
    ref(
      db,
      "room/game"
    );


  try {

    const result =
      await runTransaction(
        gameRef,
        currentGame => {

          if (!currentGame) {
            return;
          }


          if (
            currentGame.phase !==
            "playing"
          ) {

            return;

          }


          if (
            currentGame.turn?.current !==
            currentPlayerId
          ) {

            return;

          }


          let shells =
            currentGame.shells;

          let currentShell =
            Number(
              shells?.current ?? 0
            );

          if (
            !shells ||
            !shells.sequence
          ) {

            shells =
              createShellSet();

            currentGame.shells =
              shells;

            currentShell = 0;

          }

          if (currentShell >= shellCount) {

            shells =
              createShellSet();

            currentGame.shells =
              shells;

            currentShell = 0;

          }

          const currentShellType =
            shells.sequence[currentShell];

          if (!currentShellType) {
            return;
          }


          const players =
            currentGame.players || {};


          if (
            !players[targetId]
          ) {

            return;

          }


          const playerIds =
            Object.keys(players)
              .filter(
                id =>
                  players[id]
              )
              .sort(
                (a, b) =>
                  Number(
                    players[a].turnOrder ?? 0
                  ) -
                  Number(
                    players[b].turnOrder ?? 0
                  )
              );


          if (
            playerIds.length === 0
          ) {

            return;

          }


          const targetPlayer =
            players[targetId];


          if (!targetPlayer) {
            return;
          }


          const targetHp =
            Number(
              targetPlayer.hp ?? 0
            );


          if (
            targetHp <= 0
          ) {

            return;

          }


          isSelf =
            targetId ===
            currentPlayerId;


          const selectedPlayer =
            gamePlayers.find(
              player =>
                player.id ===
                targetId
            );


          shotTargetName =
            selectedPlayer?.name ||
            "Unknown";


          /* =========================
             LIVE
          ========================= */

          if (
            currentShellType ===
            "live"
          ) {

            targetPlayer.hp =
              Math.max(
                0,
                targetHp - 1
              );

            shotResult =
              "live";

          }


          /* =========================
             BLANK
          ========================= */

          else {

            shotResult =
              "blank";

          }


          currentGame.shells.current =
            currentShell + 1;

          const livingPlayerIds =
            playerIds.filter(
              id =>
                Number(
                  players[id]?.hp ?? 0
                ) > 0
            );

          if (livingPlayerIds.length <= 1) {

            currentGame.phase =
              "finished";

            currentGame.winner =
              livingPlayerIds[0] ||
              null;

            currentGame.turn.current =
              livingPlayerIds[0] ||
              currentPlayerId;

            currentGame.turn.index =
              livingPlayerIds[0]
                ? playerIds.indexOf(livingPlayerIds[0])
                : 0;

            return currentGame;

          }

          /* =========================
             RESET SHELL SET
          =========================
             Setelah shell ke-8 ditembak,
             buat 8 shell baru secara acak.
          */

          if (
            currentGame.shells.current >=
            shellCount
          ) {

            const newShells =
              createShellSet();

            currentGame.shells =
              newShells;

          }


          /* =========================
             NEXT TURN
          =========================

             Blank + self
             = tetap giliran.

             Selain itu
             = pemain berikutnya.
          */

          if (
            currentShellType ===
            "blank" &&
            isSelf
          ) {

            const currentIndex =
              playerIds.indexOf(
                currentPlayerId
              );


            currentGame.turn.current =
              currentPlayerId;


            currentGame.turn.index =
              currentIndex >= 0
                ? currentIndex
                : 0;

          } else {

            const currentIndex =
              playerIds.indexOf(
                currentPlayerId
              );


            if (
              currentIndex < 0
            ) {

              return;

            }


            let nextIndex =
              (
                currentIndex + 1
              ) %
              playerIds.length;


            /*
              Lewati pemain yang
              sudah HP 0.
            */

            let checked = 0;


            while (
              checked <
              playerIds.length
            ) {

              const candidateId =
                playerIds[
                  nextIndex
                ];


              const candidate =
                players[
                  candidateId
                ];


              if (
                Number(
                  candidate.hp ?? 0
                ) > 0
              ) {

                break;

              }


              nextIndex =
                (
                  nextIndex + 1
                ) %
                playerIds.length;


              checked++;

            }


            const nextId =
              playerIds[
                nextIndex
              ];


            currentGame.turn.current =
              nextId;


            currentGame.turn.index =
              nextIndex;

          }


          return currentGame;

        }
      );


    if (
      !result.committed
    ) {

      alert(
        "Tembakan gagal. Silakan coba lagi."
      );

      return;

    }


    shotMode = false;

    selectedTarget = null;


    closeShotPopup();

    resetShot();


    if (
      shotResult ===
      "live"
    ) {

      alert(

        "💥 LIVE!\n\n" +

        (
          isSelf
            ? "Kamu terkena peluru!"
            : shotTargetName +
              " terkena peluru!"
        )

      );

    } else {

      alert(
        "⚪ BLANK!"
      );

    }


    const snapshot =
      await get(
        gameRef
      );


    if (
      snapshot.exists()
    ) {

      gameData =
        snapshot.val();

      await renderGameState();

    }


  } catch (error) {

    console.error(
      "Shoot error:",
      error
    );

    alert(
      "Terjadi kesalahan saat menembak."
    );

  } finally {

    shootingLocked = false;

  }

}


/* =========================
   ENABLE SHOT BUTTON
========================= */

function enableShotButtons() {

  if (shootingLocked) {
    return;
  }

  playerBtn.disabled =
    false;

  selfBtn.disabled =
    false;

}


/* =========================
   DISABLE SHOT BUTTON
========================= */

function disableShotButtons() {

  playerBtn.disabled =
    true;

  selfBtn.disabled =
    true;

}


/* =========================
   RESET SHOT
========================= */

function resetShot(
  hideShotMode = true
) {

  if (hideShotMode) {

    shotMode = false;

  }


  selectedTarget = null;


  shot.classList.remove(
    "active"
  );


  disableShotButtons();

}


/* =========================
   CLICK OUTSIDE
========================= */

document.addEventListener(
  "click",
  event => {

    if (!shotMode) {
      return;
    }


    const clickedShot =
      event.target.closest(
        ".shot"
      );


    const clickedPlayerBtn =
      event.target.closest(
        ".other"
      );


    const clickedSelfBtn =
      event.target.closest(
        ".self"
      );


    const clickedPopup =
      event.target.closest(
        ".shot-list"
      );


    const clickedOverlay =
      event.target.closest(
        ".overlay"
      );


    if (clickedShot) {
      return;
    }


    if (clickedPlayerBtn) {
      return;
    }


    if (clickedSelfBtn) {
      return;
    }


    if (clickedPopup) {
      return;
    }


    if (clickedOverlay) {
      return;
    }


    resetShot();

  }
);


/* =========================
   INITIALIZE
========================= */

async function initialize() {

  try {

    const loaded =
      await loadSavedPlayer();


    if (loaded) {

      showLobby();

    } else {

      showLogin();

    }

  } catch (error) {

    console.error(error);

    showLogin();

  }

}


/* =========================
   LUCIDE
========================= */

lucide.createIcons();


/* =========================
   START
========================= */

initialize();

</script>
