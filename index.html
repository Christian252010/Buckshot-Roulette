<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Buckshot Roulette</title>

  <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<style>

/* =========================
   GLOBAL
========================= */

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}


/* =========================
   BODY
========================= */

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: #1f1f1f;
}


/* =========================
   HEADER
========================= */

.header {
  display: flex;
  background: #1a1a1a;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  border-bottom: 2.6px solid #dc143ccb;
  z-index: 99;
}

.h-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.profile {
  display: flex;
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  color: white;
  background: coral;
  border-radius: 50%;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  overflow: hidden;
}

.profile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.nama {
  color: white;
  font-size: 22px;
}

.list {
  display: flex;
  align-items: center;
  background: #2f2f2f;
  padding: 6px 10px;
  border-radius: 8px;
  gap: 8px;
  color: white;
  font-size: 24px;
}


/* =========================
   LOGIN
========================= */

.login-screen {
  display: flex;
  min-height: 100dvh;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.login-box {
  display: flex;
  width: 100%;
  max-width: 420px;
  flex-direction: column;
  background: #2f2f2f;
  padding: 20px;
  border-radius: 8px;
}

.login-title {
  margin-bottom: 20px;
  text-align: center;
  color: white;
  font-size: 28px;
  font-weight: bold;
}

.login-label {
  margin-bottom: 6px;
  color: #aaa;
  font-size: 16px;
}

.login-input {
  width: 100%;
  height: 44px;
  margin-bottom: 14px;
  padding: 0 12px;
  border: 1px solid #555;
  outline: none;
  background: #1f1f1f;
  color: white;
  border-radius: 5px;
  font-size: 18px;
}

.login-input:focus {
  border-color: crimson;
}

.login-btn {
  width: 100%;
  height: 45px;
  margin-top: 6px;
  border: none;
  background: crimson;
  color: white;
  border-radius: 6px;
  font-size: 20px;
  font-weight: bold;
}

.login-message {
  min-height: 22px;
  margin-top: 10px;
  text-align: center;
  color: #ff7777;
  font-size: 15px;
}


/* =========================
   LOBBY
========================= */

.lobby {
  display: flex;
  min-height: 100dvh;
  flex-direction: column;
}

.btns-top {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px;
  justify-content: center;
  align-items: center;
}

.btns-top button {
  display: flex;
  width: 100%;
  height: 45px;
  justify-content: center;
  align-items: center;
  gap: 8px;
  border: none;
  background: crimson;
  font-size: 22px;
  color: white;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}

.start-left {
  display: flex;
  width: 100%;
  gap: 6px;
}

.left {
  background: #666 !important;
}

.join {
  background: #228b22 !important;
}

.room-message {
  min-height: 22px;
  padding: 0 14px;
  text-align: center;
  color: #aaa;
  font-size: 15px;
}

.join-list {
  display: flex;
  flex-direction: column;
  gap: 0;
  background: #2f2f2f;
  margin: 14px;
  padding: 14px 18px;
  border-radius: 6px;
}

.pl-list {
  display: flex;
  gap: 8px;
  padding: 8px;
  align-items: center;
  border-bottom: 1.5px solid #555;
}

.pl-list:last-child {
  border-bottom: none;
}

.empty-room {
  padding: 10px;
  text-align: center;
  color: #777;
}


/* =========================
   GAME
========================= */

.game {
  display: flex;
  position: relative;
  width: 100%;
  height: 100dvh;
  min-height: 100dvh;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}


/* =========================
   GAME PANEL
========================= */

.game-panel {
  display: flex;
  flex-direction: column;
  background: #1a1a1a;
  padding: 10px 16px;
  align-items: center;
  color: white;
  box-shadow: 0 2px 12px 0 #dc143ccb;
  z-index: 1;
}

.game-panel.current-turn {
  background: crimson;
  box-shadow: 0 2px 16px 0 #dc143c;
}

.gp-top {
  display: flex;
  width: 100%;
  justify-content: space-between;
}

.gp-top span {
  font-size: 22px;
}

.healt {
  display: flex;
  gap: 2px;
  color: gold;
}

.hp-off {
  color: #886;
}

.next {
  display: flex;
  width: 100%;
  justify-content: left;
  align-items: center;
  padding-left: 6px;
  margin-top: -4px;
  gap: 6px;
  color: #aaa;
}

.next svg {
  width: 16px;
  height: 16px;
}

.next span {
  font-size: 16px;
}


/* =========================
   GAME PANEL BOTTOM INFO
========================= */

.gp-bottom {
  display: flex;
  width: 100%;
  justify-content: flex-start;
  align-items: center;
  margin-top: 6px;
  padding-left: 8px;
}

.i-shell {
  display: flex;
  align-items: center;
  gap: 6px;
}

.i-live, .i-blank {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #333;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: bold;
}

.i-live {
  color: crimson;
}

.i-blank {
  color: #888;
}

.i-shell svg {
  width: 14px;
  height: 14px;
  rotate: 180deg;
}


/* =========================
   GAME MESSAGE
========================= */

.game-message {
  display: flex;
  width: 100%;
  margin: 8px 0 0;
  padding: 0;
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;
  gap: 6px;
  text-align: left;
  z-index: 2;
  pointer-events: none;
}

.game-message .message-line.info {
  width: fit-content;
  max-width: calc(100% - 10px);
  margin-left: 10px;
}

.game-message .message-line {
  display: flex;
  width: 100%;
  min-height: 38px;
  padding: 7px 10px;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  background: #1f1f1f;
  border: 1px solid #444;
  border-radius: 6px;
  text-align: left;
  opacity: 1;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.game-message .message-line.removing {
  opacity: 0;
  transform: translateY(-3px);
}

.game-message .message-line.live {
  color: crimson;
  font-weight: bold;
}

.game-message .message-line.blank {
  color: #999;
  font-weight: bold;
}

.game-message .message-line.info {
  color: #aaa;
}

.game-message .message-line.win {
  color: gold;
  font-weight: bold;
}

.game-message .message-line svg {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
}

.game-message .message-line.live svg,
.game-message .message-line.blank svg {
  rotate: 180deg;
}

.game-message .message-line.live svg {
  color: crimson;
}

.game-message .message-line.blank svg {
  color: #888;
}


/* =========================
   RANDOM SHELL
========================= */

.random-shell {
  display: flex;
  position: absolute;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  justify-content: center;
  top: 45%;
  transform: translateX(-50%) translateY(-60%);
  left: 50%;
  padding: 12px;
  background: #2a2a2a;
  z-index: 10;
}

.shell {
  display: flex;
  justify-content: space-between;
}

.shell-info {
  display: flex;
  justify-content: flex-end;
  gap: 18px;
  border-top: 1.5px solid #666;
  padding: 10px 8px 0;
  font-weight: bold;
  color: #888;
}

.shell-info span:nth-child(1) {
  color: crimson;
}

.random-shell svg {
  width: 36px !important;
  height: 36px !important;
  color: crimson;
  rotate: 180deg;
}

.blank {
  color: #888 !important;
}


/* =========================
   SHOTGUN
========================= */

.shot {
  position: absolute;
  display: flex;
  left: 50%;
  top: 45%;
  transform: translateX(-50%) translateY(-60%);
  padding: 14px;
  border-radius: 50%;
  cursor: pointer;
  transition: .15s;
}

.shot:hover {
  background: #333;
}

.shot:active {
  transform:
    translateX(-50%)
    translateY(-50%)
    scale(.94);
}

.shot.active {
  background: #333;
}

.shot img {
  width: 84px;
  height: 84px;
}


/* =========================
   BOTTOM
========================= */

.bottom {
  display: flex;
  width: 100%;
  flex-direction: column;
  flex-shrink: 0;
}

.shot-btn {
  display: flex;
  width: 100%;
  padding: 8px;
  gap: 6px;
}

.shot-btn button {
  display: flex;
  width: 100%;
  height: 45px;
  justify-content: center;
  align-items: center;
  gap: 8px;
  border: none;
  background: crimson;
  font-size: 22px;
  color: white;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}

.self {
  background: #666 !important;
}

.shot-btn button:disabled {
  opacity: .45;
  background: #555 !important;
  cursor: not-allowed;
}

.items-have {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: -8px;
  padding: 8px;
}

.item {
  display: flex;
  flex-direction: column;
  gap: 8px;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: #444;
  height: 70px;
  border-radius: 4px;
  color: white;
  font-weight: bold;
  font-size: 8px;
  cursor: pointer;
  user-select: none;
}

.item svg {
  width: 30px;
  height: 30px;
}

.item.empty {
  background: #333;
  color: #555;
  cursor: default;
}

.item.disabled {
  opacity: .45;
  cursor: not-allowed;
  pointer-events: none;
}

.item.selected {
  background: crimson;
  box-shadow: 0 0 0 2px #fff2;
}

/* =========================
   OVERLAY
========================= */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .6);
  z-index: 9;
}


/* =========================
   POPUP
========================= */

.shot-list {
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 50%;
  top: 50%;
  transform:
    translateX(-50%)
    translateY(-50%);
  width: 80%;
  max-height: 80dvh;
  overflow-y: auto;
  background: #2f2f2f;
  padding: 14px 18px;
  border-radius: 6px;
  z-index: 10;
}

.st-list-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.st-cancel {
  cursor: pointer;
}

.st-cancel:hover {
  color: crimson;
}


/* =========================
   PLAYER LIST
========================= */

.st-list {
  display: flex;
  padding: 8px 0;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1.5px solid #555;
}

.st-list:last-child {
  border-bottom: none;
}

.st-user {
  display: flex;
  align-items: center;
  gap: 8px;
}

.st-profile {
  display: flex;
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  color: white;
  background: coral;
  border-radius: 50%;
  justify-content: center;
  align-items: center;
  font-size: 20px;
  overflow: hidden;
}

.st-profile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.st-nama {
  color: #aaa;
  font-size: 22px;
}

.st-healt {
  color: #ffd700aa;
  font-size: 18px;
}

.st-player-btn {
  background: crimson;
  border: none;
  padding: 4px 10px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  border-radius: 4px;
  cursor: pointer;
}

.st-player-btn:active {
  transform: scale(.95);
}


/* =========================
   GAME PLAYER LIST
========================= */

.player-list {
  display: none;
  width: 80%;
  max-height: 80dvh;
  overflow-y: auto;
  position: absolute;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  flex-direction: column;
  gap: 0;
  background: #2f2f2f;
  padding: 14px 18px;
  border-radius: 6px;
  z-index: 20;
}

.player-list.show {
  display: flex;
}

.list-pemain {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
  font-weight: bold;
  font-size: 18px;
  padding-bottom: 4px;
}

.list-pemain svg {
  cursor: pointer;
}

.player-list .pl-list {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1.5px solid #555;
  border-radius: 4px;
}

.player-list .pl-list.current-turn {
  background: crimson;
  padding-left: 8px;
  padding-right: 8px;
  margin-left: -8px;
  margin-right: -8px;
}

.player-list .pl-user {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.player-list .pl-healt {
  display: flex;
  align-items: center;
  gap: 2px;
  color: gold;
  flex-shrink: 0;
}

.player-list .pl-healt svg {
  width: 20px;
  height: 20px;
}

.player-list .heart-off {
  color: #886;
}

.player-list .pl-list.current-turn .nama {
  color: white;
}

.player-list .spect {
  display: block;
  font-weight: bold;
  color: white;
  font-size: 18px;
  padding-top: 14px;
  padding-bottom: 6px;
}

.player-list .sp-list {
  display: flex;
  align-items: center;
  padding: 8px 0;
  gap: 8px;
  border-bottom: 1.5px solid #555;
}

.player-list .sp-list:last-child {
  border-bottom: none;
}

.player-list .sp-empty {
  padding: 6px 0;
  color: #777;
  font-size: 15px;
}


/* =========================
   DAMAGE FLASH
========================= */

.damage-flash {
  display: block;
  position: fixed;
  inset: 0;
  background: rgba(255, 0, 0, 0.72);
  z-index: 99;
  pointer-events: none;
  animation: damageFlash 1.5s ease-out forwards;
}

@keyframes damageFlash {
  0% { opacity: 0; }
  20% { opacity: 1; }
  100% { opacity: 0; }
}

/* =========================
   WINNER SCREEN
========================= */

.winner-screen {
  display: flex;
  position: fixed;
  inset: 0;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  background: rgba(0, 0, 0, 0.86);
  z-index: 100;
  overflow: hidden;
}

.winner-trophy {
  position: absolute;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 70px;
  transform: scale(0);
}

.winner-trophy-icon {
  font-size: 12em;
}

.winner-card {
  display: flex;
  position: relative;
  overflow: hidden;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 110px;
  color: white;
  background: #2f2f2f;
  transform: translateX(-100%);
}

.winner-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -50px;
  width: 50px;
  height: 100%;
  background: rgba(180, 180, 180, 0.7);
  z-index: 1;
  transform: skewX(-25deg);
  animation: winnerShimmer 2s linear infinite;
}

.winner-title {
  font-family: "Archivo Black", sans-serif;
  font-size: clamp(3rem, 16vw, 5rem);
  line-height: 1;
  margin-bottom: 4px;
  z-index: 2;
  transition: color 0.3s ease;
}

.winner-name {
  font-family: "Archivo", sans-serif;
  font-weight: bold;
  font-size: 20px;
  color: #ccc;
  z-index: 2;
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.3s linear;
}

@keyframes winnerShimmer {
  from {
    left: -50px;
  }
  to {
    left: calc(100% + 50px);
  }
}

@keyframes winnerSpin {
  0% {
    transform: rotateY(0deg) scale(0);
  }
  100% {
    transform: rotateY(720deg) scale(1);
  }
}

@keyframes winnerShake {
  0% {
    transform: rotate(-8deg);
  }
  25% {
    transform: rotate(8deg);
  }
  50% {
    transform: rotate(-8deg);
  }
  75% {
    transform: rotate(8deg);
  }
  100% {
    transform: rotate(-8deg);
  }
}

@keyframes winnerSlide {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(0);
  }
}

/* =========================
   PROFILE EDIT POPUP
========================= */

.profile-edit-popup {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.72);
  z-index: 101;
}

.profile-edit-box {
  width: min(420px, 100%);
  padding: 18px;
  color: white;
  background: #252525;
  border: 1px solid #444;
  border-radius: 8px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
}

.profile-edit-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.profile-edit-title {
  font-size: 22px;
  font-weight: bold;
}

.profile-edit-close {
  display: flex;
  width: 32px;
  height: 32px;
  padding: 0;
  color: #aaa;
  background: transparent;
  border: none;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

.profile-edit-close:hover {
  color: white;
}

.profile-edit-preview {
  display: flex;
  width: 76px;
  height: 76px;
  margin: 0 auto 16px;
  color: white;
  background: coral;
  border-radius: 50%;
  overflow: hidden;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: bold;
}

.profile-edit-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-edit-label {
  display: block;
  margin: 10px 0 6px;
  color: #bbb;
  font-size: 15px;
}

.profile-edit-input {
  width: 100%;
  padding: 10px 11px;
  color: white;
  background: #1c1c1c;
  border: 1px solid #444;
  border-radius: 5px;
  outline: none;
}

.profile-edit-input:focus {
  border-color: #777;
}

.profile-edit-color-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.profile-edit-color {
  width: 48px;
  height: 40px;
  padding: 2px;
  background: #1c1c1c;
  border: 1px solid #444;
  border-radius: 5px;
  cursor: pointer;
}

.profile-edit-color-row .profile-edit-input {
  flex: 1;
}

.profile-edit-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.profile-edit-actions button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}

.profile-edit-cancel {
  color: #ccc;
  background: #3a3a3a;
}

.profile-edit-save {
  color: white;
  background: crimson;
}

.profile-edit-message {
  min-height: 18px;
  margin-top: 8px;
  color: #ff7777;
  font-size: 14px;
}

.header-profile {
  cursor: pointer;
}

.header-profile:active {
  transform: scale(.95);
}

/* =========================
   HIDDEN
========================= */

.hidden {
  display: none !important;
}

</style>


<!-- =========================
     LOGIN SCREEN
========================= -->

<div class="login-screen hidden">

  <div class="login-box">

    <div class="login-title">
      Buckshot Roulette
    </div>

    <label class="login-label">
      Nama
    </label>

    <input
      type="text"
      class="login-input login-name"
      placeholder="Masukkan nama"
      maxlength="30">

    <label class="login-label">

      Profile URL

      <span style="color:#777;">
        (opsional)
      </span>

    </label>

    <input
      type="url"
      class="login-input login-profile"
      placeholder="https://...">

    <button class="login-btn">
      Masuk
    </button>

    <div class="login-message"></div>

  </div>

</div>


<!-- =========================
     LOBBY
========================= -->

<div class="lobby hidden">

  <div class="header">

    <div class="h-right">

      <div class="profile header-profile">
        C
      </div>

      <div class="nama header-name">
        Christian

/* =========================

========================= */

const gameSounds = {};

function getGameSound(name) {
  if (!gameSounds[name]) {
    const audio = new Audio(`sound/${name}.ogg`);
    audio.preload = "auto";
    audio.dataset.fallbackTried = "false";

    audio.addEventListener("error", () => {
      if (audio.dataset.fallbackTried === "true") {
        return;
      }

      audio.dataset.fallbackTried = "true";
      audio.src = `sound/${name}.wav`;
      audio.load();
    });

    gameSounds[name] = audio;
  }

  return gameSounds[name];
}

function playGameSound(name, volume = 1, delay = 0) {
  const play = () => {
    const audio = getGameSound(name);

    try {
      audio.pause();
      audio.currentTime = 0;
      audio.volume = Math.max(0, Math.min(1, volume));

      const promise = audio.play();

      if (promise?.catch) {
        promise.catch(error => {
          /* Browser dapat menolak playback sebelum ada user gesture. */
          console.debug(`Sound ${name} tidak dapat diputar:`, error);
        });
      }
    } catch (error) {
      console.debug(`Sound ${name} error:`, error);
    }
  };

  if (delay > 0) {
    setTimeout(play, delay);
  } else {
    play();
  }
}

/* =========================

const avatarColors = [
  "#e76f51",

  "#6d597a",

  "#8338ec",
  "#ff006e",
  "#588157"
];

function getRandomAvatarColor() {
  return avatarColors[
    Math.floor(Math.random() * avatarColors.length)
  ];
}

function normalizeHexColor(value) {
  const color = String(value || "").trim();

  if (/^#[0-9a-fA-F]{6}$/.test(color)) {
    return color.toLowerCase();
  }

  if (/^[0-9a-fA-F]{6}$/.test(color)) {
    return "#" + color.toLowerCase();
  }

  return null;
}

function getPlayerAvatarColor(player) {
  return normalizeHexColor(player?.profileColor) || "#ff7f50";
}

function applyAvatarStyle(element, player) {
  if (!element) {
    return;
  }

  element.style.background = getPlayerAvatarColor(player);
}


/* =========================
   NORMALIZE NAME
========================= */

function normalizeName(name) {

  return name
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");

}


/* =========================
   NAME EXISTS
========================= */

async function nameExists(name) {

  const targetName =
    normalizeName(name);

  const snapshot =
    await get(
      ref(db, "players")
    );

  if (!snapshot.exists()) {
    return false;
  }

  const players =
    snapshot.val();

  return Object.values(players).some(
    player => {

      return normalizeName(
        player.name || ""
      ) === targetName;

    }
  );

}


/* =========================
   RESERVE NAME
========================= */

async function reserveName(name) {

  const normalized =
    normalizeName(name);

  const nameKey =
    encodeURIComponent(normalized);

  const nameRef =
    ref(
      db,
      "names/" + nameKey
    );

  const result =
    await runTransaction(
      nameRef,
      current => {

        if (current === null) {

          return {

            name: name,

            createdAt: Date.now()

          };

        }

        return;

      }
    );

  return result.committed;

}

  if (!savedId) {
    return false;

  const snapshot =
    await get(
      ref(
        db,
        "players/" + savedId
      )
    );

  if (!snapshot.exists()) {

    localStorage.removeItem(
      "buckshotPlayerId"
    );

    return false;

  }

  currentPlayerId =
    savedId;

  currentPlayer =
    snapshot.val();

  if (!currentPlayer.profileColor) {
    currentPlayer.profileColor =
      getRandomAvatarColor();

    await update(
      ref(db, "players/" + currentPlayerId),
      {
        profileColor: currentPlayer.profileColor
      }
    );
  }

  return true;

}

    roomData.players || {};

  const joined =
    !!roomPlayers[
      currentPlayerId
    ];

  const playerIds =
    Object.keys(roomPlayers);

  const playerCount =
    playerIds.length;

  createBtn.classList.toggle(
    "hidden",
    !!roomData
  );

  joinBtn.classList.toggle(
    "hidden",
    joined
  );

  joinBtn.disabled =
    !joined &&
    playerCount >= 6;

  startLeft.classList.toggle(
    "hidden",
    !joined
  );

  roomMessage.textContent =
    joined
      ? "Kamu berada di room."
      : "Room tersedia. Tekan Join untuk masuk.";

  document.querySelector(
    ".online"
  ).textContent =
    playerIds.length;

  await renderLobbyPlayers(
    playerIds
  );

}

joinBtn.addEventListener(

        "Gagal keluar dari room.";

  }
);


/* =========================
   SHUFFLE ARRAY
========================= */

function shuffleArray(array) {

  const result =
    [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}

========================= */

const ITEM_DEFINITIONS = {
  magnifying_glass: {
    name: "Magnifying Glass",
    icon: "search",
    info: "Melihat jenis peluru yang sedang berada di posisi sekarang.",
    target: false
  },
  hand_saw: {
    name: "Hand Saw",
    icon: "pocket-knife",
    info: "Tembakan live berikutnya memberikan double damage (2 HP).",
    target: false
  },
  cigarette: {
    name: "Cigarette Pack",
    icon: "cigarette",
    info: "Memulihkan 1 HP. Tidak dapat digunakan jika HP sudah penuh.",
    target: false
  },
  handcuff: {
    name: "Handcuff",
    icon: "lock-keyhole-open",
    info: "Membuat pemain yang terkena dilewati 1 giliran.",
    target: true
  }
};

function createPlayerItems(playerCount) {
  const types = shuffleArray(Object.keys(ITEM_DEFINITIONS));

  // Item dibagikan acak setiap shell baru diacak.
  // Untuk sementara tiap pemain mendapat 1-4 item berbeda.
  const amount = Math.floor(Math.random() * types.length) + 1;

  return types.slice(0, amount);

}

function resetItemSelection() {
  selectedItemType = null;
  itemMode = false;
  itemElements.forEach(item => item.classList.remove("selected"));
  playerBtn.textContent = "Player";
  selfBtn.textContent = "Self";
}

function renderMyItems() {
  const items = Array.isArray(gameData?.players?.[currentPlayerId]?.items)
    ? gameData.players[currentPlayerId].items
    : [];

  const canUseItems =
    gameData?.phase === "playing" &&
    gameData?.turn?.current === currentPlayerId &&
    !shootingLocked;

  if (!canUseItems && itemMode) {
    resetItemSelection();
  }

  itemElements.forEach(item => {
    const type = item.dataset.item;
    const owned = !!type && items.includes(type);

    item.classList.toggle("empty", !owned);
    item.classList.toggle("disabled", owned && !canUseItems);
    item.classList.toggle("selected", owned && selectedItemType === type);

    if (!owned) {
      item.dataset.item = "";
      item.innerHTML = "";
    }
  });

  const ownedTypes = items.slice(0, itemElements.length);

  itemElements.forEach((item, index) => {
    const type = ownedTypes[index] || "";
    item.dataset.item = type;

    if (!type) {
      item.classList.add("empty");
      item.classList.remove("disabled", "selected");
      item.innerHTML = "";
      return;
    }

    const definition = ITEM_DEFINITIONS[type];
    item.classList.remove("empty");
    item.classList.toggle("disabled", !canUseItems);
    item.classList.toggle("selected", selectedItemType === type);
    item.innerHTML = `
      <i data-lucide="${definition.icon}"></i>
      <span>${definition.name}</span>
    `;
  });

  lucide.createIcons();
}

function setItemMode(type) {
  if (!gameData || gameData.phase !== "playing") return;
  if (gameData.turn?.current !== currentPlayerId) {
    alert("Bukan giliran kamu.");
    return;
  }

  const items = gameData.players?.[currentPlayerId]?.items || [];
  if (!items.includes(type)) return;

  selectedItemType = type;
  itemMode = true;
  itemElements.forEach(item => item.classList.toggle("selected", item.dataset.item === type));
  playerBtn.textContent = "Use";
  selfBtn.textContent = "Info";
  enableShotButtons();
}

async function showSelectedItemInfo() {
  if (!selectedItemType) return;

  const definition = ITEM_DEFINITIONS[selectedItemType];
  if (!definition) return;

  if (selectedItemType === "magnifying_glass") {
    const index = Number(gameData.shells?.current || 0);
    const type = gameData.shells?.sequence?.[index];
    const label = type === "live" ? "LIVE" : type === "blank" ? "BLANK" : "tidak diketahui";
    alert(`Magnifying Glass\n\nPeluru saat ini: ${label}`);
    return;
  }

  alert(`${definition.name}\n\n${definition.info}`);
}

async function useSelectedItem(targetId = null) {
  if (!selectedItemType || shootingLocked || !gameData) return;
  if (gameData.phase !== "playing" || gameData.turn?.current !== currentPlayerId) {
    alert("Item hanya dapat digunakan saat giliran kamu.");
    return;
  }

  const type = selectedItemType;
  const definition = ITEM_DEFINITIONS[type];
  if (!definition) return;

  if (definition.target && !targetId) {
    renderPlayerPopup();
    popup.classList.remove("hidden");
    overlay.classList.remove("hidden");
    return;
  }

  if (type === "magnifying_glass") {
    const index = Number(gameData.shells?.current || 0);
    const shellType = gameData.shells?.sequence?.[index];
    const label = shellType === "live" ? "LIVE" : shellType === "blank" ? "BLANK" : "tidak diketahui";
    alert(`Magnifying Glass\n\nPeluru saat ini: ${label}`);
  }

  shootingLocked = true;
  try {
    const gameRef = ref(db, "room/game");
    const result = await runTransaction(gameRef, game => {
      if (!game || game.phase !== "playing") return;
      if (game.turn?.current !== currentPlayerId) return;

      const player = game.players?.[currentPlayerId];
      if (!player || player.hp <= 0) return;

      const inventory = Array.isArray(player.items) ? [...player.items] : [];
      const itemIndex = inventory.indexOf(type);
      if (itemIndex < 0) return;

      if (type === "cigarette") {
        if (Number(player.hp) >= 3) return;
        player.hp = Math.min(3, Number(player.hp) + 1);
      } else if (type === "hand_saw") {
        player.sawActive = true;
      } else if (type === "handcuff") {
        if (!targetId || targetId === currentPlayerId) return;
        const target = game.players?.[targetId];
        if (!target || Number(target.hp ?? 0) <= 0) return;
        target.skipTurns = Number(target.skipTurns ?? 0) + 1;
      } else if (type === "magnifying_glass") {
        // Magnifying Glass tidak mengubah HP/turn, tetapi item tetap dikonsumsi.
      }

      inventory.splice(itemIndex, 1);
      player.items = inventory;
      game.lastEvent = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        type: "item",
        itemType: type,
        playerId: currentPlayerId,
        targetId: targetId || null,
        at: Date.now()
      };

      return game;
    });

    if (!result.committed) {
      const snapshot = await get(gameRef);
      if (snapshot.exists()) {
        gameData = snapshot.val();
        await renderGameState();
      }
      return;
    }

    closeShotPopup();
    resetShot();
    resetItemSelection();

    const snapshot = await get(gameRef);
    if (snapshot.exists()) {
      gameData = snapshot.val();
      await renderGameState();
    }
  } catch (error) {
    console.error("Use item error:", error);
  } finally {
    shootingLocked = false;
  }
}

itemElements.forEach(item => {
  item.addEventListener("click", () => {
    if (shootingLocked || item.classList.contains("empty") || item.classList.contains("disabled")) {
      return;
    }

    if (!gameData || gameData.phase !== "playing" || gameData.turn?.current !== currentPlayerId) {
      return;
    }

    setItemMode(item.dataset.item);
  });
});


/* =========================
   CREATE GAME STATE
========================= */

function createShellSet(playerCount = 2) {

  let totalMin;
  let totalMax;
  let aliveMin;
  let aliveMax;

  if (playerCount <= 2) {
    totalMin = 4;
    totalMax = 6;
    aliveMin = 1;
    aliveMax = 5;
  } else if (playerCount === 3) {
    totalMin = 5;
    totalMax = 7;
    aliveMin = 2;
    aliveMax = 5;
  } else {
    totalMin = 6;
    totalMax = 8;
    aliveMin = 2;
    aliveMax = 6;
  }

  const total =
    Math.floor(
      Math.random() *
      (totalMax - totalMin + 1)
    ) + totalMin;

  aliveMax = Math.min(
    aliveMax,
    total - 1
  );

  const alive =
    Math.floor(
      Math.random() *
      (aliveMax - aliveMin + 1)
    ) + aliveMin;

  const blank =
    total - alive;

  const shellData =
    [];

  for (
    let i = 0;
    i < alive;
    i++
  ) {
    shellData.push(
      "live"
    );
  }

  for (
    let i = 0;
    i < blank;
    i++
  ) {
    shellData.push(
      "blank"
    );
  }

  return {
    setId:
      Date.now().toString(36) +
      Math.random().toString(36).slice(2, 8),
    total,
    alive,
    blank,
    current: 0,
    sequence: shuffleArray(shellData)
  };
}


/* =========================
   CREATE GAME STATE
========================= */

function createGameState(
  playerIds
) {

  const shuffledPlayers =
    shuffleArray(playerIds);

  const gamePlayersData =
    {};

  shuffledPlayers.forEach(
    (playerId, index) => {

      gamePlayersData[playerId] = {

        hp: 3,

        turnOrder: index,
        items: createPlayerItems(shuffledPlayers.length),
        sawActive: false,
        skipTurns: 0

      };

    }
  );

  const shells =
    createShellSet(shuffledPlayers.length);

  const now =
    Date.now();

  return {

    phase:
      "preparing",

    prepareEndsAt:
      now + 3000,

    players:
      gamePlayersData,

    turn: {

      current:
        shuffledPlayers[0],

      index: 0

    },

    shells,

    lastEvent: {
      id:
        now.toString(36) +
        Math.random().toString(36).slice(2, 8),
      type: "start",
      playerId: shuffledPlayers[0],
      at: now
    },

    startedAt:
      now

  };

}

startBtn.addEventListener(
  "click",
  async () => {

    if (!currentPlayerId) {
      return;
    }

    startBtn.disabled = true;

    try {

      const roomRef =
        ref(db, "room");

      const result =
        await runTransaction(
          roomRef,
          room => {

            if (!room) {
              return;
            }

            if (
              room.status ===
              "playing"
            ) {

              return;

            }

            const players =
              room.players || {};

            const playerIds =
              Object.keys(players);

            if (
              playerIds.length < 2
            ) {

              return;

            }

            if (
              !players[
                currentPlayerId
              ]
            ) {

              return;

            }

            const gameState =
              createGameState(
                playerIds
              );

            return {

              ...room,

              status:
                "playing",

              game:
                gameState

            };

          }
        );


      if (
        !result.committed
      ) {

        const snapshot =
          await get(
            ref(db, "room")
          );

        if (
          snapshot.exists() &&
          snapshot.val().status ===
          "lobby"
        ) {

          const players =
            snapshot.val().players ||
            {};

          if (
            Object.keys(players).length <
            2
          ) {

            roomMessage.textContent =
              "Minimal 2 pemain untuk memulai.";

          }

        }

      }

    } catch (error) {

      console.error(error);

      roomMessage.textContent =
        "Gagal memulai game.";

    } finally {

      startBtn.disabled = false;

    }

  }
);


/* =========================
   WATCH GAME
========================= */

function watchGame() {

  if (gameWatcherStarted) {
    return;
  }

  gameWatcherStarted = true;

  onValue(
    ref(db, "room/game"),
    async snapshot => {

      if (!snapshot.exists()) {

        gameData = null;

        return;

      }

      const nextGameData =
        snapshot.val();

      const nextShot =
        nextGameData?.lastShot;

      if (
        nextShot?.id &&
        nextShot.id !== lastRenderedShotId &&
        nextShot.result === "live" &&
        nextShot.targetId === currentPlayerId
      ) {
        lastRenderedShotId = nextShot.id;
        triggerDamageFlash();
      }

      gameData =
        nextGameData;

      await renderGameState();

    }
  );

}

/* =========================
   LOAD GAME PLAYERS
========================= */

async function loadGamePlayers() {

  if (
    !gameData ||
    !gameData.players
  ) {

    gamePlayers = [];
    return;

  }

  const sortedPlayers =
    Object.entries(
      gameData.players
    ).sort(
      ([, a], [, b]) =>
        Number(a.turnOrder ?? 0) -
        Number(b.turnOrder ?? 0)
    );

  const loadedPlayers =
    await Promise.all(
      sortedPlayers.map(
        async ([playerId, gamePlayer]) => {

          const snapshot =
            await get(
              ref(
                db,
                "players/" + playerId
              )
            );

          if (!snapshot.exists()) {
            return null;
          }

          const player = snapshot.val();

          return {
            id: playerId,
            name: player.name || "Unknown",
            profile: player.profile || "",
            profileColor: player.profileColor || "",
            hp: Number(gamePlayer.hp ?? 3),
            turnOrder: Number(gamePlayer.turnOrder ?? 0)
          };

        }
      )
    );

  gamePlayers = loadedPlayers.filter(Boolean);

}

/* =========================
   RENDER GAME PLAYER LIST
========================= */

function renderGamePlayerList() {

  if (
    !gameData ||
    gameData.phase !== "playing"
  ) {
    return;
  }

  const players =
    [...gamePlayers].sort(
      (a, b) =>
        Number(a.turnOrder ?? 0) -
        Number(b.turnOrder ?? 0)
    );

  playerListTitle.textContent =
    "List Pemain : " + players.length;

  playersListContainer.innerHTML = "";

  players.forEach(player => {

    const row =
      document.createElement("div");

    row.className = "pl-list";

    if (
      gameData.turn?.current === player.id &&
      player.hp > 0
    ) {
      row.classList.add("current-turn");
    }

    const user =
      document.createElement("div");

    user.className = "pl-user";

    const profile =
      document.createElement("span");

    profile.className = "profile";

    if (player.profile) {

      const image =
        document.createElement("img");

      image.src = player.profile;
      image.alt = "Profile";

      profile.appendChild(image);

    } else {

      profile.textContent =
        (player.name || "?")
          .charAt(0)
          .toUpperCase();

    }

    const name =
      document.createElement("span");

    name.className = "nama";
    name.textContent =
      player.name || "Unknown";

    user.appendChild(profile);
    user.appendChild(name);

    const health =
      document.createElement("div");

    health.className = "pl-healt";

    const hp = Math.max(
      0,
      Math.min(3, Number(player.hp ?? 0))
    );

    for (let i = 0; i < 3; i++) {

      const icon =
        document.createElement("i");

      icon.setAttribute(
        "data-lucide",
        i < hp ? "zap" : "zap-off"
      );

      if (i >= hp) {
        icon.classList.add("heart-off");
      }

      health.appendChild(icon);

    }

    row.appendChild(user);
    row.appendChild(health);
    playersListContainer.appendChild(row);

  });

  const gamePlayerIds =
    new Set(players.map(player => player.id));

  const roomPlayers =
    roomData?.players || {};

  /*
   * Jika sistem room memiliki node spectators,
   * gunakan node tersebut. Jika tidak ada, pemain
   * yang berada di room tetapi tidak ada di game
   * dianggap spectator.
   */
  const spectatorIds = [];

  const roomSpectators =
    roomData?.spectators || {};

  Object.keys(roomSpectators).forEach(id => {
    if (!spectatorIds.includes(id)) {
      spectatorIds.push(id);
    }
  });

  Object.keys(roomPlayers).forEach(id => {
    if (
      !gamePlayerIds.has(id) &&
      !spectatorIds.includes(id)
    ) {
      spectatorIds.push(id);
    }
  });

  spectatorTitle.textContent =
    "Spectator : " + spectatorIds.length;

  spectatorListContainer.innerHTML = "";

  if (spectatorIds.length === 0) {

    const empty =
      document.createElement("div");

    empty.className = "sp-empty";
    empty.textContent = "Tidak ada spectator.";

    spectatorListContainer.appendChild(empty);

  } else {

    spectatorIds.forEach(async id => {

      let player = null;

      const snapshot =
        await get(ref(db, "players/" + id));

      if (snapshot.exists()) {
        player = snapshot.val();
      }

      if (!player) {
        return;
      }

      const row =
        document.createElement("div");

      row.className = "sp-list";

      const profile =
        document.createElement("span");

      profile.className = "profile";
      profile.style.background = getPlayerAvatarColor(player);

      if (player.profile) {

        const image =
          document.createElement("img");

        image.src = player.profile;
        image.alt = "Profile";
        profile.appendChild(image);

      } else {

        profile.textContent =
          (player.name || "?")
            .charAt(0)
            .toUpperCase();

      }

      const name =
        document.createElement("span");

      name.className = "nama";
      name.textContent =
        player.name || "Unknown";

      row.appendChild(profile);
      row.appendChild(name);
      spectatorListContainer.appendChild(row);

    });

  }

  lucide.createIcons();

}

   GAME MESSAGE
========================= */

function clearGameMessageTimers() {
  messageTimers.forEach(timer => clearTimeout(timer));
  messageTimers = [];
}

function clearGameMessage() {
  clearGameMessageTimers();
  gameMessage.innerHTML = "";
}

function appendGameMessage(
  text,
  type = "info",
  icon = null,
  duration = 3600
) {
  /* Pesan info dapat menampilkan maksimal 5 card.
     Pesan hasil tembakan tetap dibatasi 2 card. */
  const maxMessages = type === "info" ? 5 : 2;

  if (type === "info") {
    while (gameMessage.querySelectorAll(".message-line.info").length >= maxMessages) {
      gameMessage.querySelector(".message-line.info")?.remove();
    }
  } else {
    while (gameMessage.children.length >= maxMessages) {
      gameMessage.firstElementChild.remove();
    }
  }

  const line = document.createElement("div");
  line.className = "message-line " + type;

  if (icon) {
    const iconElement = document.createElement("i");
    iconElement.setAttribute("data-lucide", icon);
    line.appendChild(iconElement);
  }

  const textElement = document.createElement("span");
  textElement.textContent = text;
  line.appendChild(textElement);

  gameMessage.appendChild(line);
  lucide.createIcons();

  const removeTimer = setTimeout(() => {
    line.classList.add("removing");

    setTimeout(() => {
      line.remove();
    }, 250);
  }, duration);

  messageTimers.push(removeTimer);

  return line;
}

function getPlayerNameById(id) {
  return gamePlayers.find(
    player => player.id === id
  )?.name || "Unknown";
}

function showGameEvent(eventData) {
  if (!eventData?.id) {
    return;
  }

  if (eventData.id === messageSequenceId) {
    return;
  }

  messageSequenceId = eventData.id;

  const shooterName =
    getPlayerNameById(eventData.playerId);

  const targetName =
    getPlayerNameById(
      eventData.targetId || eventData.playerId
    );

  if (eventData.type === "start") {
    clearGameMessage();

    /* Game dimulai: bell + active bersamaan. */
    playGameSound("bell");
    playGameSound("active", 0.9, 120);

    appendGameMessage(
      "Game di mulai",
      "info",
      null,
      3200
    );

    messageTimers.push(
      setTimeout(() => {
        appendGameMessage(
          "Giliran pertama adalah " + shooterName,
          "info",
          null,
          3600
        );
      }, 900)
    );

    return;
  }

  if (eventData.type === "item") {
    const itemName = ITEM_DEFINITIONS[eventData.itemType]?.name || "Item";
    const userName = getPlayerNameById(eventData.playerId);
    appendGameMessage(
      `${userName} menggunakan ${itemName}${eventData.targetId ? " pada " + getPlayerNameById(eventData.targetId) : ""}.`,
      "info",
      null,
      3600
    );
    return;
  }

  if (eventData.type === "shot_pending") {
    /* Chat "X menembak Y..." menjadi titik mulai charge-shot. */
    playGameSound("charge-shot");

    appendGameMessage(
      shooterName + " menembak " + targetName + "...",
      "info",
      null,
      3600
    );

    return;
  }

  if (eventData.type !== "shot") {
    return;
  }

  if (eventData.result === "live") {
    const damageText = Number(eventData.damage || 1);
    const hpText =
      Number(eventData.targetHp || 0) > 0
        ? ` kehilangan ${damageText} nyawa`
        : " kehilangan seluruh nyawa dan keluar dari permainan";

    /* Suara ditembakkan tepat saat teks hasil muncul. */
    appendGameMessage(
      "Peluru Alive " + targetName + hpText,
      "live",
      "test-tube",
      3600
    );
    playGameSound("shot-alive");
    playGameSound("hit", 1, 140);

    /* Death hanya diputar jika HP target benar-benar menjadi 0. */
    if (Number(eventData.targetHp || 0) <= 0 && !eventData.finished) {
      playGameSound("death", 1, 220);
    }
  } else {
    appendGameMessage(
      "Peluru blank",
      "blank",
      "test-tube",
      3600
    );
    playGameSound("shot-blank");
  }

  messageTimers.push(
    setTimeout(() => {
      if (eventData.finished) {
        const winnerName =
          getPlayerNameById(eventData.winnerId);

        /* Kemenangan: levelup terlebih dahulu, lalu winner. */
        playGameSound("levelup");
        playGameSound("winner", 1, 700);

        appendGameMessage(
          winnerName + " pemenangnya",
          "win",
          null,
          5000
        );
        return;
      }

      if (eventData.reload) {
        /* Shell lama keluar, lalu shell baru masuk. */
        playGameSound("out");

        appendGameMessage(
          "Shell telah habis",
          "info",
          null,
          2600
        );

        messageTimers.push(
          setTimeout(() => {
            playGameSound("in");

            appendGameMessage(
              "Mengisi ulang shell...",
              "info",
              null,
              2600
            );
          }, 650)
        );

        messageTimers.push(
          setTimeout(() => {
            appendGameMessage(
              "Giliran lanjut ke " +
                getPlayerNameById(eventData.nextId),
              "info",
              null,
              3600
            );
          }, 1450)
        );

        return;
      }

      if (eventData.result === "blank" && eventData.isSelf) {
        appendGameMessage(
          "Giliran lanjut ke " + shooterName,
          "info",
          null,
          3600
        );
      } else {
        appendGameMessage(
          "Giliran lanjut ke " +
            getPlayerNameById(eventData.nextId),
          "info",
          null,
          3600
        );
      }
    }, 1750)
  );
}


/* =========================
   RENDER GAME STATE
========================= */

async function renderGameState() {

  if (!gameData) {
    return;
  }

  await loadGamePlayers();

  showGameEvent(gameData.lastEvent);

  renderShellInfo();
  renderMyItems();

  if (playerListPopup.classList.contains("show")) {
    renderGamePlayerList();
  }
  renderShotEffects();

  document.querySelector(
    ".game-online"
  ).textContent =
    gamePlayers.length;

  updateCurrentTurn();
  updateTurnPanel();

  updateGameHealth();

  updateNextPlayer();

  updateShotVisibility();

  updatePreparation();

  handleGameFinished();

}


/* =========================
   HANDLE GAME FINISHED
========================= */

function handleGameFinished() {

  if (
    !gameData ||
    gameData.phase !==
    "finished"
  ) {

    hideWinnerScreen();
    return;

  }

  const winnerId =
    gameData.winner ||
    null;

  if (!winnerId) {
    return;
  }

  const gameStartedAt =
    gameData.startedAt || null;

  if (
    winnerId === lastWinnerId &&
    gameStartedAt === lastFinishedStartedAt
  ) {
    return;
  }

  lastWinnerId =
    winnerId;
  lastFinishedStartedAt =
    gameStartedAt;

  const winner =
    gamePlayers.find(
      player =>
        player.id === winnerId
    );

  const winnerNameText =
    winner?.name ||
    "Unknown";

  showWinnerScreen(
    winnerNameText
  );

}


function showWinnerScreen(
  name
) {

  if (winnerTimer) {
    clearTimeout(winnerTimer);
    winnerTimer = null;
  }

  winnerCleanupStartedAt =
    gameData?.startedAt ||
    Date.now();

  winnerScreen.classList.remove(
    "hidden"
  );

  winnerTitle.textContent = "";
  winnerName.textContent = name;
  winnerTitle.style.color = "white";
  winnerName.style.transform =
    "scaleY(0)";
  winnerCard.style.animation =
    "winnerSlide 0.6s linear forwards";
  winnerTrophy.style.animation =
    "winnerSpin 0.6s linear 1 forwards";
  winnerTrophyIcon.style.animation =
    "winnerShake 2.5s ease-in-out 4";

  const text = "WINNER";

  text.split("").forEach(
    (char, index) => {
      setTimeout(() => {
        winnerTitle.textContent +=
          char;
      }, index * 120);
    }
  );

  const titleEnd =
    text.length * 120;

  setTimeout(() => {
    winnerTitle.style.color =
      "gold";
  }, titleEnd + 100);

  setTimeout(() => {
    winnerName.style.transform =
      "scaleY(1)";
  }, titleEnd + 180);

  winnerTimer = setTimeout(
    () => {
      cleanupFinishedRoom(
        winnerCleanupStartedAt
      );
    },
    7000
  );

}


function hideWinnerScreen() {

  if (winnerTimer) {
    clearTimeout(winnerTimer);
    winnerTimer = null;
  }

  winnerScreen.classList.add(
    "hidden"
  );

  winnerTitle.textContent = "";
  winnerName.textContent = "";
  winnerTitle.style.color = "white";
  winnerName.style.transform =
    "scaleY(0)";
  winnerCard.style.animation = "none";
  winnerTrophy.style.animation = "none";
  winnerTrophyIcon.style.animation =
    "none";
}


async function cleanupFinishedRoom(
  startedAt
) {

  if (!startedAt) {
    return;
  }

  try {

    await runTransaction(
      ref(db, "room"),
      room => {

        if (!room) {
          return;
        }

        if (
          room.status !== "playing" ||
          room.game?.phase !== "finished" ||
          room.game?.startedAt !== startedAt
        ) {
          return;
        }

        return null;

      }
    );

  } catch (error) {

    console.error(
      "Gagal menghapus room:",
      error
    );

  }

}

/* =========================
   RENDER SHELL INFO
========================= */

function renderShellInfo() {

  const total =
    Number(
      gameData.shells?.total || 0
    );

  const current = Math.max(
    0,
    Number(gameData.shells?.current || 0)
  );

  const sequence =
    Array.isArray(gameData.shells?.sequence)
      ? gameData.shells.sequence
      : [];

  const remaining =
    sequence.slice(current);

  const alive = remaining.filter(
    type => type === "live"
  ).length;

  const blank = remaining.filter(
    type => type === "blank"
  ).length;

  aliveCount.textContent =
    "Peluru Alive : " + alive;

  blankCount.textContent =
    "Peluru Blank : " + blank;

  if (gameLiveCount) {
    gameLiveCount.textContent = alive;
  }

  if (gameBlankCount) {
    gameBlankCount.textContent = blank;
  }


  shellContainer.innerHTML = "";


  for (
    let i = 0;
    i < total;
    i++
  ) {

    const icon =
      document.createElement("i");

    icon.setAttribute(
      "data-lucide",
      "test-tube"
    );

    if (
      i >= alive
    ) {

      icon.classList.add(
        "blank"
      );

    }

    shellContainer.appendChild(
      icon
    );

  }

  lucide.createIcons();

  const setId =
    gameData.shells?.setId || null;

  if (
    setId &&
    (gameData.phase === "preparing" ||
      gameData.phase === "playing") &&
    setId !== shellRenderId
  ) {
    shellRenderId = setId;
    showShellReveal();
  }

}

function showShellReveal() {

  const shellElement =
    document.querySelector(".random-shell");

  clearTimeout(shellRevealTimer);

  shellElement.classList.add("hidden");

  const revealDelay =
    gameData?.lastEvent?.reload ? 2500 : 0;

  shellRevealTimer = setTimeout(() => {
    if (
      gameData?.phase === "preparing" ||
      gameData?.phase === "playing"
    ) {
      shellElement.classList.remove("hidden");
    }

    shellRevealTimer = setTimeout(() => {
      if (gameData?.phase === "playing") {
        shellElement.classList.add("hidden");
      }
    }, 3500);
  }, revealDelay);

}

function triggerDamageFlash() {

  damageFlash.classList.remove("hidden");
  damageFlash.classList.remove("damage-flash");

  void damageFlash.offsetWidth;

  damageFlash.classList.add("damage-flash");

  setTimeout(() => {
    damageFlash.classList.add("hidden");
  }, 1550);

}


function renderShotEffects() {
  const shotData = gameData?.lastShot;

  if (!shotData?.id) {
    return;
  }

  if (shotData.id === lastRenderedShotId) {
    return;
  }

  lastRenderedShotId = shotData.id;

  if (
    shotData.result === "live" &&
    shotData.targetId === currentPlayerId
  ) {
    triggerDamageFlash();
  }
}


/* =========================
   PREPARATION
========================= */

function updatePreparation() {

  if (
    !gameData ||
    gameData.phase !==
    "preparing"
  ) {

    clearPreparationTimer();

    if (
      !gameData ||
      gameData.phase === "finished"
    ) {
      clearTimeout(shellRevealTimer);
      document.querySelector(
        ".random-shell"
      ).classList.add("hidden");
    }

    return;

  }


  document.querySelector(
    ".random-shell"
  ).classList.remove(
    "hidden"
  );


  shot.classList.add(
    "hidden"
  );

  disableShotButtons();

  resetShot(false);


  const endsAt =
    Number(
      gameData.prepareEndsAt || 0
    );


  const remaining =
    endsAt - Date.now();


  if (
    remaining <= 0
  ) {

    finishPreparation();

    return;

  }


  if (prepareTimer) {
    return;
  }


  prepareTimer =
    setTimeout(
      () => {

        prepareTimer = null;

        finishPreparation();

      },
      remaining + 50
    );

}


/* =========================
   CLEAR PREPARATION TIMER
========================= */

function clearPreparationTimer() {

  if (!prepareTimer) {
    return;
  }

  clearTimeout(
    prepareTimer
  );

  prepareTimer = null;

}


/* =========================
   FINISH PREPARATION
========================= */

async function finishPreparation() {

  if (!gameData || gameData.phase !== "preparing") {
    return;
  }

  const gameRef = ref(db, "room/game");

  try {
    const result = await runTransaction(gameRef, game => {
      if (!game || game.phase !== "preparing") {
        return;
      }

      const endsAt = Number(game.prepareEndsAt || 0);
      if (Date.now() < endsAt) {
        return;
      }

      return {
        ...game,
        phase: "playing",
        shotPending: null
      };
    });

    if (!result.committed) {
      const snapshot = await get(gameRef);
      if (snapshot.exists()) {
        gameData = snapshot.val();
        await renderGameState();
      }
    }
  } catch (error) {
    console.error("Finish preparation error:", error);
  }
}


/* =========================
   CURRENT TURN
========================= */

function updateCurrentTurn() {

  const currentElement =
    document.querySelector(
      ".game-current-name"
    );

  if (
    !gameData ||
    !gameData.turn
  ) {

    currentElement.textContent =
      "-";

    return;

  }


  const currentId =
    gameData.turn.current;


  const currentPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentId
    );


  currentElement.textContent =
    currentPlayer
      ? currentPlayer.name
      : "-";

}


function updateTurnPanel() {
  const panel =
    document.querySelector(".game-panel");

  if (!panel) {
    return;
  }

  const hasTurn =
    gameData &&
    gameData.phase === "playing" &&
    gameData.turn?.current === currentPlayerId;

  panel.classList.toggle(
    "current-turn",
    hasTurn
  );
}


/* =========================
   NEXT PLAYER
========================= */

function updateNextPlayer() {

  const nextElement =
    document.querySelector(
      ".next-name"
    );

  if (
    !gameData ||
    !gameData.turn
  ) {

    nextElement.textContent =
      "-";

    return;

  }

  const currentId =
    gameData.turn.current;

  const currentIndex =
    gamePlayers.findIndex(
      player =>
        player.id === currentId
    );

  if (currentIndex < 0) {

    nextElement.textContent =
      "-";

    return;

  }

  const livingPlayers =
    gamePlayers.filter(
      player =>
        player.hp > 0
    );

  if (livingPlayers.length <= 1) {

    nextElement.textContent =
      "-";

    return;

  }

  for (
    let step = 1;
    step <= gamePlayers.length;
    step++
  ) {

    const nextIndex =
      (currentIndex + step) %
      gamePlayers.length;

    const nextPlayer =
      gamePlayers[nextIndex];

    if (
      nextPlayer &&
      nextPlayer.hp > 0
    ) {

      nextElement.textContent =
        nextPlayer.name;

      return;

    }

  }

  nextElement.textContent =
    "-";

}


/* =========================
   GAME HEALTH
========================= */

function updateGameHealth() {

  const healthContainer =
    document.querySelector(
      ".healt"
    );


  healthContainer.innerHTML = "";


  /*
    HP YANG DITAMPILKAN ADALAH
    HP PEMAIN SENDIRI.
  */

  const myPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentPlayerId
    );


  if (!myPlayer) {

    return;

  }


  const hp =
    Math.max(
      0,
      Math.min(
        3,
        Number(
          myPlayer.hp ?? 0
        )
      )
    );


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const icon =
      document.createElement("i");


    if (
      i < 3 - hp
    ) {

      icon.setAttribute(
        "data-lucide",
        "zap-off"
      );

      icon.classList.add(
        "hp-off"
      );

    } else {

      icon.setAttribute(
        "data-lucide",
        "zap"
      );

    }


    healthContainer.appendChild(
      icon
    );

  }


  lucide.createIcons();

}


/* =========================
   SHOT VISIBILITY
========================= */

function updateShotVisibility() {

  if (
    !gameData ||
    gameData.phase !==
    "playing" ||
    !gameData.turn
  ) {

    shot.classList.add(
      "hidden"
    );

    disableShotButtons();

    return;

  }


  const myTurn =
    gameData.turn.current ===
    currentPlayerId;

  if (gameData.shotPending) {
    shot.classList.add("hidden");
    disableShotButtons();
    return;
  }


  shot.classList.toggle(
    "hidden",
    !myTurn
  );


  if (!myTurn) {

    resetShot();

    return;

  }


  const myPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentPlayerId
    );


  if (
    !myPlayer ||
    myPlayer.hp <= 0
  ) {

    shot.classList.add(
      "hidden"
    );

    disableShotButtons();

    return;

  }


  if (
    Number(
      gameData.shells?.current || 0
    ) >= Number(
      gameData.shells?.total || 0
    )
  ) {

    shot.classList.add(
      "hidden"
    );

    disableShotButtons();

    return;

  }

}

   CLICK SHOTGUN
========================= */

shot.addEventListener(
  "click",
  () => {

    if (shootingLocked || gameData?.shotPending) {
      return;
    }

    if (
      !gameData ||
      gameData.phase !==
      "playing"
    ) {

      return;

    }

    if (
      !gameData.turn ||
      gameData.turn.current !==
      currentPlayerId
    ) {

      return;

    }

    const shellIndex =
      Number(
        gameData.shells?.current || 0
      );


    if (
      shellIndex >= Number(
        gameData.shells?.total || 0
      )
    ) {

      alert(
        "Semua shell sudah habis."
      );

      return;

    }


    shotMode = true;

    shot.classList.add(
      "active"
    );

    enableShotButtons();

  }
);

/* =========================
   RENDER PLAYER POPUP
========================= */

function renderPlayerPopup() {

  playerContainer.innerHTML = "";


  gamePlayers.forEach(
    player => {

      if (
        player.id ===
        currentPlayerId
      ) {

        return;

      }


      if (
        player.hp <= 0
      ) {

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "st-list";


      const firstLetter =
        player.name
          .charAt(0)
          .toUpperCase();


      let profileHTML;


      if (player.profile) {

        profileHTML = `

          <span class="st-profile" style="background:${getPlayerAvatarColor(player)};">

            <img
              src="${player.profile}"
              alt="Profile">

          </span>

        `;

      } else {

        profileHTML = `

          <span class="st-profile" style="background:${getPlayerAvatarColor(player)};">
            ${firstLetter}
          </span>

        `;

      }


      item.innerHTML = `

        <div class="st-user">

          ${profileHTML}

          <span class="st-nama">
            ${player.name}
          </span>

          <span class="st-healt">
            (${player.hp})
          </span>

        </div>


        <button
          class="st-player-btn"
          data-id="${player.id}">

          Shot

        </button>

      `;


      playerContainer.appendChild(
        item
      );

    }
  );


  if (
    playerContainer
      .children.length === 0
  ) {

    playerContainer.innerHTML = `

      <div
        style="
          padding:10px 0;
          text-align:center;
          color:#777;
        ">

        Tidak ada pemain lain.

      </div>

    `;

  }

}

playerContainer.addEventListener(

    if (!button) {
      return;
    }


    if (shootingLocked) {
      return;
    }


    const targetId =
      button.dataset.id;


    const target =
      gamePlayers.find(
        player =>
          player.id ===
          targetId
      );


    if (!target) {
      return;
    }


    selectedTarget =
      target;

    if (itemMode && selectedItemType === "handcuff") {
      useSelectedItem(targetId);
      return;
    }

    closeShotPopup();

    shoot(
      targetId
    );

  }
);


/* =========================
   SHOOT
========================= */

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function shoot(targetId) {

  if (shootingLocked || !gameData || gameData.shotPending) {
    return;
  }

  if (!targetId) {
    alert("Target tidak ditemukan.");
    return;
  }

  if (gameData.phase !== "playing") {
    return;
  }

  if (!gameData.turn || gameData.turn.current !== currentPlayerId) {
    alert("Bukan giliran kamu.");
    return;
  }

  shootingLocked = true;

  const gameRef = ref(db, "room/game");
  let pendingId = null;

  try {
    /* Tahap 1: tampilkan pesan menembak. Belum memproses shell. */
    const pendingResult = await runTransaction(gameRef, currentGame => {
      if (!currentGame || currentGame.phase !== "playing") {
        return;
      }

      if (currentGame.turn?.current !== currentPlayerId) {
        return;
      }

      if (currentGame.shotPending) {
        return;
      }

      const targetPlayer = currentGame.players?.[targetId];
      if (!targetPlayer || Number(targetPlayer.hp ?? 0) <= 0) {
        return;
      }

      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      pendingId = id;

      return {
        ...currentGame,
        shotPending: {
          id,
          playerId: currentPlayerId,
          targetId,
          at: Date.now()
        },
        lastEvent: {
          id,
          type: "shot_pending",
          playerId: currentPlayerId,
          targetId,
          at: Date.now()
        }
      };
    });

    if (!pendingResult.committed || !pendingId) {
      const snapshot = await get(gameRef);
      if (snapshot.exists()) {
        gameData = snapshot.val();
        await renderGameState();
      }
      return;
    }

    /* Jeda suspense sebelum shell benar-benar diproses. */
    await wait(1500);

    let shotResult = null;
    let isSelf = false;

    const result = await runTransaction(gameRef, currentGame => {
      if (!currentGame || currentGame.phase !== "playing") {
        return;
      }

      const pending = currentGame.shotPending;
      if (
        !pending ||
        pending.id !== pendingId ||
        pending.playerId !== currentPlayerId ||
        pending.targetId !== targetId
      ) {
        return;
      }

      if (currentGame.turn?.current !== currentPlayerId) {
        return;
      }

      const players = currentGame.players || {};
      const targetPlayer = players[targetId];
      if (!targetPlayer || Number(targetPlayer.hp ?? 0) <= 0) {
        return;
      }

      let shells = currentGame.shells;
      let currentShell = Number(shells?.current ?? 0);

      if (!shells || !shells.sequence) {
        shells = createShellSet(Object.keys(players).length);
        currentGame.shells = shells;
        currentShell = 0;
      }

      if (currentShell >= Number(shells.total || 0)) {
        shells = createShellSet(Object.keys(players).length);
        currentGame.shells = shells;
        currentShell = 0;
      }

      const currentShellType = shells.sequence[currentShell];
      if (!currentShellType) {
        return;
      }

      const playerIds = Object.keys(players)
        .filter(id => players[id])
        .sort((a, b) => Number(players[a].turnOrder ?? 0) - Number(players[b].turnOrder ?? 0));

      if (!playerIds.length) {
        return;
      }

      isSelf = targetId === currentPlayerId;

      if (currentShellType === "live") {
        const damage = Number(players[currentPlayerId]?.sawActive ?? 0) ? 2 : 1;
        targetPlayer.hp = Math.max(0, Number(targetPlayer.hp ?? 0) - damage);
        players[currentPlayerId].sawActive = false;
        shotResult = "live";
      } else {
        // Hand Saw hanya berlaku untuk peluru live berikutnya.
        players[currentPlayerId].sawActive = false;
        shotResult = "blank";
      }

      currentGame.shells.current = currentShell + 1;
      currentGame.shotPending = null;

      currentGame.lastShot = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        targetId,
        result: shotResult,
        shellType: currentShellType,
        at: Date.now()
      };

      const livingPlayerIds = playerIds.filter(
        id => Number(players[id]?.hp ?? 0) > 0
      );

      if (livingPlayerIds.length <= 1) {
        currentGame.phase = "finished";
        currentGame.winner = livingPlayerIds[0] || null;
        currentGame.turn.current = livingPlayerIds[0] || currentPlayerId;
        currentGame.turn.index = livingPlayerIds[0] ? playerIds.indexOf(livingPlayerIds[0]) : 0;

        currentGame.lastEvent = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
          type: "shot",
          playerId: currentPlayerId,
          targetId,
          result: shotResult,
          damage: shotResult === "live" ? damage : 0,
          targetHp: Number(targetPlayer.hp ?? 0),
          isSelf,
          finished: true,
          winnerId: currentGame.winner || null,
          nextId: livingPlayerIds[0] || null,
          reload: false,
          at: Date.now()
        };

        return currentGame;
      }

      let shellReloaded = false;
      if (currentGame.shells.current >= Number(currentGame.shells.total || 0)) {
        currentGame.shells = createShellSet(playerIds.length);
        playerIds.forEach(id => {
          if (players[id]) {
            players[id].items = createPlayerItems(playerIds.length);
            players[id].sawActive = false;
            players[id].skipTurns = 0;
          }
        });
        shellReloaded = true;
      }

      if (currentShellType === "blank" && isSelf) {
        const currentIndex = playerIds.indexOf(currentPlayerId);
        currentGame.turn.current = currentPlayerId;
        currentGame.turn.index = currentIndex >= 0 ? currentIndex : 0;
      } else {
        const currentIndex = playerIds.indexOf(currentPlayerId);
        if (currentIndex < 0) {
          return;
        }

        let nextIndex = (currentIndex + 1) % playerIds.length;
        let checked = 0;

        while (checked < playerIds.length) {
          const candidateId = playerIds[nextIndex];
          if (Number(players[candidateId]?.hp ?? 0) > 0) {
            if (Number(players[candidateId]?.skipTurns ?? 0) > 0) {
              players[candidateId].skipTurns = Number(players[candidateId].skipTurns) - 1;
              nextIndex = (nextIndex + 1) % playerIds.length;
              checked++;
              continue;
            }
            break;
          }
          nextIndex = (nextIndex + 1) % playerIds.length;
          checked++;
        }

        currentGame.turn.current = playerIds[nextIndex];
        currentGame.turn.index = nextIndex;
      }

      currentGame.lastEvent = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        type: "shot",
        playerId: currentPlayerId,
        targetId,
        result: shotResult,
        damage: shotResult === "live" ? damage : 0,
        targetHp: Number(targetPlayer.hp ?? 0),
        isSelf,
        finished: false,
        winnerId: null,
        nextId: currentGame.turn.current || null,
        reload: shellReloaded,
        at: Date.now()
      };

      return currentGame;
    });

    if (!result.committed) {
      const snapshot = await get(gameRef);
      if (snapshot.exists()) {
        gameData = snapshot.val();
        await renderGameState();
      }
      return;
    }

    shotMode = false;
    selectedTarget = null;
    closeShotPopup();
    resetShot();

    if (shotResult === "live" && isSelf) {
      triggerDamageFlash();
    }

    const snapshot = await get(gameRef);
    if (snapshot.exists()) {
      gameData = snapshot.val();
      await renderGameState();
    }

  } catch (error) {
    console.error("Shoot error:", error);

    const snapshot = await get(gameRef);
    if (snapshot.exists()) {
      gameData = snapshot.val();
      await renderGameState();
    }
  } finally {
    shootingLocked = false;
  }
}


/* =========================
   ENABLE SHOT BUTTON
========================= */

function enableShotButtons() {

  if (shootingLocked) {
    return;
  }

  playerBtn.disabled =
    false;

  selfBtn.disabled =
    false;

  if (itemMode && selectedItemType) {
    playerBtn.textContent = "Use";
    selfBtn.textContent = "Info";
  } else {
    playerBtn.textContent = "Player";
    selfBtn.textContent = "Self";
  }

}


/* =========================
   DISABLE SHOT BUTTON
========================= */

function disableShotButtons() {

  playerBtn.disabled =
    true;

  selfBtn.disabled =
    true;

}


/* =========================
   RESET SHOT
========================= */

function resetShot(
  hideShotMode = true
) {

  if (hideShotMode) {

    shotMode = false;

  }


  selectedTarget = null;
  resetItemSelection();


  shot.classList.remove(
    "active"
  );


  disableShotButtons();

}


/* =========================
   CLICK OUTSIDE
========================= */

document.addEventListener(
  "click",
  event => {

    if (!shotMode) {
      return;
    }


    const clickedShot =
      event.target.closest(
        ".shot"
      );


    const clickedPlayerBtn =
      event.target.closest(
        ".other"
      );


    const clickedSelfBtn =
      event.target.closest(
        ".self"
      );


    const clickedItem =
      event.target.closest(
        ".items-have .item"
      );


    const clickedPopup =
      event.target.closest(
        ".shot-list"
      );


    const clickedOverlay =
      event.target.closest(
        ".overlay"
      );


    if (clickedShot) {
      if (itemMode) {
        resetShot();
      }
      return;
    }


    if (clickedPlayerBtn) {
      return;
    }


    if (clickedSelfBtn) {
      return;
    }


    if (clickedItem) {
      return;
    }


    if (clickedPopup) {
      return;
    }


    if (clickedOverlay) {
      return;
    }


    resetShot();

  }
);


/* =========================
   INITIALIZE
========================= */

async function initialize() {

  try {

    const loaded =
      await loadSavedPlayer();


    if (loaded) {

      showLobby();

    } else {

      showLogin();

    }

  } catch (error) {

    console.error(error);

    showLogin();

  }

}


/* =========================
   LUCIDE
========================= */

lucide.createIcons();


/* =========================
   START
========================= */

initialize();

</script>
