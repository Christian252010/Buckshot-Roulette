/* =========================
   NORMALIZE NAME
========================= */

function normalizeName(name) {

  return name
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");

}


/* =========================
   NAME EXISTS
========================= */

async function nameExists(name) {

  const targetName =
    normalizeName(name);


  const snapshot =
    await get(ref(db, "players"));


  if (!snapshot.exists()) {
    return false;
  }


  const players =
    snapshot.val();


  return Object.values(players).some(
    player => {

      return normalizeName(
        player.name || ""
      ) === targetName;

    }
  );

}


/* =========================
   RESERVE NAME
========================= */

async function reserveName(name) {

  const normalized =
    normalizeName(name);


  const nameKey =
    encodeURIComponent(normalized);


  const nameRef =
    ref(db, "names/" + nameKey);


  const result =
    await runTransaction(
      nameRef,
      current => {

        if (current === null) {

          return {

            name: name,

            createdAt: Date.now()

          };

        }


        return;

      }
    );


  return result.committed;

}


/* =========================
   LOAD SAVED PLAYER
========================= */

async function loadSavedPlayer() {

  const savedId =
    localStorage.getItem(
      "buckshotPlayerId"
    );


  if (!savedId) {
    return false;
  }


  const snapshot =
    await get(
      ref(
        db,
        "players/" + savedId
      )
    );


  if (!snapshot.exists()) {

    localStorage.removeItem(
      "buckshotPlayerId"
    );

    return false;

  }


  currentPlayerId =
    savedId;

  currentPlayer =
    snapshot.val();


  return true;

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
  "click",
  async () => {

    loginMessage.textContent = "";


    const name =
      loginName.value.trim();

    const profile =
      loginProfile.value.trim();


    if (!name) {

      loginMessage.textContent =
        "Nama wajib diisi.";

      return;

    }


    if (name.length < 2) {

      loginMessage.textContent =
        "Nama minimal 2 karakter.";

      return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Memproses...";


    try {

      const exists =
        await nameExists(name);


      if (exists) {

        loginMessage.textContent =
          "Nama tersebut sudah digunakan.";

        return;

      }


      const reserved =
        await reserveName(name);


      if (!reserved) {

        loginMessage.textContent =
          "Nama tersebut sudah digunakan.";

        return;

      }


      const playerRef =
        push(ref(db, "players"));


      currentPlayerId =
        playerRef.key;


      currentPlayer = {

        name: name,

        profile: profile,

        createdAt: Date.now()

      };


      await set(
        playerRef,
        currentPlayer
      );


      localStorage.setItem(
        "buckshotPlayerId",
        currentPlayerId
      );


      showLobby();


    } catch (error) {

      console.error(error);

      loginMessage.textContent =
        "Gagal masuk. Periksa koneksi Firebase.";

    } finally {

      loginBtn.disabled = false;

      loginBtn.textContent =
        "Masuk";

    }

  }
);

  game.classList.add(

/* =========================
   UPDATE HEADER
========================= */

function updateHeader() {

  if (!currentPlayer) {
    return;
  }


  const name =
    currentPlayer.name || "?";


  const profile =
    currentPlayer.profile || "";


  const firstLetter =
    name.charAt(0).toUpperCase();


  document
    .querySelectorAll(
      ".header-name, .game-name"
    )
    .forEach(element => {

      element.textContent = name;

    });


  document
    .querySelectorAll(
      ".header-profile, .game-profile"
    )
    .forEach(element => {

      if (profile) {

        element.innerHTML = `

          <img
            src="${profile}"
            alt="Profile">

        `;

      } else {

        element.textContent =
          firstLetter;

      }

    });

}


/* =========================
   WATCH ROOM
========================= */

function watchRoom() {

  onValue(
    ref(db, "room"),
    async snapshot => {

      roomData =
        snapshot.exists()
          ? snapshot.val()
          : null;


      await renderRoom();

    }
  );

}


/* =========================
   RENDER ROOM
========================= */

async function renderRoom() {

  if (!roomData) {

    createBtn.classList.remove(
      "hidden"
    );

    joinBtn.classList.add(
      "hidden"
    );

    startLeft.classList.add(
      "hidden"
    );

    roomMessage.textContent =
      "Belum ada room.";

    joinList.innerHTML = "";

    document.querySelector(
      ".online"
    ).textContent = "0";


    return;

  }


  if (roomData.status === "playing") {

    const joined =
      roomData.players &&
      roomData.players[
        currentPlayerId
      ];


    if (joined) {

      await enterGame();

      return;

    }


    createBtn.classList.add(

    );

    joinBtn.classList.add(

    );

    startLeft.classList.add(
      "hidden"
    );

    roomMessage.textContent =
      "Game sedang berjalan. Tunggu game selesai.";

    return;

  }


  const roomPlayers =
    roomData.players || {};


  const joined =
    !!roomPlayers[
      currentPlayerId
    ];


  createBtn.classList.toggle(
    "hidden",
    !!roomData
  );


  joinBtn.classList.toggle(

  roomMessage.textContent =

      ? "Kamu berada di room."
      : "Room tersedia. Tekan Join untuk masuk.";


  const playerIds =

  document.querySelector(
    ".online"
  ).textContent =

  await renderLobbyPlayers(

  );

}


/* =========================

async function renderLobbyPlayers(

  joinList.innerHTML = "";


  if (playerIds.length === 0) {

    joinList.innerHTML = `

      <div class="empty-room">
        Belum ada pemain.
      </div>

    `;

    return;

  }


  for (const playerId of playerIds) {

    const snapshot =
      await get(
        ref(
          db,
          "players/" + playerId
        )
      );


    if (!snapshot.exists()) {
      continue;
    }


    const player =
      snapshot.val();


    const item =
      document.createElement("div");


    item.className =
      "pl-list";


    const profile =
      player.profile || "";


    const firstLetter =
      (player.name || "?")
        .charAt(0)
        .toUpperCase();


    const profileHTML =
      profile

        ? `

          <div class="profile">

            <img
              src="${profile}"
              alt="Profile">

          </div>

        `

        : `

          <div class="profile">
            ${firstLetter}
          </div>

        `;


    item.innerHTML = `

      ${profileHTML}

      <div class="nama">
        ${player.name || "Unknown"}
      </div>

    `;


    joinList.appendChild(item);

  }

}

/* =========================
   SHUFFLE ARRAY
========================= */

function shuffleArray(array) {

  const result =
    [...array];


  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }


  return result;

}


/* =========================
   CREATE GAME STATE
========================= */

function createGameState(
  playerIds
) {

  const shuffledPlayers =
    shuffleArray(playerIds);


  const gamePlayersData = {};


  shuffledPlayers.forEach(
    (playerId, index) => {

      gamePlayersData[playerId] = {

        hp: 3,

        turnOrder: index

      };

    }
  );


  const alive =
    Math.floor(
      Math.random() * 7
    ) + 1;


  const blank =
    shellCount - alive;


  const shellData = [];


  for (
    let i = 0;
    i < alive;
    i++
  ) {

    shellData.push(
      "live"
    );

  }


  for (
    let i = 0;
    i < blank;
    i++
  ) {

    shellData.push(
      "blank"
    );

  }


  const shuffledShells =
    shuffleArray(shellData);


  return {

    players:
      gamePlayersData,

    turn: {

      current:
        shuffledPlayers[0],

      index: 0

    },

    shells: {

      total: 8,

      alive: alive,

      blank: blank,

      current: 0,

      sequence:
        shuffledShells

    },

    startedAt:
      Date.now()

  };

}


/* =========================
   START GAME
========================= */

startBtn.addEventListener(
  "click",
  async () => {

    if (!currentPlayerId) {
      return;
    }


    startBtn.disabled = true;


    try {

      const roomRef =
        ref(db, "room");


      const result =
        await runTransaction(
          roomRef,
          room => {

            if (!room) {
              return;
            }


            if (
              room.status ===
              "playing"
            ) {

              return;

            }


            const players =
              room.players || {};


            const playerIds =
              Object.keys(players);


            if (
              playerIds.length < 2
            ) {

              return;

            }


            if (
              !players[
                currentPlayerId
              ]
            ) {

              return;

            }


            const gameState =
              createGameState(
                playerIds
              );


            return {

              ...room,

              status:
                "playing",

              game:
                gameState

            };

          }
        );


      if (!result.committed) {

        const snapshot =
          await get(
            ref(db, "room")
          );


        if (
          snapshot.exists() &&
          snapshot.val().status ===
          "lobby"
        ) {

          const players =
            snapshot.val().players ||
            {};


          if (
            Object.keys(players).length <
            2
          ) {

            roomMessage.textContent =
              "Minimal 2 pemain untuk memulai.";

          }

        }

        return;

      }


    } catch (error) {

      console.error(error);

      roomMessage.textContent =
        "Gagal memulai game.";

    } finally {

      startBtn.disabled = false;

    }

  }
);


/* =========================
   WATCH GAME
========================= */

let gameWatcherStarted = false;

function watchGame() {

  if (gameWatcherStarted) {
    return;
  }


  gameWatcherStarted = true;


  onValue(
    ref(db, "room/game"),
    async snapshot => {

      if (
        !snapshot.exists()
      ) {

        return;

      }


      gameData =
        snapshot.val();


      await renderGameState();

    }
  );

}


/* =========================
   ENTER GAME
========================= */

async function enterGame() {

  lobby.classList.add(
    "hidden"
  );

  game.classList.remove(
    "hidden"
  );


  updateHeader();


  watchGame();


  await renderGameState();

}


/* =========================
   LOAD GAME PLAYERS
========================= */

async function loadGamePlayers() {

  gamePlayers = [];


  if (
    !gameData ||
    !gameData.players
  ) {

    return;

  }


  const playerData =
    gameData.players;


  const sortedPlayers =
    Object.entries(
      playerData
    ).sort(
      ([, a], [, b]) =>
        (a.turnOrder || 0) -
        (b.turnOrder || 0)
    );


  for (
    const [
      playerId,
      gamePlayer
    ]
    of sortedPlayers
  ) {

    const snapshot =
      await get(
        ref(
          db,
          "players/" +
          playerId
        )
      );


    if (
      !snapshot.exists()
    ) {

      continue;

    }


    const player =
      snapshot.val();


    gamePlayers.push({

      id:
        playerId,

      name:
        player.name ||
        "Unknown",

      profile:
        player.profile ||
        "",

      hp:
        Number(
          gamePlayer.hp ?? 3
        ),

      turnOrder:
        Number(
          gamePlayer.turnOrder ??
          0
        )

    });

  }

}


/* =========================
   RENDER GAME STATE
========================= */

async function renderGameState() {

  if (
    !gameData
  ) {

    return;

  }


  await loadGamePlayers();


  renderShellInfo();


  document.querySelector(
    ".game-online"
  ).textContent =
    gamePlayers.length;


  updateCurrentTurn();


  updateGameHealth();


  updateNextPlayer();


  updateShotVisibility();

}


/* =========================
   RENDER SHELL INFO
========================= */

function renderShellInfo() {

  const alive =
    Number(
      gameData.shells?.alive || 0
    );


  const blank =
    Number(
      gameData.shells?.blank || 0
    );


  aliveCount.textContent =
    "Alive : " + alive;


  blankCount.textContent =
    "Blank : " + blank;


  shellContainer.innerHTML = "";


  for (
    let i = 0;
    i < shellCount;
    i++
  ) {

    const icon =
      document.createElement("i");


    icon.setAttribute(
      "data-lucide",
      "test-tube"
    );


    if (
      i >= alive
    ) {

      icon.classList.add(
        "blank"
      );

    }


    shellContainer.appendChild(
      icon
    );

  }


  lucide.createIcons();

}


/* =========================
   CURRENT TURN
========================= */

function updateCurrentTurn() {

  if (
    !gameData.turn
  ) {

    return;

  }


  const currentId =
    gameData.turn.current;


  const currentPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentId
    );


  if (!currentPlayer) {

    document.querySelector(
      ".game-current-name"
    ).textContent =
      "-";

    return;

  }


  document.querySelector(
    ".game-current-name"
  ).textContent =
    currentPlayer.name;

}


/* =========================
   NEXT PLAYER
========================= */

function updateNextPlayer() {

  if (
    gamePlayers.length <= 1
  ) {

    document.querySelector(
      ".next-name"
    ).textContent =
      "-";

    return;

  }


  if (
    !gameData ||
    !gameData.turn
  ) {

    document.querySelector(
      ".next-name"
    ).textContent =
      "-";

    return;

  }


  const currentIndex =
    Number(
      gameData.turn.index || 0
    );


  const nextIndex =
    (
      currentIndex + 1
    ) %
    gamePlayers.length;


  const nextPlayer =
    gamePlayers[
      nextIndex
    ];


  document.querySelector(
    ".next-name"
  ).textContent =
    nextPlayer
      ? nextPlayer.name
      : "-";

}


/* =========================
   GAME HEALTH
========================= */

function updateGameHealth() {

  if (
    !gameData ||
    !gameData.turn
  ) {

    return;

  }


  const currentId =
    gameData.turn.current;


  const currentPlayer =
    gamePlayers.find(
      player =>
        player.id ===
        currentId
    );


  if (!currentPlayer) {
    return;
  }


  const healthContainer =
    document.querySelector(
      ".healt"
    );


  healthContainer.innerHTML = "";


  const hp =
    Math.max(
      0,
      Math.min(
        3,
        currentPlayer.hp
      )
    );


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const icon =
      document.createElement("i");


    icon.setAttribute(
      "data-lucide",
      i < hp
        ? "zap"
        : "zap-off"
    );


    if (
      i >= hp
    ) {

      icon.classList.add(
        "hp-off"
      );

    }


    healthContainer.appendChild(
      icon
    );

  }


  lucide.createIcons();

}


/* =========================
   SHOT VISIBILITY
========================= */

function updateShotVisibility() {

  if (
    !gameData ||
    !gameData.turn
  ) {

    shot.classList.add(
      "hidden"
    );

    return;

  }


  const myTurn =
    gameData.turn.current ===
    currentPlayerId;


  shot.classList.toggle(
    "hidden",
    !myTurn
  );


  if (!myTurn) {

    resetShot();

  }

}

   CLICK SHOTGUN
========================= */

shot.addEventListener(
  "click",
  () => {

    if (
      !gameData ||
      !gameData.turn
    ) {

      return;

    }


    if (
      gameData.turn.current !==
      currentPlayerId
    ) {

      return;

    }


    if (
      !gameData.shells
    ) {

      return;

    }


    if (
      Number(
        gameData.shells.current || 0
      ) >= shellCount
    ) {

      alert(

      return;

   CLOSE POPUP
========================= */

  );

   CLOSE BUTTON X
========================= */

========================= */

overlay.addEventListener(

/* =========================
   RENDER PLAYER POPUP
========================= */

function renderPlayerPopup() {

  playerContainer.innerHTML = "";


  gamePlayers.forEach(
    player => {

      if (
        player.id ===
        currentPlayerId
      ) {

        return;

      }


      if (
        player.hp <= 0
      ) {

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "st-list";


      const firstLetter =
        player.name
          .charAt(0)
          .toUpperCase();


      let profileHTML;


      if (player.profile) {

        profileHTML = `

          <span class="st-profile">

            <img
              src="${player.profile}"
              alt="Profile">

          </span>

        `;

      } else {

        profileHTML = `

          <span class="st-profile">
            ${firstLetter}
          </span>

        `;

      }


      item.innerHTML = `

        <div class="st-user">

          ${profileHTML}

          <span class="st-nama">
            ${player.name}
          </span>

          <span class="st-healt">
            (${player.hp})
          </span>

        </div>


        <button
          class="st-player-btn"
          data-id="${player.id}">

          Shot

        </button>

      `;


      playerContainer.appendChild(
        item
      );

    }
  );


  if (
    playerContainer
      .children.length === 0
  ) {

    playerContainer.innerHTML = `

      <div
        style="
          padding:10px 0;
          text-align:center;
          color:#777;
        ">

        Tidak ada pemain yang
        dapat ditembak.

      </div>

    `;

  }

}


/* =========================
   SELECT PLAYER
========================= */

playerContainer.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".st-player-btn"
      );


    if (!button) {
      return;
    }


    const targetId =
      button.dataset.id;


    const target =
      gamePlayers.find(
        player =>
          player.id === targetId
      );


    if (!target) {
      return;
    }


    selectedTarget =
      target;

    selectedTargetType =
      "player";


    closeShotPopup();


    shoot();

  }
);


/* =========================
   SHOOT
========================= */

async function shoot() {

  if (!selectedTarget) {
    return;
  }


  if (
    !gameData ||
    !gameData.turn
  ) {

    resetShot();

    return;

  }


  if (
    gameData.turn.current !==
    currentPlayerId
  ) {

    resetShot();

    return;

  }


  try {

    const roomGameRef =
      ref(
        db,
        "room/game"
      );


    const result =
      await runTransaction(
        roomGameRef,
        game => {

          if (!game) {
            return;
          }


          if (!game.turn) {
            return;
          }


          if (
            game.turn.current !==
            currentPlayerId
          ) {

            return;

          }


          const shellIndex =
            Number(
              game.shells?.current ||
              0
            );


          if (
            shellIndex >=
            shellCount
          ) {

            return;

          }


          const sequence =
            game.shells?.sequence ||
            [];


          const shell =
            sequence[
              shellIndex
            ];


          if (!shell) {
            return;
          }


          const targetId =
            selectedTarget.id;


          const targetPlayer =
            game.players?.[
              targetId
            ];


          if (!targetPlayer) {
            return;
          }


          let newHp =
            Number(
              targetPlayer.hp ?? 3
            );


          if (
            shell === "live"
          ) {

            newHp =
              Math.max(
                0,
                newHp - 1
              );

          }


          const updatedPlayers =
            {
              ...game.players,

              [targetId]: {

                ...targetPlayer,

                hp: newHp

              }

            };


          const playerIds =
            Object.keys(
              updatedPlayers
            );


          const sortedPlayers =
            playerIds.sort(
              (a, b) =>
                Number(
                  updatedPlayers[a]
                    .turnOrder || 0
                ) -
                Number(
                  updatedPlayers[b]
                    .turnOrder || 0
                )
            );


          const currentIndex =
            sortedPlayers.findIndex(
              id =>
                id ===
                currentPlayerId
            );


          let nextIndex =
            (
              currentIndex + 1
            ) %
            sortedPlayers.length;


          let attempts = 0;


          while (
            attempts <
            sortedPlayers.length
          ) {

            const nextId =
              sortedPlayers[
                nextIndex
              ];


            if (
              Number(
                updatedPlayers[
                  nextId
                ].hp || 0
              ) > 0
            ) {

              break;

            }


            nextIndex =
              (
                nextIndex + 1
              ) %
              sortedPlayers.length;

            attempts++;

          }


          const nextPlayerId =
            sortedPlayers[
              nextIndex
            ];


          return {

            ...game,

            players:
              updatedPlayers,

            turn: {

              current:
                nextPlayerId,

              index:
                nextIndex

            },

            shells: {

              ...game.shells,

              current:
                shellIndex + 1

            }

          };

        }
      );


    if (!result.committed) {

      alert(
        "Aksi tidak dapat dilakukan."
      );

      resetShot();

      return;

    }


    const shellIndex =
      Number(
        gameData.shells?.current ||
        0
      );


    const shell =
      gameData.shells?.sequence?.[
        shellIndex
      ];


    const targetName =
      selectedTarget.name;


    if (
      shell === "live"
    ) {

      alert(

        "💥 LIVE!\n\n" +
        "Target: " +
        targetName

      );

    } else {

      alert(

        "BLANK!\n\n" +
        "Target: " +
        targetName

      );

    }


  } catch (error) {

    console.error(error);

    alert(
      "Gagal melakukan shot."
    );

  }


  resetShot();

}


/* =========================
   ENABLE SHOT BUTTON
========================= */

function enableShotButtons() {

  playerBtn.disabled = false;

  selfBtn.disabled = false;

}


/* =========================
   DISABLE SHOT BUTTON
========================= */

function disableShotButtons() {

  playerBtn.disabled = true;

  selfBtn.disabled = true;

}


/* =========================
   RESET SHOT
========================= */

function resetShot() {

  shotMode = false;

  selectedTarget = null;

  selectedTargetType = null;


  shot.classList.remove(
    "active"
  );


  disableShotButtons();

}


/* =========================
   CLICK OUTSIDE SHOT
========================= */

document.addEventListener(
  "click",
  event => {

    if (!shotMode) {
      return;
    }


    const clickedShot =
      event.target.closest(
        ".shot"
      );


    const clickedPlayerBtn =
      event.target.closest(
        ".other"
      );


    const clickedSelfBtn =
      event.target.closest(
        ".self"
      );


    const clickedPopup =
      event.target.closest(
        ".shot-list"
      );


    if (clickedShot) {
      return;
    }


    if (clickedPlayerBtn) {
      return;
    }


    if (clickedSelfBtn) {
      return;
    }


    if (clickedPopup) {
      return;
    }


    resetShot();

  }
);

   INITIALIZE
========================= */

async function initialize() {

  try {

    const loaded =
      await loadSavedPlayer();


    if (loaded) {

      showLobby();

    } else {

      showLogin();

    }

  } catch (error) {

    console.error(error);

    showLogin();

  }

}


/* =========================
   LUCIDE
========================= */

lucide.createIcons();


/* =========================
   START
========================= */

initialize();
