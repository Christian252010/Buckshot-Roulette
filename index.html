const app =

/* =========================

/* =========================
   NORMALIZE NAME
========================= */

function normalizeName(name) {

  return name
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");

}


/* =========================
   NAME EXISTS
========================= */

async function nameExists(name) {

  const targetName =
    normalizeName(name);


  const snapshot =
    await get(ref(db, "players"));


  if (!snapshot.exists()) {
    return false;
  }


  const players =
    snapshot.val();


  return Object.values(players).some(
    player => {

      return normalizeName(
        player.name || ""
      ) === targetName;

    }
  );

}


/* =========================
   RESERVE NAME
========================= */

async function reserveName(name) {

  const normalized =
    normalizeName(name);


  const nameKey =
    encodeURIComponent(normalized);


  const nameRef =
    ref(db, "names/" + nameKey);


  const result =
    await runTransaction(
      nameRef,
      current => {

        if (current === null) {

          return {

            name: name,

            createdAt: Date.now()

          };

        }


        return;

      }
    );


  return result.committed;

}


/* =========================
   LOAD SAVED PLAYER
========================= */

async function loadSavedPlayer() {

  const savedId =
    localStorage.getItem(
      "buckshotPlayerId"
    );


  if (!savedId) {
    return false;
  }


  const snapshot =
    await get(
      ref(
        db,
        "players/" + savedId
      )
    );


  if (!snapshot.exists()) {

    localStorage.removeItem(
      "buckshotPlayerId"
    );

    return false;

  }


  currentPlayerId =
    savedId;

  currentPlayer =
    snapshot.val();


  return true;

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
  "click",
  async () => {

    loginMessage.textContent = "";


    const name =
      loginName.value.trim();

    const profile =
      loginProfile.value.trim();


    if (!name) {

      loginMessage.textContent =
        "Nama wajib diisi.";

      return;

    }


    if (name.length < 2) {

      loginMessage.textContent =
        "Nama minimal 2 karakter.";

      return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Memproses...";


    try {

      const exists =
        await nameExists(name);


      if (exists) {

        loginMessage.textContent =
          "Nama tersebut sudah digunakan.";

        return;

      }


      const reserved =
        await reserveName(name);


      if (!reserved) {

        loginMessage.textContent =
          "Nama tersebut sudah digunakan.";

        return;

      }


      const playerRef =
        push(ref(db, "players"));


      currentPlayerId =
        playerRef.key;


      currentPlayer = {

        name: name,

        profile: profile,

        createdAt: Date.now()

      };


      await set(
        playerRef,
        currentPlayer
      );


      localStorage.setItem(
        "buckshotPlayerId",
        currentPlayerId
      );


      showLobby();


    } catch (error) {

      console.error(error);

      loginMessage.textContent =
        "Gagal masuk. Periksa koneksi Firebase.";

    } finally {

      loginBtn.disabled = false;

      loginBtn.textContent =
        "Masuk";

    }

  }
);


/* =========================
   SHOW LOGIN
========================= */

function showLogin() {

  loginScreen.classList.remove(
    "hidden"
  );

  lobby.classList.add(
    "hidden"
  );

  game.classList.add(
    "hidden"
  );

}


/* =========================
   SHOW LOBBY
========================= */

function showLobby() {

  loginScreen.classList.add(
    "hidden"
  );

  lobby.classList.remove(
    "hidden"
  );

  game.classList.add(
    "hidden"
  );


  updateHeader();

  watchRoom();

}


/* =========================
   UPDATE HEADER
========================= */

function updateHeader() {

  if (!currentPlayer) {
    return;
  }


  const name =
    currentPlayer.name || "?";


  const profile =
    currentPlayer.profile || "";


  const firstLetter =
    name.charAt(0).toUpperCase();


  document
    .querySelectorAll(
      ".header-name, .game-name, .game-current-name"
    )
    .forEach(element => {

      element.textContent = name;

    });


  document
    .querySelectorAll(
      ".header-profile, .game-profile"
    )
    .forEach(element => {

      if (profile) {

        element.innerHTML = `

          <img
            src="${profile}"
            alt="Profile">

        `;

      } else {

        element.textContent =
          firstLetter;

      }

    });

}


/* =========================
   WATCH ROOM
========================= */

function watchRoom() {

  onValue(
    ref(db, "room"),
    async snapshot => {

      roomData =
        snapshot.exists()
          ? snapshot.val()
          : null;


      await renderRoom();

    }
  );

}


/* =========================
   RENDER ROOM
========================= */

async function renderRoom() {

  if (!roomData) {

    createBtn.classList.remove(
      "hidden"
    );

    joinBtn.classList.add(
      "hidden"
    );

    startLeft.classList.add(
      "hidden"
    );

    roomMessage.textContent =
      "Belum ada room.";

    joinList.innerHTML = "";

    document.querySelector(
      ".online"
    ).textContent = "0";


    return;

  }


  if (roomData.status === "playing") {

    const joined =
      roomData.players &&
      roomData.players[
        currentPlayerId
      ];


    if (joined) {

      await enterGame();

      return;

    }


    createBtn.classList.add(
      "hidden"
    );

    joinBtn.classList.add(
      "hidden"
    );

    startLeft.classList.add(
      "hidden"
    );

    roomMessage.textContent =
      "Game sedang berjalan. Tunggu game selesai.";

    return;

  }


  const roomPlayers =
    roomData.players || {};


  const joined =
    !!roomPlayers[
      currentPlayerId
    ];


  createBtn.classList.toggle(
    "hidden",
    !!roomData
  );


  joinBtn.classList.toggle(
    "hidden",
    joined
  );


  startLeft.classList.toggle(
    "hidden",
    !joined
  );


  roomMessage.textContent =
    joined
      ? "Kamu berada di room."
      : "Room tersedia. Tekan Join untuk masuk.";


  const playerIds =
    Object.keys(roomPlayers);


  document.querySelector(
    ".online"
  ).textContent =
    playerIds.length;


  await renderLobbyPlayers(
    playerIds
  );

}


/* =========================
   RENDER LOBBY PLAYERS
========================= */

async function renderLobbyPlayers(
  playerIds
) {

  joinList.innerHTML = "";


  if (playerIds.length === 0) {

    joinList.innerHTML = `

      <div class="empty-room">
        Belum ada pemain.
      </div>

    `;

    return;

  }


  for (const playerId of playerIds) {

    const snapshot =
      await get(
        ref(
          db,
          "players/" + playerId
        )
      );


    if (!snapshot.exists()) {
      continue;
    }


    const player =
      snapshot.val();


    const item =
      document.createElement("div");


    item.className =
      "pl-list";


    const profile =
      player.profile || "";


    const firstLetter =
      (player.name || "?")
        .charAt(0)
        .toUpperCase();


    const profileHTML =
      profile

        ? `

          <div class="profile">

            <img
              src="${profile}"
              alt="Profile">

          </div>

        `

        : `

          <div class="profile">
            ${firstLetter}
          </div>

        `;


    item.innerHTML = `

      ${profileHTML}

      <div class="nama">
        ${player.name || "Unknown"}
      </div>

    `;


    joinList.appendChild(item);

  }

}


/* =========================
   CREATE ROOM
========================= */

createBtn.addEventListener(
  "click",
  async () => {

    if (!currentPlayerId) {
      return;
    }


    createBtn.disabled = true;


    try {

      const snapshot =
        await get(
          ref(db, "room")
        );


      if (snapshot.exists()) {

        roomMessage.textContent =
          "Room sudah dibuat pemain lain.";

        return;

      }


      await set(
        ref(db, "room"),
        {

          exists: true,

          status: "lobby",

          createdAt: Date.now(),

          players: {

            [currentPlayerId]: true

          }

        }
      );


      roomMessage.textContent =
        "Room berhasil dibuat.";

    } catch (error) {

      console.error(error);

      roomMessage.textContent =
        "Gagal membuat room.";

    } finally {

      createBtn.disabled = false;

    }

  }
);


/* =========================
   JOIN ROOM
========================= */

joinBtn.addEventListener(
  "click",
  async () => {

    if (!currentPlayerId) {
      return;
    }


    joinBtn.disabled = true;


    try {

      const snapshot =
        await get(
          ref(db, "room")
        );


      if (!snapshot.exists()) {

        roomMessage.textContent =
          "Room tidak tersedia.";

        return;

      }


      const room =
        snapshot.val();


      if (room.status === "playing") {

        roomMessage.textContent =
          "Game sedang berjalan.";

        return;

      }


      await set(
        ref(
          db,
          "room/players/" +
          currentPlayerId
        ),
        true
      );


    } catch (error) {

      console.error(error);

      roomMessage.textContent =
        "Gagal join room.";

    } finally {

      joinBtn.disabled = false;

    }

  }
);


/* =========================
   LEAVE ROOM
========================= */

leftBtn.addEventListener(
  "click",
  async () => {

    if (!currentPlayerId) {
      return;
    }


    try {

      const snapshot =
        await get(
          ref(db, "room")
        );


      if (!snapshot.exists()) {
        return;
      }


      const room =
        snapshot.val();


      if (room.status === "playing") {

        roomMessage.textContent =
          "Game sedang berjalan.";

        return;

      }


      const players =
        room.players || {};


      delete players[
        currentPlayerId
      ];


      const remaining =
        Object.keys(players);


      if (remaining.length === 0) {

        await remove(
          ref(db, "room")
        );

      } else {

        await set(
          ref(db, "room/players"),
          players
        );

      }


    } catch (error) {

      console.error(error);

      roomMessage.textContent =
        "Gagal keluar dari room.";

    }

  }
);


/* =========================
   START GAME
========================= */

startBtn.addEventListener(
  "click",
  async () => {

    try {

      const snapshot =
        await get(
          ref(db, "room")
        );


      if (!snapshot.exists()) {
        return;
      }


      const room =
        snapshot.val();


      if (room.status === "playing") {
        return;
      }


      const players =
        room.players || {};


      const playerIds =
        Object.keys(players);


      if (
        playerIds.length < 2
      ) {

        roomMessage.textContent =
          "Minimal 2 pemain untuk memulai.";

        return;

      }


      if (
        !players[currentPlayerId]
      ) {

        roomMessage.textContent =
          "Kamu bukan pemain room.";

        return;

      }


      await set(
        ref(db, "room/status"),
        "playing"
      );


    } catch (error) {

      console.error(error);

      roomMessage.textContent =
        "Gagal memulai game.";

    }

  }
);


/* =========================
   ENTER GAME
========================= */

async function enterGame() {

  lobby.classList.add(
    "hidden"
  );

  game.classList.remove(
    "hidden"
  );


  await loadGamePlayers();


  generateShells();


  updateHeader();


  document.querySelector(
    ".game-online"
  ).textContent =
    gamePlayers.length;


  updateNextPlayer();


  resetShot();

}


/* =========================
   LOAD GAME PLAYERS
========================= */

async function loadGamePlayers() {

  gamePlayers = [];


  if (!roomData) {
    return;
  }


  const roomPlayers =
    roomData.players || {};


  const playerIds =
    Object.keys(roomPlayers);


  for (
    const playerId of playerIds
  ) {

    const snapshot =
      await get(
        ref(
          db,
          "players/" + playerId
        )
      );


    if (!snapshot.exists()) {
      continue;
    }


    const player =
      snapshot.val();


    gamePlayers.push({

      id: playerId,

      name:
        player.name ||
        "Unknown",

      profile:
        player.profile ||
        "",

      hp: 3

    });

  }

}


/* =========================
   UPDATE NEXT PLAYER
========================= */

function updateNextPlayer() {

  const nextName =
    document.querySelector(
      ".next-name"
    );


  if (
    gamePlayers.length <= 1
  ) {

    nextName.textContent =
      "-";

    return;

  }


  const currentIndex =
    gamePlayers.findIndex(
      player =>
        player.id ===
        currentPlayerId
    );


  if (currentIndex === -1) {

    nextName.textContent =
      "-";

    return;

  }


  const nextIndex =
    (
      currentIndex + 1
    ) %
    gamePlayers.length;


  nextName.textContent =
    gamePlayers[
      nextIndex
    ].name;

}


/* =========================
   GENERATE SHELLS
========================= */

function generateShells() {

  shells = [];

  currentShell = 0;


  const shellData = [

    "live",
    "live",
    "live",
    "live",

    "blank",
    "blank",
    "blank",
    "blank"

  ];


  shellData.sort(
    () => Math.random() - 0.5
  );


  shells = shellData;


  console.log(
    "Urutan shell:",
    shells
  );

}


/* =========================
   CLICK SHOTGUN
========================= */

shot.addEventListener(
  "click",
  () => {

    if (
      !popup.classList.contains(
        "hidden"
      )
    ) {

      return;

    }


    if (
      currentShell >=
      shells.length
    ) {

      alert(
        "Semua shell sudah habis."
      );

      return;

    }


    shotMode = true;

    shot.classList.add(
      "active"
    );

    enableShotButtons();

  }
);


/* =========================
   PLAYER BUTTON
========================= */

playerBtn.addEventListener(
  "click",
  () => {

    if (!shotMode) {
      return;
    }


    renderPlayerPopup();


    popup.classList.remove(
      "hidden"
    );

    overlay.classList.remove(
      "hidden"
    );

  }
);


/* =========================
   SELF BUTTON
========================= */

selfBtn.addEventListener(
  "click",
  () => {

    if (!shotMode) {
      return;
    }


    selectedTarget =
      gamePlayers.find(
        player =>
          player.id ===
          currentPlayerId
      );


    if (!selectedTarget) {
      return;
    }


    selectedTargetType =
      "self";


    shoot();

  }
);


/* =========================
   CLOSE POPUP
========================= */

function closeShotPopup() {

  popup.classList.add(
    "hidden"
  );

  overlay.classList.add(
    "hidden"
  );

}


/* =========================
   CLOSE BUTTON X
========================= */

popup.addEventListener(
  "click",
  event => {

    const cancel =
      event.target.closest(
        ".st-cancel"
      );


    if (!cancel) {
      return;
    }


    closeShotPopup();

    resetShot();

  }
);


/* =========================
   OVERLAY CLICK
========================= */

overlay.addEventListener(
  "click",
  () => {

    closeShotPopup();

    resetShot();

  }
);


/* =========================
   RENDER PLAYER POPUP
========================= */

function renderPlayerPopup() {

  playerContainer.innerHTML = "";


  gamePlayers.forEach(
    player => {

      if (
        player.id ===
        currentPlayerId
      ) {

        return;

      }


      if (
        player.hp <= 0
      ) {

        return;

      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "st-list";


      const firstLetter =
        player.name
          .charAt(0)
          .toUpperCase();


      let profileHTML;


      if (player.profile) {

        profileHTML = `

          <span class="st-profile">

            <img
              src="${player.profile}"
              alt="Profile">

          </span>

        `;

      } else {

        profileHTML = `

          <span class="st-profile">
            ${firstLetter}
          </span>

        `;

      }


      item.innerHTML = `

        <div class="st-user">

          ${profileHTML}

          <span class="st-nama">
            ${player.name}
          </span>

          <span class="st-healt">
            (${player.hp})
          </span>

        </div>


        <button
          class="st-player-btn"
          data-id="${player.id}">

          Shot

        </button>

      `;


      playerContainer.appendChild(
        item
      );

    }
  );


  if (
    playerContainer
      .children.length === 0
  ) {

    playerContainer.innerHTML = `

      <div
        style="
          padding:10px 0;
          text-align:center;
          color:#777;
        ">

        Tidak ada pemain yang
        dapat ditembak.

      </div>

    `;

  }

}


/* =========================
   SELECT PLAYER
========================= */

playerContainer.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".st-player-btn"
      );


    if (!button) {
      return;
    }


    const targetId =
      button.dataset.id;


    const target =
      gamePlayers.find(
        player =>
          player.id === targetId
      );


    if (!target) {
      return;
    }


    selectedTarget =
      target;

    selectedTargetType =
      "player";


    closeShotPopup();


    shoot();

  }
);


/* =========================
   SHOOT
========================= */

function shoot() {

  if (!selectedTarget) {
    return;
  }


  if (
    currentShell >=
    shells.length
  ) {

    alert(
      "Semua shell sudah habis."
    );

    resetShot();

    return;

  }


  const shell =
    shells[currentShell];


  const shellNumber =
    currentShell + 1;


  console.log(
    "Shell:",
    shellNumber
  );

  console.log(
    "Target:",
    selectedTarget.name
  );

  console.log(
    "Jenis:",
    shell.toUpperCase()
  );


  currentShell++;


  if (
    shell === "live"
  ) {

    alert(

      "💥 LIVE!\n\n" +

      "Target: " +
      selectedTarget.name

    );

  } else {

    alert(

      "BLANK!\n\n" +

      "Target: " +
      selectedTarget.name

    );

  }


  if (
    currentShell >=
    shells.length
  ) {

    console.log(
      "Semua shell sudah digunakan."
    );

  }


  resetShot();

}


/* =========================
   ENABLE SHOT BUTTON
========================= */

function enableShotButtons() {

  playerBtn.disabled = false;

  selfBtn.disabled = false;

}


/* =========================
   DISABLE SHOT BUTTON
========================= */

function disableShotButtons() {

  playerBtn.disabled = true;

  selfBtn.disabled = true;

}


/* =========================
   RESET SHOT
========================= */

function resetShot() {

  shotMode = false;

  selectedTarget = null;

  selectedTargetType = null;


  shot.classList.remove(
    "active"
  );


  disableShotButtons();

}


/* =========================
   CLICK OUTSIDE SHOT
========================= */

document.addEventListener(
  "click",
  event => {

    if (!shotMode) {
      return;
    }


    const clickedShot =
      event.target.closest(
        ".shot"
      );


    const clickedPlayerBtn =
      event.target.closest(
        ".other"
      );


    const clickedSelfBtn =
      event.target.closest(
        ".self"
      );


    const clickedPopup =
      event.target.closest(
        ".shot-list"
      );


    if (clickedShot) {
      return;
    }


    if (clickedPlayerBtn) {
      return;
    }


    if (clickedSelfBtn) {
      return;
    }


    if (clickedPopup) {
      return;
    }


    resetShot();

  }
);


/* =========================
   INITIALIZE
========================= */

async function initialize() {

  try {

    const loaded =
      await loadSavedPlayer();


    if (loaded) {

      showLobby();

    } else {

      showLogin();

    }

  } catch (error) {

    console.error(error);

    showLogin();

  }

}


/* =========================
   LUCIDE
========================= */

lucide.createIcons();


/* =========================
   START
========================= */

initialize();

</script>
