<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buckshot Roulette</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: rgba(0,0,0,0.2);
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #1f1f1f;
  color: #fff;
}

button {
  font-family: Arial, sans-serif;
}

.screen {
  width: 100%;
  height: 100dvh;
}

/* =========================
   LOGIN
========================= */

.login {
  display: flex;
  width: 100%;
  height: 100dvh;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #1f1f1f;
}

.login-box {
  width: 100%;
  max-width: 420px;
  padding: 24px;
  background: #2a2a2a;
  border: 1px solid #444;
}

.login-title {
  margin-bottom: 20px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

.login-box input {
  width: 100%;
  height: 46px;
  margin-bottom: 12px;
  padding: 0 14px;
  border: 1px solid #555;
  outline: none;
  background: #1f1f1f;
  color: #fff;
  font-size: 16px;
}

.login-box input:focus {
  border-color: crimson;
}

.login-box button {
  width: 100%;
  height: 46px;
  border: 0;
  background: crimson;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

/* =========================
   LOBBY
========================= */

.lobby {
  display: none;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #1f1f1f;
}

.header {
  display: flex;
  height: 58px;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: #2a2a2a;
  border-bottom: 1px solid #444;
}

.header-title {
  font-size: 20px;
  font-weight: bold;
}

.header-player {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #aaa;
  font-size: 14px;
}

.profile-mini {
  display: flex;
  width: 30px;
  height: 30px;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 50%;
  background: #444;
}

.profile-mini img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.lobby-content {
  width: 100%;
  height: calc(100dvh - 58px);
  overflow-y: auto;
  padding: 20px;
}

.room-card {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  padding: 20px;
  background: #2a2a2a;
  border: 1px solid #444;
}

.room-title {
  margin-bottom: 18px;
  font-size: 20px;
  font-weight: bold;
}

.room-status {
  margin-bottom: 18px;
  color: #888;
}

.room-status span {
  color: #fff;
  font-weight: bold;
}

.room-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.room-buttons button {
  width: 100%;
  height: 44px;
  border: 0;
  background: #444;
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.room-buttons button:hover {
  background: #555;
}

.room-buttons .primary {
  background: crimson;
}

.room-buttons .primary:hover {
  background: #dc143c;
}

.room-buttons .danger {
  background: #5b2020;
}

.players-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 20px 0;
}

.player-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  background: #1f1f1f;
  border: 1px solid #3b3b3b;
}

.player-item-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.player-avatar {
  display: flex;
  width: 36px;
  height: 36px;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 50%;
  background: #444;
}

.player-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.player-name {
  font-weight: bold;
}

.you-label {
  color: #888;
  font-size: 12px;
}

/* =========================
   GAME
========================= */

.game {
  display: none;
  position: relative;
  width: 100%;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
  background: #1f1f1f;
}

.game-panel {
  position: relative;
  width: 100%;
  height: calc(100dvh - 58px);
  overflow: hidden;
}

.game-info {
  display: flex;
  width: 100%;
  justify-content: space-between;
  padding: 14px 16px;
  color: #888;
  font-size: 14px;
}

.game-info strong {
  color: #fff;
}

.current-turn {
  color: crimson !important;
}

.game-players {
  display: flex;
  width: 100%;
  justify-content: space-around;
  padding: 10px 16px;
}

.game-player {
  min-width: 100px;
  padding: 12px;
  text-align: center;
  background: #2a2a2a;
  border: 1px solid #444;
}

.game-player-name {
  margin-bottom: 8px;
  font-weight: bold;
}

.game-player-hp {
  color: crimson;
  font-size: 18px;
  font-weight: bold;
}

.next-player {
  margin-top: 10px;
  text-align: center;
  color: #777;
  font-size: 13px;
}

/* =========================
   RANDOM SHELL
========================= */

.random-shell {
  display: flex;
  position: absolute;
  flex-direction: column;
  gap: 12px;
  width: calc(100% - 24px);
  justify-content: center;
  top: 50%;
  left: 12px;
  transform: translateY(-50%);
  padding: 12px;
  background: #2a2a2a;
  z-index: 10;
}

.shell {
  display: flex;
  justify-content: space-between;
}

.shell-info {
  display: flex;
  justify-content: space-around;
  border-top: 1.5px solid #666;
  padding-top: 10px;
  font-weight: bold;
  color: #888;
}

.shell-info span:nth-child(1) {
  color: crimson;
}

.random-shell svg {
  width: 36px !important;
  height: 36px !important;
  color: crimson;
  rotate: 180deg;
}

.blank {
  color: #888 !important;
}

/* =========================
   SHOT
========================= */

.shot {
  display: none;
  position: absolute;
  left: 50%;
  bottom: 105px;
  transform: translateX(-50%);
  width: 150px;
  height: 52px;
  border: 0;
  background: crimson;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  z-index: 5;
}

.shot:active {
  transform: translateX(-50%) scale(.96);
}

.shot.disabled {
  opacity: .4;
  pointer-events: none;
}

/* =========================
   BOTTOM BUTTONS
========================= */

.game-bottom {
  display: flex;
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 72px;
  gap: 8px;
  padding: 10px;
  background: #2a2a2a;
  border-top: 1px solid #444;
  z-index: 6;
}

.game-bottom button {
  flex: 1;
  border: 0;
  background: #444;
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.game-bottom button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.game-bottom button:active:not(:disabled) {
  background: #555;
}

/* =========================
   OVERLAY
========================= */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 19;
}

.overlay.show {
  display: block;
}

/* =========================
   SHOT LIST
========================= */

.shot-list {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  width: calc(100% - 32px);
  max-width: 420px;
  max-height: 70dvh;
  overflow-y: auto;
  transform: translate(-50%, -50%);
  padding: 16px;
  background: #2a2a2a;
  border: 1px solid #555;
  z-index: 20;
}

.shot-list.show {
  display: block;
}

.shot-list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.shot-list-title {
  font-size: 18px;
  font-weight: bold;
}

.close-shot-list {
  display: flex;
  width: 36px;
  height: 36px;
  align-items: center;
  justify-content: center;
  border: 0;
  background: #444;
  color: #fff;
  cursor: pointer;
}

.target-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.target-button {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  border: 1px solid #444;
  background: #1f1f1f;
  color: #fff;
  cursor: pointer;
}

.target-button:active {
  background: #333;
}

.target-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.target-hp {
  color: crimson;
  font-weight: bold;
}

/* =========================
   MESSAGE
========================= */

.message {
  display: none;
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 500px;
  padding: 12px 16px;
  background: #333;
  border: 1px solid #555;
  color: #fff;
  text-align: center;
  z-index: 50;
}

.message.show {
  display: block;
}
</style>
</head>

<body>

     FIREBASE

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  get,
  onValue,
  remove,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ========================================
   FIREBASE CONFIG
======================================== */

const firebaseConfig = {
  apiKey: "AIzaSyBQyI-9ESAqE5AFy49hIyP0rhul9gIlkc",
  authDomain: "buckshotroulette-4c7a1.firebaseapp.com",
  databaseURL: "https://buckshotroulette-4c7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "buckshotroulette-4c7a1",
  storageBucket: "buckshotroulette-4c7a1.firebasestorage.app",
  messagingSenderId: "335951554199",
  appId: "1:335951554199:web:8d7475fc9dda0f76b32bd2",
  measurementId: "G-H5RLT7K97W"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* ========================================
   GLOBAL STATE
======================================== */

let currentPlayerId = null;
let currentPlayer = null;

let roomData = null;
let gameData = null;

let shotMode = false;
let prepareTimer = null;

let roomWatcher = null;
let gameWatcher = null;

let gameScreenActive = false;


/* ========================================
   DOM
======================================== */

const loginScreen =
  document.getElementById("loginScreen");

const lobbyScreen =
  document.getElementById("lobbyScreen");

const gameScreen =
  document.getElementById("gameScreen");

const nameInput =
  document.getElementById("nameInput");

const profileInput =
  document.getElementById("profileInput");

const loginButton =
  document.getElementById("loginButton");

const createRoomButton =
  document.getElementById("createRoomButton");

const joinRoomButton =
  document.getElementById("joinRoomButton");

const startGameButton =
  document.getElementById("startGameButton");

const leaveRoomButton =
  document.getElementById("leaveRoomButton");

const roomStatus =
  document.getElementById("roomStatus");

const playersList =
  document.getElementById("playersList");

const lobbyPlayerName =
  document.getElementById("lobbyPlayerName");

const lobbyPlayerProfile =
  document.getElementById("lobbyPlayerProfile");

const gamePlayerName =
  document.getElementById("gamePlayerName");

const gamePlayerProfile =
  document.getElementById("gamePlayerProfile");

const gamePlayers =
  document.getElementById("gamePlayers");

const currentShell =
  document.getElementById("currentShell");

const currentTurn =
  document.getElementById("currentTurn");

const nextPlayer =
  document.getElementById("nextPlayer");

const randomShell =
  document.getElementById("randomShell");

const shellDisplay =
  document.getElementById("shellDisplay");

const aliveCount =
  document.querySelector(".alive-count");

const blankCount =
  document.querySelector(".blank-count");

const shotButton =
  document.getElementById("shotButton");

const playerButton =
  document.getElementById("playerButton");

const youButton =
  document.getElementById("youButton");

const overlay =
  document.getElementById("overlay");

const shotList =
  document.getElementById("shotList");

const targetList =
  document.getElementById("targetList");

const closeShotList =
  document.getElementById("closeShotList");

const messageBox =
  document.getElementById("message");


/* ========================================
   UTILITY
======================================== */

function showScreen(screen) {
  loginScreen.style.display = "none";
  lobbyScreen.style.display = "none";
  gameScreen.style.display = "none";

  screen.style.display = "block";
}

function showMessage(text, duration = 2500) {
  messageBox.textContent = text;
  messageBox.classList.add("show");

  setTimeout(() => {
    messageBox.classList.remove("show");
  }, duration);
}

function normalizeName(name) {
  return name
    .trim()
    .toLowerCase()
    .replace(/\s+/g, " ");
}

function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }

  return result;
}

function getPlayerName(playerId) {
  if (!gameData?.players?.[playerId]) {
    return "Unknown";
  }

  return gameData.players[playerId].name || "Unknown";
}


/* ========================================
   PLAYER ID
======================================== */

async function loadCurrentPlayer() {

  const savedId =
    localStorage.getItem("buckshotPlayerId");

  if (!savedId) {
    return;
  }

  const playerRef =
    ref(db, `players/${savedId}`);

  const snapshot =
    await get(playerRef);

  if (!snapshot.exists()) {
    localStorage.removeItem("buckshotPlayerId");
    return;
  }

  currentPlayerId = savedId;
  currentPlayer = snapshot.val();

  lobbyPlayerName.textContent =
    currentPlayer.name;

  gamePlayerName.textContent =
    currentPlayer.name;

  if (currentPlayer.profile) {
    lobbyPlayerProfile.src =
      currentPlayer.profile;

    gamePlayerProfile.src =
      currentPlayer.profile;
  }

  await watchRoom();

  showScreen(lobbyScreen);
}


/* ========================================
   NAME RESERVATION
======================================== */

async function reserveName(name) {

  const normalized =
    normalizeName(name);

  const nameRef =
    ref(db, `names/${normalized}`);

  const result =
    await runTransaction(
      nameRef,
      current => {

        if (current !== null) {
          return;
        }

        return {
          name: name.trim(),
          createdAt: Date.now()
        };
      }
    );

  return result.committed;
}


/* ========================================
   LOGIN
======================================== */

loginButton.addEventListener(
  "click",
  async () => {

    const name =
      nameInput.value.trim();

    const profile =
      profileInput.value.trim();

    if (!name) {
      alert("Nama harus diisi.");
      return;
    }

    loginButton.disabled = true;

    try {

      const available =
        await reserveName(name);

      if (!available) {
        alert("Nama sudah digunakan.");
        loginButton.disabled = false;
        return;
      }

      const playerRef =
        push(ref(db, "players"));

      currentPlayerId =
        playerRef.key;

      currentPlayer = {
        name,
        profile: profile || "",
        createdAt: Date.now()
      };

      await set(
        playerRef,
        currentPlayer
      );

      localStorage.setItem(
        "buckshotPlayerId",
        currentPlayerId
      );

      lobbyPlayerName.textContent =
        name;

      gamePlayerName.textContent =
        name;

      if (profile) {
        lobbyPlayerProfile.src =
          profile;

        gamePlayerProfile.src =
          profile;
      }

      showScreen(lobbyScreen);

      await watchRoom();

    } catch (error) {

      console.error(error);

      alert(
        "Terjadi kesalahan saat masuk."
      );

    } finally {

      loginButton.disabled = false;
    }
  }
);


/* ========================================
   ROOM WATCHER
======================================== */

async function watchRoom() {

  if (roomWatcher) {
    roomWatcher();
  }

  const roomRef =
    ref(db, "room");

  roomWatcher =
    onValue(
      roomRef,
      snapshot => {

        roomData =
          snapshot.exists()
            ? snapshot.val()
            : null;

        renderRoom();

        if (
          roomData?.status === "playing" &&
          roomData?.players?.[currentPlayerId]
        ) {

          enterGame();

        } else if (
          roomData?.status !== "playing"
        ) {

          if (gameScreenActive) {
            gameScreenActive = false;
            gameData = null;

            if (gameWatcher) {
              gameWatcher();
              gameWatcher = null;
            }
          }

          showScreen(lobbyScreen);
        }
      }
    );
}


/* ========================================
   ROOM RENDER
======================================== */

function renderRoom() {

  if (!roomData) {

    roomStatus.textContent =
      "Belum ada room";

    playersList.innerHTML = "";

    startGameButton.disabled = true;
    leaveRoomButton.disabled = true;

    return;
  }

  roomStatus.textContent =
    roomData.status === "playing"
      ? "Sedang bermain"
      : "Lobby";

  const roomPlayers =
    roomData.players || {};

  const playerIds =
    Object.keys(roomPlayers);

  playersList.innerHTML = "";

  playerIds.forEach(
    playerId => {

      const player =
        roomPlayers[playerId];

      const item =
        document.createElement("div");

      item.className =
        "player-item";

      const left =
        document.createElement("div");

      left.className =
        "player-item-left";

      const avatar =
        document.createElement("div");

      avatar.className =
        "player-avatar";

      const playerData =
        playerId === currentPlayerId
          ? currentPlayer
          : null;

      if (playerData?.profile) {

        const img =
          document.createElement("img");

        img.src =
          playerData.profile;

        avatar.appendChild(img);
      }

      const name =
        document.createElement("div");

      name.innerHTML = `
        <div class="player-name">
          ${escapeHtml(player.name || "Player")}
        </div>
        ${
          playerId === currentPlayerId
            ? `<div class="you-label">YOU</div>`
            : ""
        }
      `;

      left.appendChild(avatar);
      left.appendChild(name);

      item.appendChild(left);

      playersList.appendChild(item);
    }
  );

  const joined =
    !!roomPlayers[currentPlayerId];

  startGameButton.disabled =
    !joined ||
    playerIds.length < 2 ||
    roomData.status === "playing";

  leaveRoomButton.disabled =
    !joined ||
    roomData.status === "playing";
}


/* ========================================
   CREATE ROOM
======================================== */

createRoomButton.addEventListener(
  "click",
  async () => {

    if (!currentPlayerId) {
      return;
    }

    try {

      const roomRef =
        ref(db, "room");

      const snapshot =
        await get(roomRef);

      if (
        snapshot.exists() &&
        snapshot.val()?.status === "playing"
      ) {
        alert(
          "Game sedang berlangsung."
        );
        return;
      }

      await set(
        roomRef,
        {
          exists: true,
          status: "lobby",
          createdAt: Date.now(),
          players: {
            [currentPlayerId]: true
          }
        }
      );

      showMessage("Room berhasil dibuat.");

    } catch (error) {

      console.error(error);

      alert(
        "Gagal membuat room."
      );
    }
  }
);


/* ========================================
   JOIN ROOM
======================================== */

joinRoomButton.addEventListener(
  "click",
  async () => {

    if (!currentPlayerId) {
      return;
    }

    try {

      const roomRef =
        ref(db, "room");

      const snapshot =
        await get(roomRef);

      if (!snapshot.exists()) {
        alert("Belum ada room.");
        return;
      }

      const room =
        snapshot.val();

      if (room.status === "playing") {
        alert(
          "Game sedang berlangsung. Tidak bisa bergabung."
        );
        return;
      }

      const playerIds =
        Object.keys(room.players || {});

      if (
        room.players?.[currentPlayerId]
      ) {
        showMessage(
          "Kamu sudah berada di room."
        );
        return;
      }

      if (playerIds.length >= 2) {
        alert(
          "Room sementara dibatasi maksimal 2 pemain."
        );
        return;
      }

      const playerRef =
        ref(
          db,
          `room/players/${currentPlayerId}`
        );

      await set(
        playerRef,
        true
      );

      showMessage(
        "Berhasil bergabung ke room."
      );

    } catch (error) {

      console.error(error);

      alert(
        "Gagal bergabung ke room."
      );
    }
  }
);


/* ========================================
   LEAVE ROOM
======================================== */

leaveRoomButton.addEventListener(
  "click",
  async () => {

    if (!roomData) {
      return;
    }

    try {

      await remove(
        ref(
          db,
          `room/players/${currentPlayerId}`
        )
      );

      const snapshot =
        await get(
          ref(db, "room/players")
        );

      if (!snapshot.exists()) {

        await remove(
          ref(db, "room")
        );
      }

    } catch (error) {

      console.error(error);

      alert(
        "Gagal keluar dari room."
      );
    }
  }
);


/* ========================================
   CREATE GAME STATE
======================================== */

function createGameState(playerIds) {

  const shuffledPlayers =
    shuffle(playerIds);

  const liveCount =
    Math.floor(
      Math.random() * 7
    ) + 1;

  const blankCount =
    8 - liveCount;

  const shells = [
    ...Array(liveCount).fill("live"),
    ...Array(blankCount).fill("blank")
  ];

  const sequence =
    shuffle(shells);

  const players = {};

  shuffledPlayers.forEach(
    (playerId, index) => {

      players[playerId] = {
        name:
          roomData.playersData?.[playerId]?.name ||
          playerId,

        profile:
          roomData.playersData?.[playerId]?.profile ||
          "",

        hp: 3,

        turnOrder: index
      };
    }
  );

  return {
    phase: "preparing",

    prepareEndsAt:
      Date.now() + 3000,

    players,

    turn: {
      current: shuffledPlayers[0],
      index: 0
    },

    shells: {
      total: 8,
      alive: liveCount,
      blank: blankCount,
      current: 0,
      sequence
    },

    startedAt: Date.now()
  };
}


/* ========================================
   START GAME
======================================== */

startGameButton.addEventListener(
  "click",
  async () => {

    if (!roomData) {
      return;
    }

    const playerIds =
      Object.keys(
        roomData.players || {}
      );

    if (playerIds.length < 2) {
      alert(
        "Minimal 2 pemain untuk memulai."
      );
      return;
    }

    if (roomData.status === "playing") {
      return;
    }

    try {

      const playersData = {};

      for (const playerId of playerIds) {

        const snapshot =
          await get(
            ref(db, `players/${playerId}`)
          );

        if (snapshot.exists()) {

          playersData[playerId] =
            snapshot.val();
        }
      }

      roomData.playersData =
        playersData;

      const game =
        createGameState(playerIds);

      await set(
        ref(db, "room/status"),
        "playing"
      );

      await set(
        ref(db, "room/game"),
        game
      );

    } catch (error) {

      console.error(error);

      alert(
        "Gagal memulai game."
      );
    }
  }
);


/* ========================================
   ENTER GAME
======================================== */

function enterGame() {

  if (gameScreenActive) {
    showScreen(gameScreen);
    return;
  }

  gameScreenActive = true;

  showScreen(gameScreen);

  gamePlayerName.textContent =
    currentPlayer?.name || "-";

  if (currentPlayer?.profile) {

    gamePlayerProfile.src =
      currentPlayer.profile;
  }

  watchGame();
}


/* ========================================
   GAME WATCHER
======================================== */

function watchGame() {

  if (gameWatcher) {
    gameWatcher();
  }

  gameWatcher =
    onValue(
      ref(db, "room/game"),
      snapshot => {

        if (!snapshot.exists()) {
          return;
        }

        gameData =
          snapshot.val();

        renderGameState();
      }
    );
}


/* ========================================
   RENDER GAME
======================================== */

function renderGameState() {

  if (!gameData) {
    return;
  }

  renderShell();

  renderGamePlayers();

  updateTurnInfo();

  if (gameData.phase === "preparing") {

    startPreparation();

  } else if (
    gameData.phase === "playing"
  ) {

    clearPreparationTimer();

    randomShell.style.display =
      "none";

    updateShotVisibility();
  }
}


/* ========================================
   PREPARATION
======================================== */

function startPreparation() {

  randomShell.style.display =
    "flex";

  shotButton.style.display =
    "none";

  playerButton.disabled =
    true;

  youButton.disabled =
    true;

  clearPreparationTimer();

  const endsAt =
    Number(gameData.prepareEndsAt || 0);

  const remaining =
    Math.max(
      0,
      endsAt - Date.now()
    );

  prepareTimer =
    setTimeout(
      async () => {

        try {

          await runTransaction(
            ref(db, "room/game"),
            game => {

              if (!game) {
                return;
              }

              if (
                game.phase !== "preparing"
              ) {
                return game;
              }

              game.phase =
                "playing";

              delete game.prepareEndsAt;

              return game;
            }
          );

        } catch (error) {

          console.error(
            "Gagal mengakhiri preparation:",
            error
          );
        }

      },
      remaining
    );
}

function clearPreparationTimer() {

  if (prepareTimer) {

    clearTimeout(
      prepareTimer
    );

    prepareTimer = null;
  }
}


/* ========================================
   RENDER SHELL
======================================== */

function renderShell() {

  const shells =
    gameData.shells || {};

  const total =
    Number(shells.total || 8);

  const alive =
    Number(shells.alive || 0);

  const blank =
    Number(shells.blank || 0);

  const current =
    Number(shells.current || 0);

  currentShell.textContent =
    `${current} / ${total}`;

  aliveCount.textContent =
    `Alive : ${alive}`;

  blankCount.textContent =
    `Blank : ${blank}`;

  shellDisplay.innerHTML = "";

  for (let i = 0; i < alive; i++) {

    const icon =
      document.createElement("i");

    icon.setAttribute(
      "data-lucide",
      "shell"
    );

    shellDisplay.appendChild(icon);
  }

  for (let i = 0; i < blank; i++) {

    const icon =
      document.createElement("i");

    icon.setAttribute(
      "data-lucide",
      "shell"
    );

    icon.classList.add(
      "blank"
    );

    shellDisplay.appendChild(icon);
  }

  lucide.createIcons();
}


/* ========================================
   RENDER GAME PLAYERS
======================================== */

function renderGamePlayers() {

  const players =
    gameData.players || {};

  const playerIds =
    Object.keys(players)
      .sort(
        (a, b) =>
          (players[a].turnOrder ?? 0) -
          (players[b].turnOrder ?? 0)
      );

  gamePlayers.innerHTML = "";

  playerIds.forEach(
    playerId => {

      const player =
        players[playerId];

      const hp =
        Math.max(
          0,
          Number(player.hp ?? 0)
        );

      const card =
        document.createElement("div");

      card.className =
        "game-player";

      const label =
        playerId === currentPlayerId
          ? " YOU"
          : "";

      card.innerHTML = `
        <div class="game-player-name">
          ${escapeHtml(player.name || "Player")}
          ${label}
        </div>

        <div class="game-player-hp">
          HP : ${hp}
        </div>
      `;

      gamePlayers.appendChild(card);
    }
  );
}


/* ========================================
   TURN INFO
======================================== */

function updateTurnInfo() {

  const players =
    gameData.players || {};

  const currentId =
    gameData.turn?.current;

  if (!currentId) {
    currentTurn.textContent = "-";
    nextPlayer.textContent = "-";
    return;
  }

  const currentPlayerData =
    players[currentId];

  currentTurn.textContent =
    currentId === currentPlayerId
      ? "YOU"
      : currentPlayerData?.name || "Player";

  const playerIds =
    Object.keys(players)
      .sort(
        (a, b) =>
          (players[a].turnOrder ?? 0) -
          (players[b].turnOrder ?? 0)
      );

  const currentIndex =
    playerIds.indexOf(currentId);

  if (currentIndex === -1) {
    nextPlayer.textContent = "-";
    return;
  }

  const nextIndex =
    (currentIndex + 1) %
    playerIds.length;

  const nextId =
    playerIds[nextIndex];

  const nextData =
    players[nextId];

  nextPlayer.textContent =
    nextId === currentPlayerId
      ? "YOU"
      : nextData?.name || "Player";
}


/* ========================================
   SHOT VISIBILITY
======================================== */

function updateShotVisibility() {

  const isPlaying =
    gameData.phase === "playing";

  const isMyTurn =
    gameData.turn?.current ===
    currentPlayerId;

  const shellIndex =
    Number(
      gameData.shells?.current ?? 0
    );

  const total =
    Number(
      gameData.shells?.total ?? 8
    );

  const canShoot =
    isPlaying &&
    isMyTurn &&
    shellIndex < total;

  shotButton.style.display =
    canShoot
      ? "block"
      : "none";

  shotButton.disabled =
    !canShoot;

  if (!canShoot) {

    shotMode = false;

    playerButton.disabled = true;
    youButton.disabled = true;

    closeTargetPopup();
  }
}


/* ========================================
   SHOT BUTTON
======================================== */

shotButton.addEventListener(
  "click",
  () => {

    if (!gameData) {
      return;
    }

    if (
      gameData.phase !== "playing"
    ) {
      return;
    }

    if (
      gameData.turn?.current !==
      currentPlayerId
    ) {
      return;
    }

    const shellIndex =
      Number(
        gameData.shells?.current ?? 0
      );

    const total =
      Number(
        gameData.shells?.total ?? 8
      );

    if (shellIndex >= total) {
      return;
    }

    shotMode = true;

    playerButton.disabled =
      false;

    youButton.disabled =
      false;
  }
);


/* ========================================
   PLAYER BUTTON
======================================== */

playerButton.addEventListener(
  "click",
  () => {

    if (!shotMode) {
      return;
    }

    if (
      gameData?.turn?.current !==
      currentPlayerId
    ) {
      return;
    }

    openTargetPopup();
  }
);


/* ========================================
   YOU BUTTON
======================================== */

youButton.addEventListener(
  "click",
  async () => {

    if (!shotMode) {
      return;
    }

    if (
      gameData?.turn?.current !==
      currentPlayerId
    ) {
      return;
    }

    await shoot(
      currentPlayerId
    );
  }
);


/* ========================================
   TARGET POPUP
======================================== */

function openTargetPopup() {

  targetList.innerHTML = "";

  const players =
    gameData?.players || {};

  const playerIds =
    Object.keys(players)
      .sort(
        (a, b) =>
          (players[a].turnOrder ?? 0) -
          (players[b].turnOrder ?? 0)
      );

  const targets =
    playerIds.filter(
      playerId =>
        playerId !== currentPlayerId &&
        Number(
          players[playerId]?.hp ?? 0
        ) > 0
    );

  if (!targets.length) {

    targetList.innerHTML = `
      <div style="
        padding:16px;
        text-align:center;
        color:#888;
      ">
        Tidak ada target.
      </div>
    `;

  } else {

    targets.forEach(
      playerId => {

        const player =
          players[playerId];

        const button =
          document.createElement("button");

        button.className =
          "target-button";

        button.innerHTML = `
          <div class="target-info">
            <span>
              ${escapeHtml(player.name || "Player")}
            </span>
          </div>

          <div class="target-hp">
            HP ${Math.max(
              0,
              Number(player.hp ?? 0)
            )}
          </div>
        `;

        button.addEventListener(
          "click",
          async () => {

            await shoot(
              playerId
            );
          }
        );

        targetList.appendChild(
          button
        );
      }
    );
  }

  overlay.classList.add("show");
  shotList.classList.add("show");
}


/* ========================================
   CLOSE POPUP
======================================== */

function closeTargetPopup() {

  overlay.classList.remove(
    "show"
  );

  shotList.classList.remove(
    "show"
  );
}

closeShotList.addEventListener(
  "click",
  () => {

    closeTargetPopup();
  }
);

overlay.addEventListener(
  "click",
  () => {

    closeTargetPopup();
  }
);


/* ========================================
   SHOOT
======================================== */

async function shoot(targetId) {

  if (!gameData) {
    return;
  }

  if (
    gameData.phase !== "playing"
  ) {
    return;
  }

  if (
    gameData.turn?.current !==
    currentPlayerId
  ) {
    alert(
      "Bukan giliran kamu."
    );
    return;
  }

  const shellIndex =
    Number(
      gameData.shells?.current ?? 0
    );

  const total =
    Number(
      gameData.shells?.total ?? 8
    );

  if (shellIndex >= total) {
    alert(
      "Semua shell sudah digunakan."
    );
    return;
  }

  shotMode = false;

  playerButton.disabled = true;
  youButton.disabled = true;

  closeTargetPopup();

  let shotResult = null;
  let shotTargetName = "";
  let shotTargetHp = null;
  let shotTargetWasSelf = false;
  let nextTurnPlayer = null;

  const gameRef =
    ref(db, "room/game");

  const transactionResult =
    await runTransaction(
      gameRef,
      game => {

        if (!game) {
          return;
        }

        if (
          game.phase !== "playing"
        ) {
          return;
        }

        if (
          game.turn?.current !==
          currentPlayerId
        ) {
          return;
        }

        const shells =
          game.shells;

        if (!shells) {
          return;
        }

        const currentShell =
          Number(
            shells.current ?? 0
          );

        const sequence =
          shells.sequence;

        if (
          currentShell >= 8 ||
          !sequence
        ) {
          return;
        }

        const shell =
          sequence[currentShell];

        if (
          shell !== "live" &&
          shell !== "blank"
        ) {
          return;
        }

        const players =
          game.players || {};

        if (!players[targetId]) {
          return;
        }

        const target =
          players[targetId];

        if (
          Number(target.hp ?? 0) <= 0
        ) {
          return;
        }

        const playerIds =
          Object.keys(players)
            .sort(
              (a, b) =>
                (players[a].turnOrder ?? 0) -
                (players[b].turnOrder ?? 0)
            );

        if (!playerIds.length) {
          return;
        }

        const currentIndex =
          playerIds.indexOf(
            currentPlayerId
          );

        if (currentIndex === -1) {
          return;
        }

        const isSelf =
          targetId === currentPlayerId;

        shotTargetWasSelf =
          isSelf;

        shotResult =
          shell;

        shotTargetName =
          target.name || "Player";

        /* =================================
           ALIVE
        ================================= */

        if (shell === "live") {

          const oldHp =
            Number(
              target.hp ?? 0
            );

          target.hp =
            Math.max(
              0,
              oldHp - 1
            );

          shotTargetHp =
            target.hp;
        }

        /* =================================
           BLANK
        ================================= */

        else {

          shotTargetHp =
            Number(
              target.hp ?? 0
            );
        }

        /* =================================
           CONSUME SHELL
        ================================= */

        game.shells.current =
          currentShell + 1;

        /* =================================
           TURN RULE
        =================================

           LIVE + PLAYER
           -> NEXT PLAYER

           BLANK + PLAYER
           -> NEXT PLAYER

           LIVE + SELF
           -> NEXT PLAYER

           BLANK + SELF
           -> SAME PLAYER
        */

        if (
          shell === "blank" &&
          isSelf
        ) {

          game.turn.current =
            currentPlayerId;

          game.turn.index =
            currentIndex;

          nextTurnPlayer =
            currentPlayerId;

        } else {

          const nextIndex =
            (
              currentIndex + 1
            ) % playerIds.length;

          const nextId =
            playerIds[nextIndex];

          game.turn.current =
            nextId;

          game.turn.index =
            nextIndex;

          nextTurnPlayer =
            nextId;
        }

        return game;
      }
    );

  if (!transactionResult.committed) {

    shotMode = false;

    playerButton.disabled = true;
    youButton.disabled = true;

    alert(
      "Tembakan gagal. State game mungkin sudah berubah."
    );

    return;
  }

  /* ========================================
     HASIL TEMBAKAN
  ======================================== */

  if (shotResult === "live") {

    if (shotTargetWasSelf) {

      alert(
        `💥 LIVE!\n\n` +
        `Kamu terkena peluru!\n` +
        `HP kamu sekarang: ${shotTargetHp}`
      );

    } else {

      alert(
        `💥 LIVE!\n\n` +
        `${shotTargetName} terkena peluru!\n` +
        `HP sekarang: ${shotTargetHp}`
      );
    }

  } else {

    if (shotTargetWasSelf) {

      alert(
        `⚪ BLANK!\n\n` +
        `Tidak ada damage.\n` +
        `Kamu tetap mendapatkan giliran.`
      );

    } else {

      alert(
        `⚪ BLANK!\n\n` +
        `Tidak ada damage.\n` +
        `Giliran berpindah.`
      );
    }
  }

  /* ========================================
     RENDER TERBARU
  ======================================== */

  if (nextTurnPlayer) {

    if (
      nextTurnPlayer ===
      currentPlayerId
    ) {

      showMessage(
        "Giliran kamu."
      );

    } else {

      showMessage(
        `Giliran ${getPlayerName(nextTurnPlayer)}.`
      );
    }
  }

  renderGameState();
}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ========================================
   INITIALIZE
======================================== */

lucide.createIcons();

loadCurrentPlayer()
  .catch(error => {

    console.error(
      "Gagal memuat player:",
      error
    );
  });

</script>
