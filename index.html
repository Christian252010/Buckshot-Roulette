<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Buckshot Roulette</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #1f1f1f;
      color: white;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font-family: Arial, sans-serif;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-screen {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #1f1f1f;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #2f2f2f;
      padding: 24px;
      border-radius: 8px;
    }

    .login-title {
      text-align: center;
      color: white;
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    .login-label {
      display: block;
      color: #aaa;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .login-input {
      width: 100%;
      height: 44px;
      border: 1px solid #555;
      border-radius: 5px;
      background: #222;
      color: white;
      outline: none;
      padding: 0 12px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .login-input:focus {
      border-color: crimson;
    }

    .login-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 5px;
      background: crimson;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 4px;
    }

    .login-btn:active {
      transform: scale(.98);
    }

    .login-message {
      min-height: 20px;
      color: #ff7777;
      text-align: center;
      font-size: 14px;
      margin-top: 12px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      width: 100%;
      height: 58px;
      padding: 8px 10px;
      justify-content: space-between;
      align-items: center;
      background: #292929;
      border-bottom: 1px solid #444;
    }

    .h-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .profile {
      display: flex;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      color: white;
      background: coral;
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      overflow: hidden;
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nama {
      color: #aaa;
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .list {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .list svg {
      width: 22px;
      height: 22px;
      color: #aaa;
    }

    .online,
    .game-online {
      color: #aaa;
      font-size: 18px;
    }

    /* =========================
       LOBBY
    ========================= */

    .lobby {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
      background: #1f1f1f;
    }

    .btns-top {
      display: flex;
      width: 100%;
      padding: 12px;
      gap: 8px;
      align-items: center;
    }

    .create,
    .join,
    .start,
    .left {
      height: 42px;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .create {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      background: #3a3a3a;
    }

    .create svg {
      width: 19px;
      height: 19px;
    }

    .join {
      width: 100%;
      background: #3a3a3a;
    }

    .start-left {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    .start {
      flex: 1;
      background: crimson;
    }

    .left {
      width: 110px;
      background: #3a3a3a;
    }

    .create:active,
    .join:active,
    .start:active,
    .left:active {
      transform: scale(.98);
    }

    .room-message {
      width: 100%;
      min-height: 20px;
      padding: 0 12px;
      color: #888;
      font-size: 14px;
    }

    .join-list {
      width: 100%;
      padding: 0 12px;
    }

    .pl-list {
      display: flex;
      width: 100%;
      padding: 10px 0;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #444;
    }

    .pl-list .profile {
      width: 38px;
      height: 38px;
      font-size: 18px;
    }

    .pl-list .nama {
      font-size: 19px;
    }

    /* =========================
       GAME
    ========================= */

    .game {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
      background: #1f1f1f;
    }

    .game > div:first-child {
      position: relative;
      z-index: 2;
    }

    .game-panel {
      width: 100%;
      padding: 12px;
      background: #292929;
      border-bottom: 1px solid #444;
    }

    .gp-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .game-current-name {
      color: white;
      font-size: 22px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .healt {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }

    .healt svg {
      width: 21px;
      height: 21px;
      color: #ffd700;
      fill: #ffd700;
    }

    .healt .hp-off {
      color: #555;
      fill: none;
    }

    .next {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      color: #888;
      font-size: 15px;
    }

    .next svg {
      width: 18px;
      height: 18px;
    }

    /* =========================
       SHOT
    ========================= */

    .shot {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(62vw, 280px);
      height: min(62vw, 280px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
      transition: transform .15s ease;
    }

    .shot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .shot.active {
      transform: translate(-50%, -50%) scale(1.06);
    }

    /* =========================
       BOTTOM BUTTON
    ========================= */

    .bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      padding:
        10px
        12px
        calc(10px + env(safe-area-inset-bottom));
      z-index: 4;
    }

    .shot-btn {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    .shot-btn button {
      height: 48px;
      flex: 1;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      transition: transform .1s ease;
    }

    .shot-btn button:active {
      transform: scale(.97);
    }

    .other {
      background: crimson;
    }

    .self {
      background: #555;
    }

    /* =========================
       SHOT POPUP
    ========================= */

    .shot-overlay {
      position: absolute;
      inset: 0;
      z-index: 9;
      background: rgba(0, 0, 0, .45);
    }

    .shot-list {
      display: flex;
      flex-direction: column;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 420px;
      max-height: 70dvh;
      overflow-y: auto;
      background: #2f2f2f;
      padding: 14px 18px;
      border-radius: 6px;
      z-index: 10;
    }

    .st-list-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .st-cancel {
      width: 22px;
      height: 22px;
      color: #aaa;
      cursor: pointer;
    }

    .st-list {
      display: flex;
      padding: 8px 0;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1.5px solid #555;
    }

    .st-list:last-child {
      border-bottom: none;
    }

    .st-user {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
    }

    .st-profile {
      display: flex;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      color: white;
      background: coral;
      border-radius: 50%;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      overflow: hidden;
    }

    .st-profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .st-nama {
      color: #aaa;
      font-size: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .st-healt {
      color: #ffd700aa;
      font-size: 16px;
      white-space: nowrap;
    }

    .st-player-btn {
      flex-shrink: 0;
      background: crimson;
      border: none;
      padding: 5px 10px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      border-radius: 4px;
    }

    /* =========================
       MOBILE VIEWPORT FIX
    ========================= */

    @supports not (height: 100dvh) {
      .login-screen,
      .lobby,
      .game {
        height: 100vh;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================= -->

  <div class="login-screen hidden">
    <div class="login-box">

      <div class="login-title">
        Buckshot Roulette
      </div>

      <label class="login-label">
        Nama
      </label>

      <input

      <input

      >

        Masuk

      <div class="login-message"></div>

  </div>


  <!-- =========================
       LOBBY
  ========================= -->

  <div class="lobby hidden">

    <div class="header">

      <div class="h-right">

        </div>

        </button>

        </button>

  </div>


  <!-- =========================
       GAME
  ========================= -->

  <div class="game hidden">

    <div>

      <div class="header">

        <div class="h-right">

          <div class="profile game-profile">
            C
          </div>

          <div class="nama game-name">
            Christian
          </div>

        </div>


        <div class="list">

          <i data-lucide="list"></i>

          <div class="game-online">
            0
          </div>

        </div>

      </div>

        <div class="gp-top">

          <span class="game-current-name">

          </span>

        </button>

        <button class="self">
          You
        </button>

    </div>

  </div>


  <!-- =========================
       SHOT OVERLAY
  ========================= -->

  <div class="shot-overlay hidden">

    <div class="shot-list">

      <div class="st-list-top">

        <span>
          Shot the Player
        </span>

        <i
          data-lucide="x"
          class="st-cancel"
        ></i>

      </div>

      <div class="shot-player-container"></div>

    </div>

  </div>


  <script type="module">

    /* =====================================================
       FIREBASE
    ===================================================== */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      get,
      onValue,
      remove,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBQmI-9ESAqE5AFy49hIyP0rhul9gIlkc",
      authDomain: "buckshotroulette-4c7a1.firebaseapp.com",
      databaseURL: "https://buckshotroulette-4c7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "buckshotroulette-4c7a1",
      storageBucket: "buckshotroulette-4c7a1.firebasestorage.app",
      messagingSenderId: "335951554199",
      appId: "1:335951554199:web:8d7475fc9dda0f76b32bd2",
      measurementId: "G-H5RLT7K97W"
    };


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);


    /* =====================================================
       ELEMENT
    ===================================================== */

    const loginScreen =
      document.querySelector(".login-screen");

    const loginName =
      document.querySelector(".login-name");

    const loginProfile =
      document.querySelector(".login-profile");

    const loginBtn =
      document.querySelector(".login-btn");

    const loginMessage =
      document.querySelector(".login-message");


    const lobby =
      document.querySelector(".lobby");

    const game =
      document.querySelector(".game");


    const createBtn =
      document.querySelector(".create");

    const joinBtn =
      document.querySelector(".join");

    const startLeft =
      document.querySelector(".start-left");

    const startBtn =
      document.querySelector(".start");

    const leftBtn =
      document.querySelector(".left");


    const roomMessage =
      document.querySelector(".room-message");

    const joinList =
      document.querySelector(".join-list");

    const onlineCount =
      document.querySelector(".online");


    const headerProfile =
      document.querySelector(".header-profile");

    const headerName =
      document.querySelector(".header-name");


    const gameProfile =
      document.querySelector(".game-profile");

    const gameName =
      document.querySelector(".game-name");

    const gameOnline =
      document.querySelector(".game-online");


    const gameCurrentName =
      document.querySelector(".game-current-name");

    const nextName =
      document.querySelector(".next-name");

    const healthContainer =
      document.querySelector(".healt");


    const shot =
      document.querySelector(".shot");

    const shotOther =
      document.querySelector(".other");

    const shotSelf =
      document.querySelector(".self");


    const shotOverlay =
      document.querySelector(".shot-overlay");

    const shotPlayerContainer =
      document.querySelector(".shot-player-container");

    const shotCancel =
      document.querySelector(".st-cancel");


    /* =====================================================
       PLAYER
    ===================================================== */

    let currentPlayerId = null;
    let currentPlayer = null;

    let currentScreen = "";


    /* =====================================================
       GAME STATE
    ===================================================== */

    let gamePlayers = [];

    let gameState = null;

    let selectedTarget = null;

    let shotMode = false;

    let roomListenerStarted = false;

    let previousRoomStatus = null;


    /* =====================================================
       HELPER
    ===================================================== */

    function normalizeName(name) {

      return name
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

    }


    function getProfileHTML(player, className = "profile") {

      if (player.profile) {

        return `
          <div class="${className}">
            <img
              src="${escapeHTML(player.profile)}"
              alt="Profile"
            >
          </div>
        `;

      }

      const firstLetter =
        (player.name || "?").charAt(0).toUpperCase();

      return `
        <div class="${className}">
          ${escapeHTML(firstLetter)}
        </div>
      `;

    }


    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function updateIcons() {

      if (window.lucide) {
        lucide.createIcons();
      }

    }


    /* =====================================================
       SCREEN
    ===================================================== */

    function showLogin() {

      loginScreen.classList.remove("hidden");
      lobby.classList.add("hidden");
      game.classList.add("hidden");

      currentScreen = "login";

    }


    function showLobby() {

      loginScreen.classList.add("hidden");
      lobby.classList.remove("hidden");
      game.classList.add("hidden");

      currentScreen = "lobby";

      updateHeader();

      watchRoom();

    }


    function showGame() {

      loginScreen.classList.add("hidden");
      lobby.classList.add("hidden");
      game.classList.remove("hidden");

      currentScreen = "game";

      updateGameHeader();

      updateIcons();

    }


    /* =====================================================
       HEADER
    ===================================================== */

    function setProfileElement(element, player) {

      if (player.profile) {

        element.innerHTML = `
          <img
            src="${escapeHTML(player.profile)}"
            alt="Profile"
          >
        `;

      } else {

        element.textContent =
          (player.name || "?").charAt(0).toUpperCase();

      }

    }


    function updateHeader() {

      if (!currentPlayer) return;

      headerName.textContent =
        currentPlayer.name;

      gameName.textContent =
        currentPlayer.name;

      setProfileElement(
        headerProfile,
        currentPlayer
      );

      setProfileElement(
        gameProfile,
        currentPlayer
      );

    }


    function updateGameHeader() {

      updateHeader();

      gameOnline.textContent =
        gamePlayers.length;

    }


    /* =====================================================
       NAME
    ===================================================== */

    async function nameExists(name) {

      const targetName =
        normalizeName(name);

      const snapshot =
        await get(ref(db, "players"));

      if (!snapshot.exists()) {
        return false;
      }

      const players =
        snapshot.val();

      return Object.values(players).some(player => {

        return normalizeName(
          player.name || ""
        ) === targetName;

      });

    }


    async function reserveName(name) {

      const normalized =
        normalizeName(name);

      const nameKey =
        encodeURIComponent(normalized);

      const nameRef =
        ref(db, "names/" + nameKey);

      const result =
        await runTransaction(
          nameRef,
          current => {

            if (current === null) {

              return {
                name: name,
                createdAt: Date.now()
              };

            }

            return;

          }
        );

      return result.committed;

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    loginBtn.addEventListener(
      "click",
      async () => {

        const name =
          loginName.value.trim();

        const profile =
          loginProfile.value.trim();


        loginMessage.textContent = "";


        if (!name) {

          loginMessage.textContent =
            "Nama wajib diisi.";

          return;

        }


        loginBtn.disabled = true;
        loginBtn.textContent = "Memproses...";


        try {

          const exists =
            await nameExists(name);

          if (exists) {

            loginMessage.textContent =
              "Nama sudah digunakan.";

            return;

          }


          const reserved =
            await reserveName(name);

          if (!reserved) {

            loginMessage.textContent =
              "Nama sudah digunakan.";

            return;

          }


          const playerRef =
            push(ref(db, "players"));

          currentPlayerId =
            playerRef.key;


          currentPlayer = {
            name: name,
            profile: profile,
            createdAt: Date.now()
          };


          await set(
            playerRef,
            currentPlayer
          );


          localStorage.setItem(
            "buckshotPlayerId",
            currentPlayerId
          );


          showLobby();

        } catch (error) {

          console.error(error);

          loginMessage.textContent =
            "Gagal masuk. Coba lagi.";

        } finally {

          loginBtn.disabled = false;
          loginBtn.textContent = "Masuk";

        }

      }
    );


    /* =====================================================
       INITIALIZE PLAYER
    ===================================================== */

    async function initialize() {

      const savedId =
        localStorage.getItem(
          "buckshotPlayerId"
        );


      if (!savedId) {

        showLogin();

        return;

      }


      try {

        const snapshot =
          await get(
            ref(db, "players/" + savedId)
          );


        if (!snapshot.exists()) {

          localStorage.removeItem(
            "buckshotPlayerId"
          );

          showLogin();

          return;

        }


        currentPlayerId =
          savedId;

        currentPlayer =
          snapshot.val();


        showLobby();

      } catch (error) {

        console.error(error);

        showLogin();

      }

    }


    /* =====================================================
       ROOM - WATCH
    ===================================================== */

    function watchRoom() {

      if (roomListenerStarted) {
        return;
      }

      roomListenerStarted = true;


      onValue(
        ref(db, "room"),
        async snapshot => {

          const room =
            snapshot.val();


          if (!room) {

            previousRoomStatus = null;

            renderEmptyRoom();

            return;

          }


          const roomPlayers =
            room.players || {};

          const joined =
            !!roomPlayers[currentPlayerId];


          onlineCount.textContent =
            Object.keys(roomPlayers).length;


          /*
             GAME SEDANG BERJALAN
          */

          if (room.status === "playing") {

            if (joined) {

              if (
                currentScreen !== "game" ||
                previousRoomStatus !== "playing"
              ) {

                await enterGame();

              }

            } else {

              /*
                 Pemain yang belum masuk room
                 tidak boleh masuk game.
              */

              if (currentScreen !== "game") {

                createBtn.classList.add("hidden");
                joinBtn.classList.add("hidden");
                startLeft.classList.add("hidden");

                roomMessage.textContent =
                  "Game sedang berjalan. Tunggu game selesai.";

                joinList.innerHTML = "";

              }

            }


            previousRoomStatus =
              "playing";

            return;

          }


          /*
             LOBBY
          */

          previousRoomStatus =
            "lobby";


          if (currentScreen !== "lobby") {
            showLobby();
          }


          renderLobbyRoom(
            room,
            roomPlayers
          );

        }
      );

    }


    /* =====================================================
       EMPTY ROOM
    ===================================================== */

    function renderEmptyRoom() {

      if (currentScreen !== "lobby") {
        showLobby();
      }


      createBtn.classList.remove("hidden");
      joinBtn.classList.add("hidden");
      startLeft.classList.add("hidden");


      roomMessage.textContent =
        "Belum ada room.";


      joinList.innerHTML = "";

      onlineCount.textContent = "0";

    }


    /* =====================================================
       RENDER LOBBY
    ===================================================== */

    async function renderLobbyRoom(
      room,
      roomPlayers
    ) {

      const joined =
        !!roomPlayers[currentPlayerId];


      createBtn.classList.add("hidden");


      if (joined) {

        joinBtn.classList.add("hidden");
        startLeft.classList.remove("hidden");

      } else {

        joinBtn.classList.remove("hidden");
        startLeft.classList.add("hidden");

      }


      roomMessage.textContent =
        joined
          ? "Kamu berada di dalam room."
          : "Room tersedia.";


      await renderRoomPlayers(
        roomPlayers
      );

    }


    /* =====================================================
       RENDER ROOM PLAYERS
    ===================================================== */

    async function renderRoomPlayers(
      roomPlayers
    ) {

      joinList.innerHTML = "";


      const playerIds =
        Object.keys(roomPlayers);


      onlineCount.textContent =
        playerIds.length;


      for (const playerId of playerIds) {

        try {

          const snapshot =
            await get(
              ref(
                db,
                "players/" + playerId
              )
            );


          if (!snapshot.exists()) {
            continue;
          }


          const player =
            snapshot.val();


          const item =
            document.createElement("div");

          item.className =
            "pl-list";


          item.innerHTML = `
            ${getProfileHTML(player)}
            <div class="nama">
              ${escapeHTML(player.name || "Unknown")}
            </div>
          `;


          joinList.appendChild(item);

        } catch (error) {

          console.error(
            "Gagal mengambil player:",
            error
          );

        }

      }


      updateIcons();

    }


    /* =====================================================
       CREATE ROOM
    ===================================================== */

    createBtn.addEventListener(
      "click",
      async () => {

        createBtn.disabled = true;

        try {

          const snapshot =
            await get(
              ref(db, "room")
            );


          if (snapshot.exists()) {

            roomMessage.textContent =
              "Room sudah tersedia.";

            return;

          }


          await set(
            ref(db, "room"),
            {
              exists: true,
              status: "lobby",
              createdAt: Date.now(),
              players: {
                [currentPlayerId]: true
              }
            }
          );


        } catch (error) {

          console.error(error);

          roomMessage.textContent =
            "Gagal membuat room.";

        } finally {

          createBtn.disabled = false;

        }

      }
    );


    /* =====================================================
       JOIN ROOM
    ===================================================== */

    joinBtn.addEventListener(
      "click",
      async () => {

        joinBtn.disabled = true;

        try {

          const snapshot =
            await get(
              ref(db, "room")
            );


          if (!snapshot.exists()) {

            roomMessage.textContent =
              "Room tidak tersedia.";

            return;

          }


          const room =
            snapshot.val();


          if (room.status === "playing") {

            roomMessage.textContent =
              "Game sedang berjalan.";

            return;

          }


          await set(
            ref(
              db,
              "room/players/" +
              currentPlayerId
            ),
            true
          );


        } catch (error) {

          console.error(error);

          roomMessage.textContent =
            "Gagal join room.";

        } finally {

          joinBtn.disabled = false;

        }

      }
    );


    /* =====================================================
       LEAVE ROOM
    ===================================================== */

    leftBtn.addEventListener(
      "click",
      async () => {

        leftBtn.disabled = true;

        try {

          const snapshot =
            await get(
              ref(db, "room")
            );


          if (!snapshot.exists()) {
            return;
          }


          const room =
            snapshot.val();


          if (room.status === "playing") {

            roomMessage.textContent =
              "Game sedang berjalan.";

            return;

          }


          const players =
            room.players || {};


          delete players[currentPlayerId];


          if (
            Object.keys(players).length === 0
          ) {

            await remove(
              ref(db, "room")
            );

          } else {

            await set(
              ref(db, "room/players"),
              players
            );

          }

        } catch (error) {

          console.error(error);

          roomMessage.textContent =
            "Gagal keluar dari room.";

        } finally {

          leftBtn.disabled = false;

        }

      }
    );


    /* =====================================================
       CREATE INITIAL GAME STATE
    ===================================================== */

    async function createGameState(
      playerIds
    ) {

      /*
         Shell sementara.

         Untuk sekarang tetap menggunakan
         4 live + 4 blank.

         Nanti ketika kita masuk ke sistem
         shell acak final, bagian ini akan
         kita kembangkan.
      */

      const shells = [
        "live",
        "live",
        "live",
        "live",
        "blank",
        "blank",
        "blank",
        "blank"
      ];


      /*
         Fisher-Yates shuffle.

         Ini menghasilkan urutan shell
         acak dengan lebih baik dibanding:

         sort(() => Math.random() - 0.5)
      */

      for (
        let i = shells.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          shells[i],
          shells[j]
        ] = [
          shells[j],
          shells[i]
        ];

      }


      const playerState = {};


      playerIds.forEach(
        playerId => {

          playerState[playerId] = {
            hp: 3
          };

        }
      );


      const game = {
        shells: shells,
        currentShell: 0,

        turnOrder: playerIds,

        currentTurn:
          playerIds[0] || null,

        playerState: playerState,

        createdAt: Date.now()
      };


      await set(
        ref(db, "room/game"),
        game
      );

    }


    /* =====================================================
       START GAME
    ===================================================== */

    startBtn.addEventListener(
      "click",
      async () => {

        startBtn.disabled = true;

        try {

          const snapshot =
            await get(
              ref(db, "room")
            );


          if (!snapshot.exists()) {
            return;
          }


          const room =
            snapshot.val();


          if (room.status === "playing") {
            return;
          }


          const players =
            room.players || {};

          const playerIds =
            Object.keys(players);


          if (playerIds.length < 2) {

            roomMessage.textContent =
              "Minimal 2 pemain untuk memulai.";

            return;

          }


          if (!players[currentPlayerId]) {

            roomMessage.textContent =
              "Kamu harus join room terlebih dahulu.";

            return;

          }


          /*
             Buat game state terlebih dahulu.
          */

          await createGameState(
            playerIds
          );


          /*
             Setelah game state siap,
             ubah status room menjadi playing.
          */

          await set(
            ref(db, "room/status"),
            "playing"
          );


        } catch (error) {

          console.error(error);

          roomMessage.textContent =
            "Gagal memulai game.";

        } finally {

          startBtn.disabled = false;

        }

      }
    );


    /* =====================================================
       ENTER GAME
    ===================================================== */

    async function enterGame() {

      try {

        const roomSnapshot =
          await get(
            ref(db, "room")
          );


        if (!roomSnapshot.exists()) {
          return;
        }


        const room =
          roomSnapshot.val();


        const roomPlayers =
          room.players || {};


        if (!roomPlayers[currentPlayerId]) {
          return;
        }


        /*
           Ambil game state Firebase.
        */

        const gameSnapshot =
          await get(
            ref(db, "room/game")
          );


        if (!gameSnapshot.exists()) {

          console.warn(
            "Game state belum tersedia."
          );

          return;

        }


        gameState =
          gameSnapshot.val();


        await loadGamePlayers(
          roomPlayers,
          gameState
        );


        showGame();

        renderGameState();

        resetShot();


      } catch (error) {

        console.error(
          "Gagal masuk game:",
          error
        );

      }

    }


    /* =====================================================
       LOAD GAME PLAYERS
    ===================================================== */

    async function loadGamePlayers(
      roomPlayers,
      state
    ) {

      gamePlayers = [];


      const playerIds =
        state.turnOrder ||
        Object.keys(roomPlayers);


      for (
        const playerId of playerIds
      ) {

        if (!roomPlayers[playerId]) {
          continue;
        }


        try {

          const snapshot =
            await get(
              ref(
                db,
                "players/" + playerId
              )
            );


          if (!snapshot.exists()) {
            continue;
          }


          const player =
            snapshot.val();


          const hp =
            state.playerState?.[playerId]?.hp ?? 3;


          gamePlayers.push({

            id: playerId,

            name:
              player.name || "Unknown",

            profile:
              player.profile || "",

            hp: hp

          });


        } catch (error) {

          console.error(error);

        }

      }


      updateGameHeader();

    }


    /* =====================================================
       WATCH GAME STATE
    ===================================================== */

    function watchGameState() {

      onValue(
        ref(db, "room/game"),
        async snapshot => {

          if (!snapshot.exists()) {
            return;
          }


          gameState =
            snapshot.val();


          const roomSnapshot =
            await get(
              ref(db, "room")
            );


          if (!roomSnapshot.exists()) {
            return;
          }


          const room =
            roomSnapshot.val();


          if (room.status !== "playing") {
            return;
          }


          await loadGamePlayers(
            room.players || {},
            gameState
          );


          if (
            currentScreen === "game"
          ) {

            renderGameState();

          }

        }
      );

    }


    /*
       Mulai listener game sekali.
    */

    let gameListenerStarted = false;


    function startGameListener() {

      if (gameListenerStarted) {
        return;
      }

      gameListenerStarted = true;

      watchGameState();

    }


    /* =====================================================
       RENDER GAME STATE
    ===================================================== */

    function renderGameState() {

      if (!gameState) {
        return;
      }


      const currentTurn =
        gameState.currentTurn;


      const currentPlayer =
        gamePlayers.find(
          player =>
            player.id === currentTurn
        );


      /*
         Nama pemain yang sedang mendapat giliran.
      */

      gameCurrentName.textContent =
        currentPlayer
          ? currentPlayer.name
          : "-";


      /*
         Cari pemain berikutnya.
      */

      const order =
        gameState.turnOrder || [];


      const currentIndex =
        order.indexOf(currentTurn);


      let nextPlayerId = null;


      if (
        currentIndex !== -1 &&
        order.length > 0
      ) {

        for (
          let i = 1;
          i <= order.length;
          i++
        ) {

          const candidate =
            order[
              (currentIndex + i) %
              order.length
            ];


          const hp =
            gameState
              .playerState
              ?.[candidate]
              ?.hp ?? 0;


          if (hp > 0) {

            nextPlayerId =
              candidate;

            break;

          }

        }

      }


      const nextPlayer =
        gamePlayers.find(
          player =>
            player.id === nextPlayerId
        );


      nextName.textContent =
        nextPlayer
          ? nextPlayer.name
          : "-";


      /*
         HP pemain sendiri.
      */

      const myHP =
        gameState
          .playerState
          ?.[currentPlayerId]
          ?.hp ?? 0;


      renderHealth(myHP);


      /*
         Hanya pemain yang sedang turn
         yang boleh menembak.

         Tombol tetap terlihat,
         tetapi dibuat disabled jika
         bukan giliran.
      */

      const myTurn =
        currentTurn === currentPlayerId;


      shot.style.opacity =
        myTurn ? "1" : ".5";


      shotOther.disabled =
        !myTurn;


      shotSelf.disabled =
        !myTurn;


      shotOther.style.opacity =
        myTurn ? "1" : ".5";


      shotSelf.style.opacity =
        myTurn ? "1" : ".5";


      updateIcons();

    }


    /* =====================================================
       HEALTH
    ===================================================== */

    function renderHealth(hp) {

      const maxHP = 3;

      healthContainer.innerHTML = "";


      for (
        let i = 0;
        i < maxHP;
        i++
      ) {

        const icon =
          document.createElement("i");


        if (i < hp) {

          icon.setAttribute(
            "data-lucide",
            "zap"
          );

        } else {

          icon.setAttribute(
            "data-lucide",
            "zap-off"
          );

          icon.classList.add(
            "hp-off"
          );

        }


        healthContainer.appendChild(
          icon
        );

      }


      updateIcons();

    }


    /* =====================================================
       SHOT MODE
    ===================================================== */

    function enableShotMode() {

      if (!gameState) {
        return;
      }


      if (
        gameState.currentTurn !==
        currentPlayerId
      ) {

        return;

      }


      shotMode = true;

      shot.classList.add("active");

    }


    function resetShot() {

      shotMode = false;

      selectedTarget = null;

      shot.classList.remove(
        "active"
      );

      shotOverlay.classList.add(
        "hidden"
      );

    }


    /* =====================================================
       SHOT CLICK
    ===================================================== */

    shot.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        enableShotMode();

      }
    );


    /* =====================================================
       SELF
    ===================================================== */

    shotSelf.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        if (!shotMode) {
          return;
        }


        if (
          gameState?.currentTurn !==
          currentPlayerId
        ) {

          return;

        }


        const player =
          gamePlayers.find(
            p =>
              p.id ===
              currentPlayerId
          );


        if (!player) {
          return;
        }


        if (player.hp <= 0) {
          return;
        }


        selectedTarget = player;

        shoot();

      }
    );


    /* =====================================================
       OTHER PLAYER
    ===================================================== */

    shotOther.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        if (!shotMode) {
          return;
        }


        if (
          gameState?.currentTurn !==
          currentPlayerId
        ) {

          return;

        }


        openPlayerPopup();

      }
    );


    /* =====================================================
       PLAYER POPUP
    ===================================================== */

    function openPlayerPopup() {

      shotPlayerContainer.innerHTML = "";


      const targets =
        gamePlayers.filter(
          player => {

            return (
              player.id !==
              currentPlayerId &&
              player.hp > 0
            );

          }
        );


      if (targets.length === 0) {

        shotPlayerContainer.innerHTML = `
          <div style="
            padding: 15px 0;
            color: #888;
            text-align: center;
          ">
            Tidak ada pemain yang bisa ditembak.
          </div>
        `;

      } else {

        targets.forEach(
          player => {

            const row =
              document.createElement(
                "div"
              );

            row.className =
              "st-list";


            const hpText =
              "(" + player.hp + ")";


            row.innerHTML = `
              <div class="st-user">

                ${getProfileHTML(
                  player,
                  "st-profile"
                )}

                <span class="st-nama">
                  ${escapeHTML(player.name)}
                </span>

                <span class="st-healt">
                  ${hpText}
                </span>

              </div>

              <button
                class="st-player-btn"
                data-player-id="${escapeHTML(player.id)}"
              >
                Shot
              </button>
            `;


            const button =
              row.querySelector(
                ".st-player-btn"
              );


            button.addEventListener(
              "click",
              event => {

                event.stopPropagation();


                const targetId =
                  button.dataset.playerId;


                const target =
                  gamePlayers.find(
                    p =>
                      p.id === targetId
                  );


                if (!target) {
                  return;
                }


                selectedTarget =
                  target;


                shoot();

              }
            );


            shotPlayerContainer.appendChild(
              row
            );

          }
        );

      }


      shotOverlay.classList.remove(
        "hidden"
      );


      updateIcons();

    }


    /* =====================================================
       CANCEL POPUP
    ===================================================== */

    shotCancel.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        resetShot();

      }
    );


    /* =====================================================
       CLICK OUTSIDE
    ===================================================== */

    document.addEventListener(
      "click",
      event => {

        if (!shotMode) {
          return;
        }


        const clickedShot =
          event.target.closest(
            ".shot"
          );


        const clickedPlayerBtn =
          event.target.closest(
            ".other"
          );


        const clickedSelfBtn =
          event.target.closest(
            ".self"
          );


        const clickedPopup =
          event.target.closest(
            ".shot-list"
          );


        if (clickedShot) {
          return;
        }


        if (clickedPlayerBtn) {
          return;
        }


        if (clickedSelfBtn) {
          return;
        }


        if (clickedPopup) {
          return;
        }


        resetShot();

      }
    );


    /* =====================================================
       SHOOT
    ===================================================== */

    async function shoot() {

      if (!selectedTarget) {
        return;
      }


      if (!gameState) {
        return;
      }


      if (
        gameState.currentTurn !==
        currentPlayerId
      ) {

        resetShot();

        return;

      }


      const currentShell =
        gameState.currentShell ?? 0;


      const shells =
        gameState.shells || [];


      if (
        currentShell >=
        shells.length
      ) {

        alert(
          "Semua shell sudah habis."
        );

        resetShot();

        return;

      }


      const shell =
        shells[currentShell];


      const shellNumber =
        currentShell + 1;


      console.log(
        "Shell:",
        shellNumber
      );


      console.log(
        "Target:",
        selectedTarget.name
      );


      console.log(
        "Jenis:",
        shell.toUpperCase()
      );


      /*
         Untuk sekarang belum melakukan
         damage dan belum pindah turn.

         Hanya menunjukkan hasil shell.
      */

      if (shell === "live") {

        alert(
          "💥 LIVE!\n\n" +
          "Shell: " +
          shellNumber +
          "\n" +
          "Target: " +
          selectedTarget.name
        );

      } else {

        alert(
          "BLANK!\n\n" +
          "Shell: " +
          shellNumber +
          "\n" +
          "Target: " +
          selectedTarget.name
        );

      }


      resetShot();

    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    startGameListener();

    initialize();

    updateIcons();

  </script>

</body>
</html>
