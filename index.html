<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buckshot Roulette</title>

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<style>

/* =========================
   BODY
========================= */

body {
  display: flex;
  height: 100vh;
  flex-direction: column;
  justify-content: space-between;
  margin: 0;
  background: #1f1f1f;
}


/* =========================
   HEADER
========================= */

.header {
  display: flex;
  background: #1a1a1a;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  border-bottom: 2.6px solid #dc143ccb;
  z-index: 99;
}

.h-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.profile {
  display: flex;
  width: 38px;
  height: 38px;
  color: white;
  background: coral;
  border-radius: 50%;
  justify-content: center;
  align-items: center;
  font-size: 20px;
}

.nama {
  color: white;
  font-size: 22px;
}

.list {
  display: flex;
  align-items: center;
  background: #2f2f2f;
  padding: 6px 10px;
  border-radius: 8px;
  gap: 8px;
  color: white;
  font-size: 24px;
}


/* =========================
   GAME PANEL
========================= */

.game-panel {
  display: flex;
  flex-direction: column;
  background: #1a1a1a;
  padding: 10px 16px;
  align-items: center;
  color: white;
  box-shadow: 0 2px 12px 0 #dc143ccb;
  z-index: 1;
}

.gp-top {
  display: flex;
  width: 100%;
  justify-content: space-between;
}

.gp-top span {
  font-size: 22px;
}

.healt {
  color: gold;
}

.hp-off {
  color: #886;
}

.next {
  display: flex;
  width: 100%;
  justify-content: left;
  align-items: center;
  padding-left: 6px;
  margin-top: -4px;
  gap: 6px;
  color: #aaa;
}

.next svg {
  width: 16px;
  height: 16px;
}

.next span {
  font-size: 16px;
}


/* =========================
   SHOTGUN
========================= */

.shot {
  position: absolute;
  display: flex;
  left: 50%;
  top: 50%;
  transform: translateX(-50%) translateY(-50%);
  padding: 14px;
  border-radius: 50%;
  cursor: pointer;
  transition: .15s;
}

.shot:hover {
  background: #333;
}

.shot:active {
  transform: translateX(-50%) translateY(-50%) scale(.94);
}

.shot.active {
  background: #333;
}

.shot img {
  width: 84px;
  height: 84px;
}


/* =========================
   BOTTOM
========================= */

.bottom {
  display: flex;
  width: 100%;
}

.shot-btn {
  display: flex;
  width: 100%;
  padding: 8px;
  gap: 6px;
}

.shot-btn button {
  display: flex;
  width: 100%;
  height: 45px;
  justify-content: center;
  align-items: center;
  gap: 8px;
  border: none;
  background: crimson;
  font-size: 22px;
  color: white;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}

.self {
  background: #666 !important;
}

.shot-btn button:disabled {
  opacity: .45;
  background: #555 !important;
  cursor: not-allowed;
}


/* =========================
   OVERLAY
========================= */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .6);
  z-index: 9;
}


/* =========================
   POPUP
========================= */

.shot-list {
  display: flex;
  flex-direction: column;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translateX(-50%) translateY(-50%);
  width: 80%;
  background: #2f2f2f;
  padding: 14px 18px;
  border-radius: 6px;
  z-index: 10;
  box-sizing: border-box;
}

.st-list-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.st-cancel {
  cursor: pointer;
}

.st-cancel:hover {
  color: crimson;
}


/* =========================
   PLAYER LIST
========================= */

.st-list {
  display: flex;
  padding: 8px 0;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1.5px solid #555;
}

.st-list:last-child {
  border-bottom: none;
}

.st-user {
  display: flex;
  align-items: center;
  gap: 8px;
}

.st-profile {
  display: flex;
  width: 38px;
  height: 38px;
  color: white;
  background: coral;
  border-radius: 50%;
  justify-content: center;
  align-items: center;
  font-size: 20px;
}

.st-nama {
  color: #aaa;
  font-size: 22px;
}

.st-healt {
  color: #ffd700aa;
  font-size: 18px;
}

.st-player-btn {
  background: crimson;
  border: none;
  padding: 4px 10px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  border-radius: 4px;
  cursor: pointer;
}

.st-player-btn:active {
  transform: scale(.95);
}


/* =========================
   HIDDEN
========================= */

.hidden {
  display: none !important;
}

</style>


<!-- =========================
     HEADER
========================= -->

<div>

  <div class="header">

    <div class="h-right">

      <div class="profile">
        C
      </div>

      <div class="nama">
        Christian
      </div>

    </div>


    <div class="list">

      <i data-lucide="list"></i>

      <div class="online">
        3
      </div>

    </div>

  </div>


  <!-- =========================
       GAME PANEL
  ========================= -->

  <div class="game-panel">

    <div class="gp-top">

      <span>
        Christian
      </span>

      <div class="healt">

        <i
          data-lucide="zap-off"
          class="hp-off">
        </i>

        <i data-lucide="zap"></i>

        <i data-lucide="zap"></i>

      </div>

    </div>


    <div class="next">

      <i data-lucide="corner-down-right"></i>

      <span>
        Asep
      </span>

    </div>

  </div>

</div>


<!-- =========================
     SHOTGUN
========================= -->

<div class="shot">

  <img
    src="shot.png"
    alt="Shotgun">

</div>


<!-- =========================
     BOTTOM BUTTON
========================= -->

<div class="bottom">

  <div class="shot-btn">

    <button class="other">
      Player
    </button>

    <button class="self">
      You
    </button>

  </div>

</div>


<!-- =========================
     OVERLAY
========================= -->

<div class="overlay hidden"></div>


<!-- =========================
     SHOT PLAYER POPUP
========================= -->

<div class="shot-list hidden">

  <div class="st-list-top">

    <span>
      Shot the Player
    </span>

    <i
      data-lucide="x"
      class="st-cancel">
    </i>

  </div>


  <div class="st-players"></div>

</div>


<script>
const players = [
  {
    id: 1,
    name: "Christian",
    hp: 3
  },
  {
    id: 2,
    name: "Asep",
    hp: 1
  },
  {
    id: 3,
    name: "Juni",
    hp: 2
  }
];

const currentPlayer = 1;

let shotMode = false;
let selectedTarget = null;
let selectedTargetType = null;

const shot = document.querySelector(".shot");
const otherButton = document.querySelector(".other");
const selfButton = document.querySelector(".self");

const overlay = document.querySelector(".overlay");
const popup = document.querySelector(".shot-list");
const playerContainer = document.querySelector(".st-list-container");


/* =========================
   SHOT BUTTON
========================= */

function enableShotButtons() {
  otherButton.disabled = false;
  selfButton.disabled = false;
}

function disableShotButtons() {
  otherButton.disabled = true;
  selfButton.disabled = true;
}

function resetShot() {
  shotMode = false;

  selectedTarget = null;
  selectedTargetType = null;

  shot.classList.remove("active");

  disableShotButtons();

  closeShotPopup();
}


/* =========================
   KLIK SHOT
========================= */

shot.addEventListener("click", event => {
  event.stopPropagation();

  shotMode = true;

  shot.classList.add("active");

  enableShotButtons();
});


/* =========================
   TOMBOL PLAYER
========================= */

otherButton.addEventListener("click", event => {
  event.stopPropagation();

  if (!shotMode) return;

  openShotPopup();
});


/* =========================
   TOMBOL YOU
========================= */

selfButton.addEventListener("click", event => {
  event.stopPropagation();

  if (!shotMode) return;

  const target = players.find(
    player => player.id === currentPlayer
  );

  if (!target) return;

  selectedTarget = target;
  selectedTargetType = "self";

  alert("Menembak: " + target.name);

  resetShot();
});


/* =========================
   POPUP TARGET PLAYER
========================= */

function openShotPopup() {
  renderShotPlayers();

  overlay.classList.add("show");
  popup.classList.add("show");
}

function closeShotPopup() {
  overlay.classList.remove("show");
  popup.classList.remove("show");
}


/* =========================
   RENDER PLAYER DI POPUP
========================= */

function renderShotPlayers() {
  playerContainer.innerHTML = "";

  const targets = players.filter(player => {
    return (
      player.id !== currentPlayer &&
      player.hp > 0
    );
  });

  if (targets.length === 0) {
    playerContainer.innerHTML = `
      <div class="st-empty">
        Tidak ada player yang bisa ditembak.
      </div>
    `;

    return;
  }

  targets.forEach(player => {
    const firstLetter = player.name
      .trim()
      .charAt(0)
      .toUpperCase();

    const item = document.createElement("div");

    item.className = "st-list";

    item.innerHTML = `
      <div class="st-user">

        <span class="st-profile">
          ${firstLetter}
        </span>

        <span class="st-nama">
          ${player.name}
        </span>

        <span class="st-healt">
          (${player.hp})
        </span>

      </div>

      <button
        class="st-player-btn"
        data-id="${player.id}"
      >
        Shot
      </button>
    `;

    playerContainer.appendChild(item);
  });

  if (window.lucide) {
    lucide.createIcons();
  }
}


/* =========================
   PILIH TARGET PLAYER
========================= */

playerContainer.addEventListener("click", event => {
  const button = event.target.closest(".st-player-btn");

  if (!button) return;

  if (!shotMode) return;

  const targetId = Number(button.dataset.id);

  const target = players.find(
    player => player.id === targetId
  );

  if (!target) return;

  selectedTarget = target;
  selectedTargetType = "player";

  alert("Menembak: " + target.name);

  resetShot();
});


/* =========================
   CLOSE POPUP
========================= */

popup.addEventListener("click", event => {
  const cancel = event.target.closest(".st-cancel");

  if (!cancel) return;

  resetShot();
});


/* =========================
   KLIK OVERLAY
========================= */

overlay.addEventListener("click", event => {
  if (event.target !== overlay) return;

  resetShot();
});


/* =========================
   KLIK DI LUAR SHOT / BUTTON
========================= */

document.addEventListener("click", event => {

  if (!shotMode) return;

  const clickedShot =
    event.target.closest(".shot");

  const clickedPlayerButton =
    event.target.closest(".other");

  const clickedSelfButton =
    event.target.closest(".self");

  const clickedPopup =
    event.target.closest(".shot-list");

  /*
   * Jika klik Shotgun,
   * tombol Player/You tetap aktif.
   */
  if (clickedShot) {
    return;
  }

  /*
   * Jika klik tombol Player,
   * biarkan proses popup berjalan.
   */
  if (clickedPlayerButton) {
    return;
  }

  /*
   * Jika klik tombol You,
   * biarkan proses You berjalan.
   */
  if (clickedSelfButton) {
    return;
  }

  /*
   * Jika klik bagian dalam popup,
   * jangan matikan shotMode.
   */
  if (clickedPopup) {
    return;
  }

  /*
   * Selain elemen di atas:
   * shotMode dimatikan.
   */
  resetShot();
});


/* =========================
   KONDISI AWAL
========================= */

disableShotButtons();

if (window.lucide) {
  lucide.createIcons();
}
</script>

</body>
</html>
