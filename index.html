<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Buckshot Roulette</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif;min-height:100vh;padding:20px}.container{width:100%;max-width:520px;margin:auto}.card{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:14px}h1{font-size:22px;text-align:center;margin:5px 0 20px;letter-spacing:1px}h2{font-size:16px;margin:0 0 14px;color:#ccc}button,input{font:inherit}button{border:1px solid #444;background:#292929;color:#fff;border-radius:7px;padding:11px 14px;cursor:pointer;transition:.15s}button:hover{background:#383838}button:disabled{opacity:.45;cursor:not-allowed}.profile-box{display:flex;align-items:center;gap:12px}.profile-box img,.player img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#292929;border:1px solid #444}.profile-name{font-weight:bold}.profile-label{font-size:12px;color:#888;margin-bottom:3px}.input-group{display:flex;flex-direction:column;gap:8px}input{width:100%;background:#111;color:#eee;border:1px solid #444;border-radius:7px;padding:11px;outline:none}input:focus{border-color:#777}.actions{display:flex;gap:8px}.actions button{flex:1}.main-action{width:100%}.status{font-size:13px;color:#999;margin-bottom:12px}.players-card{padding:0;overflow:hidden}.players-title{padding:15px 16px;border-bottom:1px solid #333;font-weight:bold}.player-list{padding:8px}.player{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:8px}.player+.player{margin-top:2px}.player-name{font-size:14px}.you{font-size:11px;color:#777;margin-left:5px}.empty{text-align:center;color:#777;padding:18px;font-size:13px}.message{text-align:center;color:#888;font-size:13px;margin:10px 0 0}.error{color:#d66}.hidden{display:none!important}.game{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center}.game h2{font-size:28px;color:#fff;margin-bottom:8px}
</style>
</head>
<body>
<div class="container">
<h1>BUCKSHOT ROULETTE</h1>

<div id="setupCard" class="card">
<div class="input-group">
<input id="nameInput" type="text" maxlength="20" placeholder="Nama">
<input id="profileInput" type="url" placeholder="URL Foto Profil (opsional)">
<button id="savePlayerButton" class="main-action">SIMPAN PROFIL</button>
</div>
<p id="playerMessage" class="message"></p>
</div>

<div id="profileCard" class="card hidden">
<div class="profile-box">
<img id="myProfileImage" alt="Profile">
<div><div class="profile-label">PROFILE</div><div id="myName" class="profile-name"></div></div>
</div>
</div>

<div id="roomCard" class="card hidden">
<div id="roomStatus" class="status">Belum ada room.</div>
<div id="roomActions"></div>
<p id="roomMessage" class="message"></p>
</div>

<div id="playersCard" class="card players-card hidden">
<div class="players-title">Pemain</div>
<div id="roomPlayers" class="player-list"></div>
</div>

<div id="gameScreen" class="card game hidden">
<div><h2>GAME DIMULAI</h2><p class="message">Permainan sedang berlangsung.</p></div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getDatabase,ref,push,set,get,onValue,remove,runTransaction}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyBQmI-9ES6AqE5AFy49hIyP0rhul9gIlkc",authDomain:"buckshotroulette-4c7a1.firebaseapp.com",databaseURL:"https://buckshotroulette-4c7a1-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"buckshotroulette-4c7a1",storageBucket:"buckshotroulette-4c7a1.firebasestorage.app",messagingSenderId:"335951554199",appId:"1:335951554199:web:8d7475fc9dda0f76b32bd2",measurementId:"G-H5RLT7K97W"};

const app=initializeApp(firebaseConfig),db=getDatabase(app);
let currentPlayerId=null,currentPlayer=null;

const setupCard=document.getElementById("setupCard"),profileCard=document.getElementById("profileCard"),roomCard=document.getElementById("roomCard"),playersCard=document.getElementById("playersCard"),gameScreen=document.getElementById("gameScreen"),nameInput=document.getElementById("nameInput"),profileInput=document.getElementById("profileInput"),savePlayerButton=document.getElementById("savePlayerButton"),playerMessage=document.getElementById("playerMessage"),myProfileImage=document.getElementById("myProfileImage"),myName=document.getElementById("myName"),roomStatus=document.getElementById("roomStatus"),roomActions=document.getElementById("roomActions"),roomMessage=document.getElementById("roomMessage"),roomPlayers=document.getElementById("roomPlayers");

const normalizeName=name=>name.trim().toLowerCase().replace(/\s+/g," ");
const clearMessage=()=>{playerMessage.textContent="";roomMessage.textContent=""};

async function nameExists(name){
const target=normalizeName(name),playersSnap=await get(ref(db,"players"));
if(!playersSnap.exists())return false;
const players=playersSnap.val();
return Object.values(players).some(p=>normalizeName(p.name||"")===target);
}

async function reserveName(name){
const key=normalizeName(name).replace(/[.#$/[\]]/g,"_");
const nameRef=ref(db,"names/"+key);
const result=await runTransaction(nameRef,current=>current===null?{name:name,createdAt:Date.now()}:undefined);
return result.committed;
}

function showProfile(){
setupCard.classList.add("hidden");
profileCard.classList.remove("hidden");
roomCard.classList.remove("hidden");
myName.textContent=currentPlayer.name;
myProfileImage.src=currentPlayer.profile||"";
myProfileImage.onerror=()=>{myProfileImage.style.display="none"};
if(!currentPlayer.profile)myProfileImage.style.display="none";
}

async function createPlayer(){
const name=nameInput.value.trim(),profile=profileInput.value.trim();
if(!name){playerMessage.textContent="Nama wajib diisi.";playerMessage.classList.add("error");return}
if(name.length<2){playerMessage.textContent="Nama minimal 2 karakter.";playerMessage.classList.add("error");return}
savePlayerButton.disabled=true;
playerMessage.classList.remove("error");
playerMessage.textContent="Memeriksa nama...";
try{
if(await nameExists(name)){playerMessage.textContent="Nama tersebut sudah digunakan.";playerMessage.classList.add("error");savePlayerButton.disabled=false;return}
if(!(await reserveName(name))){playerMessage.textContent="Nama tersebut sudah digunakan.";playerMessage.classList.add("error");savePlayerButton.disabled=false;return}
const playerRef=push(ref(db,"players"));
currentPlayerId=playerRef.key;
currentPlayer={name,profile,createdAt:Date.now()};
await set(playerRef,currentPlayer);
localStorage.setItem("buckshotPlayerId",currentPlayerId);
playerMessage.textContent="";
showProfile();
listenToRoom();
}catch(error){
console.error(error);
playerMessage.textContent="Gagal membuat profil.";
playerMessage.classList.add("error");
savePlayerButton.disabled=false;
}
}

savePlayerButton.addEventListener("click",createPlayer);

async function loadPlayer(){
const savedId=localStorage.getItem("buckshotPlayerId");
if(!savedId)return;
try{
const snapshot=await get(ref(db,"players/"+savedId));
if(snapshot.exists()){
currentPlayerId=savedId;
currentPlayer=snapshot.val();
showProfile();
listenToRoom();
}
}catch(error){console.error(error)}
}

async function createRoom(){
try{
const snapshot=await get(ref(db,"room"));
if(snapshot.exists()&&snapshot.val().exists){roomMessage.textContent="Room sudah tersedia.";return}
await set(ref(db,"room"),{exists:true,status:"lobby",createdAt:Date.now(),players:{[currentPlayerId]:true}});
}catch(error){console.error(error);roomMessage.textContent="Gagal membuat room."}
}

async function joinRoom(){
try{
const snapshot=await get(ref(db,"room"));
if(!snapshot.exists()||!snapshot.val().exists){roomMessage.textContent="Room sudah tidak tersedia.";return}
const room=snapshot.val();
if(room.status==="playing"){roomMessage.textContent="Game sedang berjalan.";return}
await set(ref(db,"room/players/"+currentPlayerId),true);
}catch(error){console.error(error);roomMessage.textContent="Gagal JOIN room."}
}

async function leaveRoom(){
try{
const snapshot=await get(ref(db,"room"));
if(!snapshot.exists())return;
const room=snapshot.val();
if(room.status==="playing"){roomMessage.textContent="Game sedang berjalan.";return}
const players=room.players||{};
delete players[currentPlayerId];
if(Object.keys(players).length===0){
await remove(ref(db,"room"));
}else{
await set(ref(db,"room/players"),players);
}
}catch(error){console.error(error);roomMessage.textContent="Gagal keluar dari room."}
}

async function startGame(){
try{
const snapshot=await get(ref(db,"room"));
if(!snapshot.exists())return;
const room=snapshot.val(),players=room.players||{};
if(room.status==="playing")return;
if(Object.keys(players).length<2){roomMessage.textContent="Minimal 2 pemain untuk memulai.";return}
await set(ref(db,"room/status"),"playing");
}catch(error){console.error(error);roomMessage.textContent="Gagal memulai game."}
}

async function renderPlayers(players){
roomPlayers.innerHTML="";
const ids=Object.keys(players||{});
if(!ids.length){roomPlayers.innerHTML='<div class="empty">Belum ada pemain.</div>';return}
for(const id of ids){
const snap=await get(ref(db,"players/"+id));
if(!snap.exists())continue;
const data=snap.val(),item=document.createElement("div");
item.className="player";
const img=document.createElement("img");
if(data.profile){img.src=data.profile;img.onerror=()=>img.style.display="none"}else img.style.display="none";
const name=document.createElement("div");
name.className="player-name";
name.textContent=data.name||"Player";
if(id===currentPlayerId){const you=document.createElement("span");you.className="you";you.textContent="(Anda)";name.appendChild(you)}
item.append(img,name);
roomPlayers.appendChild(item);
}
}

function button(text,handler,className=""){
const b=document.createElement("button");b.textContent=text;b.className=className;b.addEventListener("click",handler);return b;
}

function renderActions(room){
roomActions.innerHTML="";
const players=room.players||{},joined=!!players[currentPlayerId],status=room.status||"lobby";
if(status==="playing")return;
if(!room.exists)return;
if(joined){
const actions=document.createElement("div");actions.className="actions";
actions.append(button("MULAI",startGame),button("KELUAR",leaveRoom));
roomActions.appendChild(actions);
}else{
roomActions.appendChild(button("JOIN",joinRoom,"main-action"));
}
}

function listenToRoom(){
onValue(ref(db,"room"),async snapshot=>{
const room=snapshot.val();
roomMessage.textContent="";
if(!room||!room.exists){
roomStatus.textContent="Belum ada room.";
roomActions.innerHTML="";
roomActions.appendChild(button("BUAT ROOM",createRoom,"main-action"));
playersCard.classList.add("hidden");
gameScreen.classList.add("hidden");
return;
}
roomCard.classList.remove("hidden");
const status=room.status||"lobby";
if(status==="playing"){
roomStatus.textContent="GAME SEDANG BERJALAN";
roomActions.innerHTML="";
playersCard.classList.add("hidden");
gameScreen.classList.remove("hidden");
return;
}
gameScreen.classList.add("hidden");
playersCard.classList.remove("hidden");
roomStatus.textContent="Room tersedia";
renderActions(room);
await renderPlayers(room.players||{});
});
}

loadPlayer();
</script>
</body>
</html>
