<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buckshot Roulette</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* =========================
       GENERAL
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #1f1f1f;
      color: white;
      font-family: Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;

      background: #1a1a1a;
      border-bottom: 2.6px solid #dc143ccb;
    }

    .h-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile {
      display: flex;
      width: 38px;
      height: 38px;

      justify-content: center;
      align-items: center;

      background: #dc143c;
      border-radius: 50%;

      color: white;
      font-size: 20px;
      font-weight: bold;

      overflow: hidden;
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .nama {
      color: white;
      font-size: 22px;
    }

    .list {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 6px 10px;

      background: #2f2f2f;
      border-radius: 8px;

      color: white;
      font-size: 24px;
    }

    .online {
      min-width: 20px;
      text-align: center;
    }


    /* =========================
       ROOM BUTTONS
    ========================= */

    .btns-top {
      display: flex;
      flex-direction: column;
      gap: 6px;

      padding: 14px;

      justify-content: center;
      align-items: center;
    }

    .btns-top button {
      display: flex;
      width: 100%;
      height: 45px;

      justify-content: center;
      align-items: center;
      gap: 8px;

      border: none;
      border-radius: 6px;

      background: crimson;
      color: white;

      font-size: 22px;
      font-weight: bold;
    }

    .btns-top button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .start-left {
      display: flex;
      width: 100%;
      gap: 6px;
    }

    .left {
      background: #666 !important;
    }


    /* =========================
       PLAYER LIST
    ========================= */

    .join-list {
      display: flex;
      flex-direction: column;

      gap: 0;

      margin: 14px;
      padding: 14px 18px;

      background: #2f2f2f;
      border-radius: 6px;
    }

    .pl-list {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px;

      border-bottom: 1.5px solid #555;
    }

    .pl-list:last-child {
      border-bottom: none;
    }

    .pl-name {
      font-size: 18px;
    }

    .you {
      margin-left: 5px;

      color: #888;
      font-size: 13px;
    }

    .empty {
      padding: 15px;

      text-align: center;

      color: #888;
      font-size: 14px;
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {
      margin: 0 14px 14px;

      text-align: center;

      color: #999;
      font-size: 14px;
    }

    .error {
      color: #ff6b6b;
    }


    /* =========================
       GAME
    ========================= */

    .game-screen {
      display: flex;
      min-height: 300px;

      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .game-screen h2 {
      font-size: 28px;
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <div class="header">

    <div class="h-right">

      <div id="myProfile" class="profile">
        C
      </div>

      <div id="myName" class="nama">
        -
      </div>

    </div>

    <div class="list">
      <i data-lucide="list"></i>
      <div id="onlineCount" class="online">0</div>
    </div>

  </div>


  <!-- =========================
       ROOM ACTIONS
  ========================= -->

  <div id="roomActions" class="btns-top">

    <!--
      Tombol akan dibuat otomatis
      berdasarkan kondisi room.
    -->

  </div>


  <!-- =========================
       ROOM MESSAGE
  ========================= -->

  <p id="roomMessage" class="message"></p>


  <!-- =========================
       PLAYER LIST
  ========================= -->

  <div id="playerList" class="join-list">

    <div class="empty">
      Belum ada room.
    </div>

  </div>


  <!-- =========================
       GAME SCREEN
  ========================= -->

  <div id="gameScreen" class="game-screen hidden">

    <div>
      <h2>GAME DIMULAI</h2>

      <p>
        Permainan sedang berlangsung.
      </p>
    </div>

  </div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      get,
      onValue,
      remove,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyBQmI-9ES6AqE5AFy49hIyP0rhul9gIlkc",
      authDomain: "buckshotroulette-4c7a1.firebaseapp.com",
      databaseURL: "https://buckshotroulette-4c7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "buckshotroulette-4c7a1",
      storageBucket: "buckshotroulette-4c7a1.firebasestorage.app",
      messagingSenderId: "335951554199",
      appId: "1:335951554199:web:8d7475fc9dda0f76b32bd2",
      measurementId: "G-H5RLT7K97W"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);


    /* =========================
       PLAYER VARIABLES
    ========================= */

    let currentPlayerId = null;
    let currentPlayer = null;


    /* =========================
       HTML ELEMENTS
    ========================= */

    const myProfile =
      document.getElementById("myProfile");

    const myName =
      document.getElementById("myName");

    const onlineCount =
      document.getElementById("onlineCount");

    const roomActions =
      document.getElementById("roomActions");

    const roomMessage =
      document.getElementById("roomMessage");

    const playerList =
      document.getElementById("playerList");

    const gameScreen =
      document.getElementById("gameScreen");


    /* =========================
       NAME UTILITY
    ========================= */

    function normalizeName(name) {
      return name
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }


    /* =========================
       CHECK NAME
    ========================= */

    async function nameExists(name) {

      const targetName =
        normalizeName(name);

      const snapshot =
        await get(ref(db, "players"));

      if (!snapshot.exists()) {
        return false;
      }

      const players =
        snapshot.val();

      return Object.values(players).some(
        player =>
          normalizeName(player.name || "") ===
          targetName
      );
    }


    /* =========================
       RESERVE NAME
    ========================= */

    async function reserveName(name) {

      const nameKey =
        normalizeName(name)
          .replace(/[.#$/[\]]/g, "_");

      const nameRef =
        ref(db, "names/" + nameKey);

      const result =
        await runTransaction(
          nameRef,
          current => {

            if (current === null) {

              return {
                name: name,
                createdAt: Date.now()
              };

            }

            return;
          }
        );

      return result.committed;
    }


    /* =========================
       SHOW PLAYER
    ========================= */

    function showPlayer() {

      myName.textContent =
        currentPlayer.name;

      if (currentPlayer.profile) {

        myProfile.innerHTML = `
          <img
            src="${currentPlayer.profile}"
            alt="Profile"
          >
        `;

      } else {

        myProfile.textContent =
          currentPlayer.name
            .charAt(0)
            .toUpperCase();

      }
    }


    /* =========================
       LOAD PLAYER
    ========================= */

    async function loadPlayer() {

      const savedId =
        localStorage.getItem(
          "buckshotPlayerId"
        );

      /*
        Jika belum mempunyai profile,
        sementara tampilkan form sederhana.
      */

      if (!savedId) {

        showCreatePlayerForm();

        return;
      }

      try {

        const snapshot =
          await get(
            ref(db, "players/" + savedId)
          );

        if (!snapshot.exists()) {

          localStorage.removeItem(
            "buckshotPlayerId"
          );

          showCreatePlayerForm();

          return;
        }

        currentPlayerId =
          savedId;

        currentPlayer =
          snapshot.val();

        showPlayer();
        listenToRoom();

      } catch (error) {

        console.error(error);

        roomMessage.textContent =
          "Gagal memuat profile.";

      }
    }


    /* =========================
       CREATE PLAYER FORM
    ========================= */

    function showCreatePlayerForm() {

      roomActions.innerHTML = `
        <input
          id="nameInput"
          type="text"
          maxlength="20"
          placeholder="Nama"
          style="
            width:100%;
            height:45px;
            padding:0 12px;
            border:none;
            border-radius:6px;
            background:#2f2f2f;
            color:white;
            outline:none;
          "
        >

        <input
          id="profileInput"
          type="url"
          placeholder="URL Foto Profil (opsional)"
          style="
            width:100%;
            height:45px;
            padding:0 12px;
            border:none;
            border-radius:6px;
            background:#2f2f2f;
            color:white;
            outline:none;
          "
        >

        <button id="savePlayerButton">
          Simpan Profile
        </button>
      `;

      document
        .getElementById("savePlayerButton")
        .addEventListener(
          "click",
          createPlayer
        );
    }


    /* =========================
       CREATE PLAYER
    ========================= */

    async function createPlayer() {

      const name =
        document
          .getElementById("nameInput")
          .value
          .trim();

      const profile =
        document
          .getElementById("profileInput")
          .value
          .trim();

      roomMessage.classList.remove("error");

      if (!name) {

        roomMessage.textContent =
          "Nama wajib diisi.";

        roomMessage.classList.add("error");

        return;
      }

      if (name.length < 2) {

        roomMessage.textContent =
          "Nama minimal 2 karakter.";

        roomMessage.classList.add("error");

        return;
      }

      try {

        roomMessage.textContent =
          "Memeriksa nama...";

        if (await nameExists(name)) {

          roomMessage.textContent =
            "Nama tersebut sudah digunakan.";

          roomMessage.classList.add("error");

          return;
        }

        const reserved =
          await reserveName(name);

        if (!reserved) {

          roomMessage.textContent =
            "Nama tersebut sudah digunakan.";

          roomMessage.classList.add("error");

          return;
        }

        const playerRef =
          push(ref(db, "players"));

        currentPlayerId =
          playerRef.key;

        currentPlayer = {
          name: name,
          profile: profile,
          createdAt: Date.now()
        };

        await set(
          playerRef,
          currentPlayer
        );

        localStorage.setItem(
          "buckshotPlayerId",
          currentPlayerId
        );

        roomMessage.textContent = "";

        showPlayer();
        listenToRoom();

      } catch (error) {

        console.error(error);

        roomMessage.textContent =
          "Gagal membuat profile.";

        roomMessage.classList.add("error");
      }
    }


    /* =========================
       CREATE ROOM
    ========================= */

    async function createRoom() {

      try {

        const snapshot =
          await get(ref(db, "room"));

        if (
          snapshot.exists() &&
          snapshot.val().exists
        ) {

          roomMessage.textContent =
            "Room sudah tersedia.";

          return;
        }

        await set(
          ref(db, "room"),
          {
            exists: true,
            status: "lobby",
            createdAt: Date.now(),

            players: {
              [currentPlayerId]: true
            }
          }
        );

      } catch (error) {

        console.error(error);

        roomMessage.textContent =
          "Gagal membuat room.";
      }
    }


    /* =========================
       JOIN ROOM
    ========================= */

    async function joinRoom() {

      try {

        const snapshot =
          await get(ref(db, "room"));

        if (
          !snapshot.exists() ||
          !snapshot.val().exists
        ) {

          roomMessage.textContent =
            "Room sudah tidak tersedia.";

          return;
        }

        const room =
          snapshot.val();

        if (room.status === "playing") {

          roomMessage.textContent =
            "Game sedang berjalan.";

          return;
        }

        await set(
          ref(
            db,
            "room/players/" +
            currentPlayerId
          ),
          true
        );

      } catch (error) {

        console.error(error);

        roomMessage.textContent =
          "Gagal JOIN room.";
      }
    }


    /* =========================
       LEAVE ROOM
    ========================= */

    async function leaveRoom() {

      try {

        const snapshot =
          await get(ref(db, "room"));

        if (!snapshot.exists()) {
          return;
        }

        const room =
          snapshot.val();

        if (room.status === "playing") {

          roomMessage.textContent =
            "Game sedang berjalan.";

          return;
        }

        const players =
          room.players || {};

        delete players[currentPlayerId];

        if (
          Object.keys(players).length === 0
        ) {

          await remove(
            ref(db, "room")
          );

        } else {

          await set(
            ref(db, "room/players"),
            players
          );
        }

      } catch (error) {

        console.error(error);

        roomMessage.textContent =
          "Gagal keluar dari room.";
      }
    }


    /* =========================
       START GAME
    ========================= */

    async function startGame() {

      try {

        const snapshot =
          await get(ref(db, "room"));

        if (!snapshot.exists()) {
          return;
        }

        const room =
          snapshot.val();

        const players =
          room.players || {};

        if (room.status === "playing") {
          return;
        }

        if (
          Object.keys(players).length < 2
        ) {

          roomMessage.textContent =
            "Minimal 2 pemain untuk memulai.";

          return;
        }

        await set(
          ref(db, "room/status"),
          "playing"
        );

      } catch (error) {

        console.error(error);

        roomMessage.textContent =
          "Gagal memulai game.";
      }
    }


    /* =========================
       CREATE BUTTON
    ========================= */

    function createButton(
      text,
      icon,
      handler,
      className = ""
    ) {

      const button =
        document.createElement("button");

      button.className =
        className;

      if (icon) {

        button.innerHTML = `
          <i data-lucide="${icon}"></i>
          ${text}
        `;

      } else {

        button.textContent =
          text;
      }

      button.addEventListener(
        "click",
        handler
      );

      return button;
    }


    /* =========================
       RENDER ROOM BUTTONS
    ========================= */

    function renderRoomActions(room) {

      roomActions.innerHTML = "";

      const players =
        room.players || {};

      const joined =
        !!players[currentPlayerId];

      const status =
        room.status || "lobby";


      /*
        Game sedang berjalan.
      */

      if (status === "playing") {
        return;
      }


      /*
        Pemain sudah berada di room.
        Tampilkan MULAI + KELUAR.
      */

      if (joined) {

        const actionRow =
          document.createElement("div");

        actionRow.className =
          "start-left";

        const startButton =
          createButton(
            "Mulai",
            null,
            startGame
          );

        const leaveButton =
          createButton(
            "Keluar",
            null,
            leaveRoom,
            "left"
          );

        actionRow.append(
          startButton,
          leaveButton
        );

        roomActions.appendChild(
          actionRow
        );

        return;
      }


      /*
        Room tersedia tetapi
        pemain belum JOIN.
      */

      const joinButton =
        createButton(
          "Join",
          "log-in",
          joinRoom
        );

      roomActions.appendChild(
        joinButton
      );
    }


    /* =========================
       RENDER NO ROOM
    ========================= */

    function renderNoRoom() {

      roomActions.innerHTML = "";

      const createButtonElement =
        createButton(
          "Buat room",
          "plus",
          createRoom
        );

      roomActions.appendChild(
        createButtonElement
      );

      playerList.innerHTML = `
        <div class="empty">
          Belum ada room.
        </div>
      `;

      onlineCount.textContent = "0";

      gameScreen.classList.add(
        "hidden"
      );
    }


    /* =========================
       RENDER PLAYERS
    ========================= */

    async function renderPlayers(players) {

      playerList.innerHTML = "";

      const playerIds =
        Object.keys(players || {});

      onlineCount.textContent =
        playerIds.length;


      if (playerIds.length === 0) {

        playerList.innerHTML = `
          <div class="empty">
            Belum ada pemain.
          </div>
        `;

        return;
      }


      for (const playerId of playerIds) {

        const snapshot =
          await get(
            ref(
              db,
              "players/" + playerId
            )
          );

        if (!snapshot.exists()) {
          continue;
        }

        const player =
          snapshot.val();


        /* Player row */

        const playerElement =
          document.createElement("div");

        playerElement.className =
          "pl-list";


        /* Profile */

        const profile =
          document.createElement("div");

        profile.className =
          "profile";


        if (player.profile) {

          profile.innerHTML = `
            <img
              src="${player.profile}"
              alt="Profile"
            >
          `;

        } else {

          profile.textContent =
            (player.name || "P")
              .charAt(0)
              .toUpperCase();
        }


        /* Name */

        const name =
          document.createElement("div");

        name.className =
          "pl-name";

        name.textContent =
          player.name || "Player";


        /* Current player */

        if (
          playerId === currentPlayerId
        ) {

          const you =
            document.createElement("span");

          you.className =
            "you";

          you.textContent =
            "(Anda)";

          name.appendChild(you);
        }


        playerElement.append(
          profile,
          name
        );

        playerList.appendChild(
          playerElement
        );
      }
    }


    /* =========================
       LISTEN ROOM
    ========================= */

    function listenToRoom() {

      onValue(
        ref(db, "room"),
        async snapshot => {

          const room =
            snapshot.val();

          roomMessage.textContent = "";


          /*
            Tidak ada room.
          */

          if (
            !room ||
            !room.exists
          ) {

            renderNoRoom();

            return;
          }


          /*
            Game sedang berjalan.
          */

          if (
            room.status === "playing"
          ) {

            roomActions.innerHTML = "";

            playerList.innerHTML = "";

            onlineCount.textContent =
              Object.keys(
                room.players || {}
              ).length;

            gameScreen.classList.remove(
              "hidden"
            );

            return;
          }


          /*
            Lobby.
          */

          gameScreen.classList.add(
            "hidden"
          );

          renderRoomActions(room);

          await renderPlayers(
            room.players || {}
          );

          lucide.createIcons();
        }
      );
    }


    /* =========================
       INITIALIZE
    ========================= */

    lucide.createIcons();

    loadPlayer();

  </script>

</body>
</html>
