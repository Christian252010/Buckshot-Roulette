<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buckshot Roulette</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;min-height:100vh;padding:20px}
.container{max-width:600px;margin:auto}
h1{text-align:center;margin-bottom:25px}
.card{background:#1d1d1d;border:1px solid #444;border-radius:10px;padding:20px;margin-bottom:15px}
input,button{width:100%;padding:12px;margin-top:8px;border-radius:6px;border:1px solid #555;font-size:16px}
input{background:#111;color:#fff}
button{background:#333;color:#fff;cursor:pointer}
button:hover{background:#444}
button:disabled{opacity:.5;cursor:not-allowed}
.player{display:flex;align-items:center;gap:10px;background:#292929;padding:10px;border-radius:6px;margin-top:8px}
.player img{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#111}
.status{text-align:center;padding:10px;border-radius:6px;background:#292929;margin-bottom:15px}
.message{text-align:center;color:#aaa;font-size:14px}
#gameScreen{text-align:center;padding:50px 20px}
#gameScreen h2{font-size:32px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
<h1>BUCKSHOT ROULETTE</h1>

<div id="playerSection" class="card">
<h2>Profil</h2>
<input type="text" id="nameInput" placeholder="Nama" maxlength="20">
<input type="url" id="profileInput" placeholder="URL Foto Profil (opsional)">
<button id="savePlayerButton">SIMPAN</button>
<p id="playerMessage" class="message"></p>
</div>

<div id="profileSection" class="card hidden">
<h2>Profil Saya</h2>
<div id="myProfile"></div>
</div>

<div id="roomSection" class="card hidden">
<h2>ROOM</h2>
<div id="roomStatus" class="status">Memuat...</div>
<div id="roomControls">
<button id="createRoomButton">BUAT ROOM</button>
<button id="joinRoomButton" class="hidden">JOIN</button>
</div>
<h3>Pemain</h3>
<div id="roomPlayers"></div>
<div id="startArea" class="hidden">
<button id="startButton">MULAI</button>
<p id="startMessage" class="message"></p>
</div>
</div>

<div id="gameScreen" class="card hidden">
<h2>GAME DIMULAI</h2>
<p>Semua pemain telah masuk ke permainan.</p>
<p class="message">Mekanik game akan dibuat pada STEP berikutnya.</p>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getDatabase,ref,push,set,get,onValue}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyBQmI-9ES6AqE5AFy49hIyP0rhul9gIlkc",
authDomain:"buckshotroulette-4c7a1.firebaseapp.com",
databaseURL:"https://buckshotroulette-4c7a1-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"buckshotroulette-4c7a1",
storageBucket:"buckshotroulette-4c7a1.firebasestorage.app",
messagingSenderId:"335951554199",
appId:"1:335951554199:web:8d7475fc9dda0f76b32bd2",
measurementId:"G-H5RLT7K97W"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let currentPlayerId=null;
let currentPlayer=null;

const playerSection=document.getElementById("playerSection");
const profileSection=document.getElementById("profileSection");
const roomSection=document.getElementById("roomSection");
const gameScreen=document.getElementById("gameScreen");
const nameInput=document.getElementById("nameInput");
const profileInput=document.getElementById("profileInput");
const savePlayerButton=document.getElementById("savePlayerButton");
const playerMessage=document.getElementById("playerMessage");
const myProfile=document.getElementById("myProfile");
const roomStatus=document.getElementById("roomStatus");
const roomControls=document.getElementById("roomControls");
const createRoomButton=document.getElementById("createRoomButton");
const joinRoomButton=document.getElementById("joinRoomButton");
const roomPlayers=document.getElementById("roomPlayers");
const startArea=document.getElementById("startArea");
const startButton=document.getElementById("startButton");
const startMessage=document.getElementById("startMessage");

function showProfile(){
playerSection.classList.add("hidden");
profileSection.classList.remove("hidden");
roomSection.classList.remove("hidden");
myProfile.innerHTML="";
const div=document.createElement("div");
div.className="player";
const img=document.createElement("img");
img.src=currentPlayer.profile||"";
img.onerror=()=>img.style.display="none";
const span=document.createElement("span");
span.textContent=currentPlayer.name;
div.append(img,span);
myProfile.appendChild(div);
}

async function loadPlayer(){
const savedId=localStorage.getItem("buckshotPlayerId");
if(!savedId)return;
try{
const snapshot=await get(ref(db,"players/"+savedId));
if(snapshot.exists()){
currentPlayerId=savedId;
currentPlayer=snapshot.val();
showProfile();
listenToRoom();
}
}catch(error){console.error(error);}
}

savePlayerButton.addEventListener("click",async()=>{
const name=nameInput.value.trim();
const profile=profileInput.value.trim();
if(!name){
playerMessage.textContent="Nama wajib diisi.";
return;
}
savePlayerButton.disabled=true;
playerMessage.textContent="Menyimpan pemain...";
try{
const playersRef=ref(db,"players");
const newPlayerRef=push(playersRef);
currentPlayerId=newPlayerRef.key;
currentPlayer={name:name,profile:profile,createdAt:Date.now()};
await set(newPlayerRef,currentPlayer);
localStorage.setItem("buckshotPlayerId",currentPlayerId);
playerMessage.textContent="";
showProfile();
listenToRoom();
}catch(error){
console.error(error);
playerMessage.textContent="Gagal menyimpan pemain.";
savePlayerButton.disabled=false;
}
});

createRoomButton.addEventListener("click",async()=>{
try{
const snapshot=await get(ref(db,"room"));
if(snapshot.exists()&&snapshot.val().exists){
alert("Room sudah tersedia.");
return;
}
await set(ref(db,"room"),{
exists:true,
status:"lobby",
createdAt:Date.now(),
players:{[currentPlayerId]:true}
});
}catch(error){
console.error(error);
alert("Gagal membuat room.");
}
});

joinRoomButton.addEventListener("click",async()=>{
try{
const snapshot=await get(ref(db,"room"));
if(!snapshot.exists()||!snapshot.val().exists){
alert("Room belum tersedia.");
return;
}
const roomData=snapshot.val();
if(roomData.status==="playing"){
alert("Game sedang berjalan. Kamu tidak dapat JOIN.");
return;
}
await set(ref(db,"room/players/"+currentPlayerId),true);
}catch(error){
console.error(error);
alert("Gagal JOIN room.");
}
});

startButton.addEventListener("click",async()=>{
try{
const snapshot=await get(ref(db,"room"));
if(!snapshot.exists()||!snapshot.val().exists){
alert("Room tidak tersedia.");
return;
}
const roomData=snapshot.val();
if(roomData.status==="playing")return;
const players=roomData.players||{};
const playerCount=Object.keys(players).length;
if(playerCount<2){
startMessage.textContent="Minimal 2 pemain untuk memulai.";
return;
}
await set(ref(db,"room/status"),"playing");
}catch(error){
console.error(error);
startMessage.textContent="Gagal memulai game.";
}
});

function listenToRoom(){
onValue(ref(db,"room"),async(snapshot)=>{
const roomData=snapshot.val();
if(!roomData||!roomData.exists){
roomStatus.textContent="Belum ada room.";
roomPlayers.innerHTML="";
roomControls.classList.remove("hidden");
createRoomButton.classList.remove("hidden");
joinRoomButton.classList.add("hidden");
startArea.classList.add("hidden");
gameScreen.classList.add("hidden");
return;
}

const status=roomData.status||"lobby";
const players=roomData.players||{};
const playerIds=Object.keys(players);

if(status==="playing"){
roomStatus.textContent="GAME SEDANG BERJALAN";
roomControls.classList.add("hidden");
startArea.classList.add("hidden");
gameScreen.classList.remove("hidden");
return;
}

roomStatus.textContent="Room tersedia";
roomControls.classList.remove("hidden");
gameScreen.classList.add("hidden");

roomPlayers.innerHTML="";
for(const playerId of playerIds){
try{
const playerSnapshot=await get(ref(db,"players/"+playerId));
if(!playerSnapshot.exists())continue;
const playerData=playerSnapshot.val();
const div=document.createElement("div");
div.className="player";
const img=document.createElement("img");
if(playerData.profile){
img.src=playerData.profile;
img.onerror=()=>img.style.display="none";
}else{
img.style.display="none";
}
const span=document.createElement("span");
span.textContent=playerData.name||"Player";
div.append(img,span);
roomPlayers.appendChild(div);
}catch(error){console.error(error);}
}

const isJoined=!!players[currentPlayerId];

if(isJoined){
createRoomButton.classList.add("hidden");
joinRoomButton.classList.add("hidden");
startArea.classList.remove("hidden");
if(playerIds.length<2){
startMessage.textContent="Menunggu pemain lain...";
startButton.disabled=true;
}else{
startMessage.textContent=playerIds.length+" pemain siap. Game dapat dimulai.";
startButton.disabled=false;
}
}else{
createRoomButton.classList.add("hidden");
joinRoomButton.classList.remove("hidden");
startArea.classList.add("hidden");
}
});
}

loadPlayer();
</script>
</body>
</html>
