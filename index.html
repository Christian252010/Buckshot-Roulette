<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buckshot Online</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #111;

            color: white;

        }


        .container {

            width: min(90%, 400px);

            margin: 40px auto;

        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

        }


        .card {

            background: #222;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 15px;

        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #444;

            border-radius: 8px;

            background: #111;

            color: white;

        }


        button {

            width: 100%;

            padding: 13px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            background: white;

            color: #111;

            font-weight: bold;

            cursor: pointer;

        }


        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        button:active {

            transform: scale(0.98);

        }


        .hidden {

            display: none;

        }


        .profile {

            text-align: center;

        }


        .profile img {

            width: 80px;

            height: 80px;

            object-fit: cover;

            border-radius: 50%;

            margin-bottom: 10px;

        }


        .room-code {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            letter-spacing: 4px;

            margin: 15px 0;

        }


        .room-status {

            text-align: center;

            margin-bottom: 15px;

        }


        .player {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 10px;

            background: #111;

            border-radius: 8px;

            margin-top: 8px;

        }


        .player img {

            width: 40px;

            height: 40px;

            border-radius: 50%;

            object-fit: cover;

        }


        .player-name {

            font-weight: bold;

        }


        #status {

            margin-top: 15px;

            text-align: center;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        BUCKSHOT ONLINE
    </h1>


    <!-- ================================= -->
    <!-- PEMAIN -->
    <!-- ================================= -->

    <div
        id="playerForm"
        class="card"
    >

        <label for="name">
            Nama
        </label>

        <input
            id="name"
            type="text"
            maxlength="50"
            placeholder="Masukkan nama"
        >


        <label for="profile">
            Profile URL
        </label>

        <input
            id="profile"
            type="url"
            placeholder="https://..."
        >


        <button id="enterButton">
            MASUK
        </button>


        <div id="status"></div>

    </div>


    <!-- ================================= -->
    <!-- PROFILE -->
    <!-- ================================= -->

    <div
        id="playerInfo"
        class="card hidden"
    >

        <div class="profile">

            <img
                id="profileImage"
                src=""
                alt="Profile"
            >

            <h2 id="playerName"></h2>

            <p id="playerId"></p>

        </div>

    </div>


    <!-- ================================= -->
    <!-- ROOM -->
    <!-- ================================= -->

    <div
        id="roomSection"
        class="card hidden"
    >

        <h2>
            ROOM
        </h2>


        <div
            id="roomStatus"
            class="room-status"
        >
            Memeriksa room...
        </div>


        <div
            id="roomCode"
            class="room-code"
        >
        </div>


        <button
            id="createRoomButton"
        >
            BUAT ROOM
        </button>


        <button
            id="joinRoomButton"
            class="hidden"
        >
            JOIN
        </button>


        <h3>
            Pemain
        </h3>


        <div id="playerList">
        </div>

    </div>


</div>


<script type="module">


    // =====================================
    // FIREBASE
    // =====================================

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {

        getDatabase,

        ref,

        push,

        set,

        get,

        onValue

    }
    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    // =====================================
    // CONFIG
    // =====================================

    const firebaseConfig = {

        apiKey:
        "AIzaSyBQmI-9ES6AqE5AFy49hIyP0rhul9gIlkc",

        authDomain:
        "buckshotroulette-4c7a1.firebaseapp.com",

        databaseURL:
        "https://buckshotroulette-4c7a1-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId:
        "buckshotroulette-4c7a1",

        storageBucket:
        "buckshotroulette-4c7a1.firebasestorage.app",

        messagingSenderId:
        "335951554199",

        appId:
        "1:335951554199:web:8d7475fc9dda0f76b32bd2",

        measurementId:
        "G-H5RLT7K97W"

    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getDatabase(app);


    // =====================================
    // ELEMENT
    // =====================================

    const playerForm =
        document.getElementById(
            "playerForm"
        );


    const playerInfo =
        document.getElementById(
            "playerInfo"
        );


    const nameInput =
        document.getElementById(
            "name"
        );


    const profileInput =
        document.getElementById(
            "profile"
        );


    const enterButton =
        document.getElementById(
            "enterButton"
        );


    const status =
        document.getElementById(
            "status"
        );


    const playerName =
        document.getElementById(
            "playerName"
        );


    const playerId =
        document.getElementById(
            "playerId"
        );


    const profileImage =
        document.getElementById(
            "profileImage"
        );


    const roomSection =
        document.getElementById(
            "roomSection"
        );


    const roomStatus =
        document.getElementById(
            "roomStatus"
        );


    const roomCode =
        document.getElementById(
            "roomCode"
        );


    const createRoomButton =
        document.getElementById(
            "createRoomButton"
        );


    const joinRoomButton =
        document.getElementById(
            "joinRoomButton"
        );


    const playerList =
        document.getElementById(
            "playerList"
        );


    // =====================================
    // PLAYER ID
    // =====================================

    let currentPlayerId =
        localStorage.getItem(
            "buckshotPlayerId"
        );


    // =====================================
    // LOAD PLAYER
    // =====================================

    async function loadPlayer() {

        if (!currentPlayerId) {

            return false;

        }


        try {

            const playerRef =
                ref(
                    db,
                    "players/" +
                    currentPlayerId
                );


            const snapshot =
                await get(playerRef);


            if (!snapshot.exists()) {

                localStorage.removeItem(
                    "buckshotPlayerId"
                );

                currentPlayerId = null;

                return false;

            }


            const player =
                snapshot.val();


            playerName.textContent =
                player.name;


            playerId.textContent =
                "ID: " +
                currentPlayerId;


            if (player.profile) {

                profileImage.src =
                    player.profile;

                profileImage.style.display =
                    "block";

            } else {

                profileImage.style.display =
                    "none";

            }


            playerForm.classList.add(
                "hidden"
            );


            playerInfo.classList.remove(
                "hidden"
            );


            roomSection.classList.remove(
                "hidden"
            );


            return true;


        } catch (error) {

            console.error(error);

            return false;

        }

    }


    // =====================================
    // MASUK PEMAIN BARU
    // =====================================

    enterButton.addEventListener(
        "click",
        async () => {

            const name =
                nameInput.value.trim();


            const profile =
                profileInput.value.trim();


            if (!name) {

                status.textContent =
                    "Nama wajib diisi.";

                return;

            }


            enterButton.disabled =
                true;


            status.textContent =
                "Menyimpan pemain...";


            try {

                const playersRef =
                    ref(
                        db,
                        "players"
                    );


                const newPlayerRef =
                    push(playersRef);


                const newPlayerId =
                    newPlayerRef.key;


                const playerData = {

                    name: name,

                    profile:
                        profile || "",

                    createdAt:
                        Date.now()

                };


                await set(
                    newPlayerRef,
                    playerData
                );


                localStorage.setItem(
                    "buckshotPlayerId",
                    newPlayerId
                );


                currentPlayerId =
                    newPlayerId;


                playerName.textContent =
                    name;


                playerId.textContent =
                    "ID: " +
                    newPlayerId;


                if (profile) {

                    profileImage.src =
                        profile;

                    profileImage.style.display =
                        "block";

                } else {

                    profileImage.style.display =
                        "none";

                }


                playerForm.classList.add(
                    "hidden"
                );


                playerInfo.classList.remove(
                    "hidden"
                );


                roomSection.classList.remove(
                    "hidden"
                );


                status.textContent = "";


                listenToRoom();


            } catch (error) {

                console.error(
                    "FIREBASE ERROR:",
                    error
                );


                status.textContent =
                    "Error: " +
                    error.message;


                enterButton.disabled =
                    false;

            }

        }
    );


    // =====================================
    // BUAT ROOM
    // =====================================

    createRoomButton.addEventListener(
        "click",
        async () => {

            if (!currentPlayerId) {

                return;

            }


            createRoomButton.disabled =
                true;


            try {

                const roomRef =
                    ref(
                        db,
                        "room"
                    );


                await set(
                    roomRef,
                    {

                        exists: true,

                        createdAt:
                            Date.now(),

                        players: {

                            [currentPlayerId]:
                                true

                        }

                    }
                );


                console.log(
                    "Room berhasil dibuat"
                );


            } catch (error) {

                console.error(
                    "Gagal membuat room:",
                    error
                );


                createRoomButton.disabled =
                    false;

            }

        }
    );


    // =====================================
    // JOIN ROOM
    // =====================================

    joinRoomButton.addEventListener(
        "click",
        async () => {

            if (!currentPlayerId) {

                return;

            }


            try {

                const playerRoomRef =
                    ref(
                        db,
                        "room/players/" +
                        currentPlayerId
                    );


                await set(
                    playerRoomRef,
                    true
                );


                console.log(
                    "Berhasil JOIN room"
                );


            } catch (error) {

                console.error(
                    "Gagal JOIN:",
                    error
                );

            }

        }
    );


    // =====================================
    // LISTEN ROOM REALTIME
    // =====================================

    function listenToRoom() {

        const roomRef =
            ref(
                db,
                "room"
            );


        onValue(
            roomRef,
            async (snapshot) => {

                if (!snapshot.exists()) {

                    roomStatus.textContent =
                        "Belum ada room.";

                    roomCode.textContent =
                        "";


                    createRoomButton.classList.remove(
                        "hidden"
                    );


                    joinRoomButton.classList.add(
                        "hidden"
                    );


                    playerList.innerHTML =
                        "";


                    return;

                }


                const room =
                    snapshot.val();


                roomStatus.textContent =
                    "Room tersedia";


                roomCode.textContent =
                    "ROOM";


                createRoomButton.classList.add(
                    "hidden"
                );


                const players =
                    room.players || {};


                // =================================
                // CEK APAKAH SUDAH JOIN
                // =================================

                if (
                    players[currentPlayerId]
                ) {

                    joinRoomButton.classList.add(
                        "hidden"
                    );

                } else {

                    joinRoomButton.classList.remove(
                        "hidden"
                    );

                }


                // =================================
                // TAMPILKAN PLAYER
                // =================================

                playerList.innerHTML =
                    "";


                const playerIds =
                    Object.keys(players);


                for (
                    const id
                    of playerIds
                ) {

                    const playerRef =
                        ref(
                            db,
                            "players/" + id
                        );


                    const playerSnapshot =
                        await get(
                            playerRef
                        );


                    if (
                        !playerSnapshot.exists()
                    ) {

                        continue;

                    }


                    const player =
                        playerSnapshot.val();


                    const playerElement =
                        document.createElement(
                            "div"
                        );


                    playerElement.className =
                        "player";


                    let imageHTML =
                        "";


                    if (player.profile) {

                        imageHTML =
                            `<img src="${player.profile}">`;

                    }


                    playerElement.innerHTML =

                        imageHTML +

                        `<div class="player-name">
                            ${player.name}
                        </div>`;


                    playerList.appendChild(
                        playerElement
                    );

                }

            }
        );

    }


    // =====================================
    // MULAI
    // =====================================

    const existingPlayer =
        await loadPlayer();


    if (existingPlayer) {

        listenToRoom();

    }


</script>

</body>

</html>
