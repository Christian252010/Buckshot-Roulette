<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Recovery Account</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#1f1f1f;
    color:#fff;
}

body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.recovery{
    width:100%;
    max-width:380px;
    background:#2f2f2f;
    border-radius:14px;
    padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.icon{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#dc143c;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
}

.icon svg{
    width:28px;
    height:28px;
}

h1{
    margin:0;
    text-align:center;
    font-size:22px;
}

.desc{
    margin:10px 0 22px;
    text-align:center;
    color:#aaa;
    font-size:14px;
    line-height:1.5;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#ddd;
}

input{
    width:100%;
    height:46px;
    border:none;
    outline:none;
    border-radius:8px;
    background:#1f1f1f;
    color:#fff;
    padding:0 14px;
    font-size:14px;
}

input:focus{
    box-shadow:0 0 0 2px #dc143c;
}

button{
    width:100%;
    height:46px;
    margin-top:14px;
    border:none;
    border-radius:8px;
    background:#dc143c;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    background:#666;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;
    margin-top:14px;
    padding:11px;
    border-radius:8px;
    background:#1f1f1f;
    text-align:center;
    font-size:13px;
    line-height:1.4;
}

.message.show{
    display:block;
}

.message.error{
    color:#ff6b6b;
}

.message.success{
    color:#6cff9a;
}

.message.loading{
    color:#aaa;
}
</style>
</head>

<body>

<div class="recovery">

    <div class="icon">
        <i data-lucide="key-round"></i>
    </div>

    <h1>Recovery Account</h1>

    <div class="desc">
        Masukkan ID pemain untuk memulihkan
        akun yang tersimpan di perangkat ini.
    </div>

    <label for="playerId">Masukan ID</label>

    <input
        id="playerId"
        type="text"
        placeholder="Masukkan ID pemain"
        autocomplete="off"
        spellcheck="false"
    >

    <button id="recoveryBtn">
        Recovery
    </button>

    <div id="message" class="message"></div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyBQYI-9ESAqE5AFy49hIyP0rhul9gIlkc",

    authDomain:
        "buckshotroulette-4c7a1.firebaseapp.com",

    databaseURL:
        "https://buckshotroulette-4c7a1-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "buckshotroulette-4c7a1",

    storageBucket:
        "buckshotroulette-4c7a1.firebasestorage.app",

    messagingSenderId:
        "335951554199",

    appId:
        "1:335951554199:web:8d7475fc9dda0f76b32bd2",

    measurementId:
        "G-H5RLT7K97W"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* =========================
   ELEMENT
========================= */

const playerIdInput =
    document.getElementById("playerId");

const recoveryBtn =
    document.getElementById("recoveryBtn");

const message =
    document.getElementById("message");


/* =========================
   MESSAGE
========================= */

function showMessage(text, type){

    message.textContent = text;

    message.className =
        "message show " + type;
}


/* =========================
   RECOVERY
========================= */

async function recovery(){

    const newId =
        playerIdInput.value.trim();

    if(!newId){

        showMessage(
            "Masukkan ID pemain terlebih dahulu.",
            "error"
        );

        playerIdInput.focus();

        return;
    }


    recoveryBtn.disabled = true;

    showMessage(
        "Memeriksa ID pemain...",
        "loading"
    );


    try{

        /*
         * Ambil akun langsung dari Firebase
         */

        const playerRef =
            ref(
                db,
                "players/" + newId
            );

        const snapshot =
            await get(playerRef);


        /*
         * ID tidak ditemukan
         */

        if(!snapshot.exists()){

            showMessage(
                "ID pemain tidak ditemukan.",
                "error"
            );

            recoveryBtn.disabled = false;

            return;
        }


        /*
         * Data pemain ditemukan
         */

        const playerData =
            snapshot.val();


        showMessage(
            "ID pemain ditemukan. Memulihkan akun...",
            "success"
        );


        /*
         * =========================
         * HAPUS ID LAMA
         * =========================
         */

        /*localStorage.removeItem(
            "buckshotPlayerId"
        );*/


        /*
         * =========================
         * SIMPAN ID BARU
         * =========================
         */

        localStorage.setItem(
            "buckshotPlayerId",
            newId
        );


        /*
         * =========================
         * VERIFIKASI LOCAL STORAGE
         * =========================
         */

        const savedId =
            localStorage.getItem(
                "buckshotPlayerId"
            );


        if(savedId !== newId){

            showMessage(
                "ID gagal disimpan ke perangkat.",
                "error"
            );

            recoveryBtn.disabled = false;

            return;
        }


        /*
         * =========================
         * VERIFIKASI LAGI FIREBASE
         * =========================
         */

        const verifyRef =
            ref(
                db,
                "players/" + savedId
            );

        const verifySnapshot =
            await get(verifyRef);


        if(!verifySnapshot.exists()){

            showMessage(
                "Akun tidak dapat diverifikasi.",
                "error"
            );

            recoveryBtn.disabled = false;

            return;
        }


        /*
         * =========================
         * SELESAI
         * =========================
         */

        showMessage(
            "Recovery berhasil. Membuka game...",
            "success"
        );


        /*
         * Beri waktu agar localStorage
         * benar-benar tersimpan sebelum
         * berpindah halaman.
         */

        setTimeout(() => {

            window.location.replace(
                "./index.html"
            );

        }, 800);


    }catch(error){

        console.error(
            "Recovery error:",
            error
        );

        showMessage(
            "Terjadi kesalahan saat recovery.",
            "error"
        );

        recoveryBtn.disabled = false;
    }
}


/* =========================
   BUTTON
========================= */

recoveryBtn.addEventListener(
    "click",
    recovery
);


/* =========================
   ENTER
========================= */

playerIdInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            recovery();
        }

    }
);


/* =========================
   LUCIDE
========================= */

if(window.lucide){
    lucide.createIcons();
}

</script>

</body>
</html>
