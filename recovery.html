<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recovery Account</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#1f1f1f;
    color:#fff;
}

body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.recovery{
    width:100%;
    max-width:380px;
    background:#2f2f2f;
    border-radius:14px;
    padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.icon{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#dc143c;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
}

.icon svg{
    width:28px;
    height:28px;
}

h1{
    margin:0;
    text-align:center;
    font-size:22px;
}

.desc{
    margin:10px 0 22px;
    text-align:center;
    color:#aaa;
    font-size:14px;
    line-height:1.5;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#ddd;
}

input{
    width:100%;
    height:46px;
    border:none;
    outline:none;
    border-radius:8px;
    background:#1f1f1f;
    color:#fff;
    padding:0 14px;
    font-size:14px;
}

input:focus{
    box-shadow:0 0 0 2px #dc143c;
}

button{
    width:100%;
    height:46px;
    margin-top:14px;
    border:none;
    border-radius:8px;
    background:#dc143c;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.message{
    display:none;
    margin-top:14px;
    padding:11px;
    border-radius:8px;
    background:#1f1f1f;
    text-align:center;
    font-size:13px;
    line-height:1.4;
}

.message.show{
    display:block;
}

.message.error{
    color:#ff6b6b;
}

.message.success{
    color:#6cff9a;
}
</style>
</head>

<body>

<div class="recovery">

    <div class="icon">
        <i data-lucide="key-round"></i>
    </div>

    <h1>Recovery Account</h1>

    <div class="desc">
        Masukkan ID pemain kamu untuk memulihkan
        akun yang tersimpan di perangkat ini.
    </div>

    <label for="playerId">Masukan ID</label>

    <input
        id="playerId"
        type="text"
        placeholder="Masukkan ID pemain"
        autocomplete="off"
    >

    <button id="recoveryBtn">
        Recovery
    </button>

    <div id="message" class="message"></div>

</div>

<script>
lucide.createIcons();

const playerIdInput = document.getElementById("playerId");
const recoveryBtn = document.getElementById("recoveryBtn");
const message = document.getElementById("message");

function showMessage(text, type){
    message.textContent = text;
    message.className = "message show " + type;
}

recoveryBtn.addEventListener("click", () => {

    const id = playerIdInput.value.trim();

    if(!id){
        showMessage("Masukkan ID pemain terlebih dahulu.", "error");
        return;
    }

    /*
     * Simpan kembali ID pemain ke localStorage.
     *
     * KEY INI HARUS SAMA dengan yang digunakan
     * oleh index.html game kamu.
     */
    localStorage.setItem("playerId", id);

    showMessage("ID berhasil dipulihkan ke perangkat ini.", "success");

    setTimeout(() => {
        window.location.href = "index.html";
    }, 1000);
});

playerIdInput.addEventListener("keydown", e => {
    if(e.key === "Enter"){
        recoveryBtn.click();
    }
});
</script>

</body>
</html>
